<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">

<title>Minimal Chat with Full Features</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: 'Tahoma', sans-serif;
  color: #222;
  display: flex;
  flex-direction: column;
  overflow: hidden;

  /* Background image */
  background: url('site-background.webp') no-repeat center center fixed;
  background-size: cover;
  position: relative;
}

/* Glass overlay (must NOT block clicks) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  z-index: 0;
  pointer-events: none;
}

#chat {
  flex-grow: 1;
  width: 100%;
  padding: 20px 5vw 160px 80px;
  overflow-y: auto;
  font-size: 12px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  box-sizing: border-box;
  border-radius: 12px;
  position: relative;
  z-index: 1;
}

/* Live results area */
#liveResults {
  position: relative;
  z-index: 2;
}

/* Message bubbles */
.message {
  margin-left: 7px;
  margin-bottom: 8px;
  line-height: 1.6;
  font-size: 12px;
  white-space: pre-wrap;
  word-wrap: break-word;
  word-break: break-word;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.message.user { align-items: flex-end; }

.message.bot {
  border-top: 1px solid rgba(0, 0, 0, 0.1);
  padding-top: 12px;
  margin-top: 12px;
  margin-left: 7px;
}

.message img {
  max-width: 100%;
  margin-top: 6px;
  border-radius: 8px;
}

.editableNote a:not(.conceptLink),
.chatBubble a:not(.conceptLink) {
  color: #1a0dab;
  text-decoration: underline;
}

.chatBubble {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border-radius: 16px;
  padding: 10px 16px;
  max-width: 88%;

  border: 1px solid rgba(0, 0, 0, 0.05);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);

  color: #1f1f1f;
}

.chatBubble { position: relative; overflow: visible; }
.message { overflow: visible; }

.message.user .chatBubble {
  background: rgba(248, 244, 246, 0.75);
}

.message.bot .chatBubble {
  background: rgba(255, 255, 255, 0.75);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

input[type="file"]::file-selector-button {
  background: rgba(255, 255, 255, 0.25);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 8px;
  padding: 6px 12px;
  color: #333;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
  transition: box-shadow 0.3s ease;
}

input[type="file"]::file-selector-button:hover {
  background: rgba(255, 255, 255, 0.5);
  box-shadow: 0 0 20px 6px rgba(255, 255, 255, 0.7);
  color: #111;
}

/* Input Area */
#inputArea {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  width: 90vw;
  max-width: 600px;
  gap: 10px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(100, 100, 100, 0.1);
  z-index: 100;
  box-sizing: border-box;
}

#inputArea, #notePanel {
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
}

#userInput {
  flex-grow: 1;
  font-size: 12px;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid #ddd;
  background: #f9f9f9;
  color: #3a3a3a;
  outline: none;
}

#userInput:focus {
  border-color: #999;
  box-shadow: 0 0 6px rgba(100, 100, 100, 0.4);
}

#sendBtn { display: none; }

/* Note Input */
#noteInput {
  min-height: 60px;
  max-height: 400px;
  overflow-y: auto;
  font-size: 13px;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  background: rgba(255, 255, 255, 0.15);
  color: #222;
  outline: none;
  white-space: pre-wrap;
  margin-top: 0 !important;
  padding-top: 0 !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 0 10px 3px rgba(255, 255, 255, 0.3);
}

#noteInput:empty:before {
  content: attr(data-placeholder);
  color: #aaa;
  pointer-events: none;
  display: block;
}

/* Editable Notes */
.editableNote {
  background: none;
  color: #222;
  padding: 4px;
  border: none;
  font-size: 12px;
  font-family: 'Tahoma', sans-serif;
  white-space: pre-wrap;
  outline: none;
}



.resizableEmoji {
  display: inline-block;
  font-size: 1em;
  font-weight: normal;
  line-height: inherit;
  vertical-align: baseline;
  transform: none;
}

/* Normal-size inline symbols (arrows, ≤, ≥, etc.) */
.inlineSymbol {
  display: inline-block;
  font: inherit;
  line-height: inherit;
  vertical-align: baseline;
  transform: none;
  color: inherit;
  -webkit-text-fill-color: currentColor;
}

/* Tag chips under notes */
.tagRow{
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tagChip{
  font-family: 'Tahoma', sans-serif;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 999px;
  cursor: pointer;
  user-select: none;

  background: rgba(208, 160, 163, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: #444;
  opacity: 0.9;
}

.tagChip:hover{
  opacity: 1;
  transform: scale(1.03);
}

/* Toolbar + Toggle */
#formatToggle {
  position: fixed;
  bottom: 40px;
  left: 20px;
  font-size: 20px;
  background: rgba(235, 235, 235, 0.25);
  border-radius: 50%;
  width: 44px;
  height: 44px;
  text-align: center;
  line-height: 44px;
  cursor: pointer;
  z-index: 105;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #444;
  transition: box-shadow 0.3s ease;
}

#formatToggle:hover {
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.75);
  color: #222;
}

#formatToolbar {
  position: fixed;
  bottom: 80px;
  left: 20px;
  display: none;
  flex-direction: column;
  flex-wrap: nowrap;
  gap: 8px;
  align-items: center;
  justify-content: flex-start;
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 10px;
  padding: 5px 6px;
  z-index: 104;
  max-height: 500px;
  max-width: 90vw;
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  scrollbar-width: none;
  -ms-overflow-style: none;
  color: #444;
}

#formatToolbar.visible { display: flex; }

.format-btn {
  flex: 0 0 auto;
  background: none;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: #444;
  padding: 6px;
  border-radius: 6px;
  opacity: 0.7;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.format-btn:hover {
  transform: scale(1.2);
  opacity: 1;
  color: #222;
}

#fontColorPalette {
  display: none;
  grid-template-columns: repeat(3, 18px);
  gap: 5px;
  padding: 5px;
  border-radius: 8px;
  background: rgba(255,255,255,0.82);
}

#fontColorPalette.visible { display: grid; }

.font-color-choice {
  width: 18px;
  height: 18px;
  padding: 0;
  border: 1px solid rgba(0,0,0,0.22);
  border-radius: 4px;
  cursor: pointer;
}

.emoji {
  background: none;
  color: #444;
  border: none;
  cursor: pointer;
  opacity: 0.7;
  font-size: 16px;
  transition: all 0.2s ease;
}

.emoji:hover {
  transform: scale(1.2);
  opacity: 1;
}

/* Note Panel */
#noteContainer {
  position: fixed;
  bottom: 40px;
  right: 20px;
  width: 50px;
  height: 50px;
  z-index: 103;
}

/* Click-to-select image + resize handles (JS adds .img-selected) */
.editableNote img,
#noteInput img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 10px 0;
  border-radius: 8px;
}

.img-selected {
  outline: 2px solid rgba(208, 160, 163, 0.9);
  outline-offset: 2px;
}

/* Tiny floating resize panel */
#imgSizePanel {
  position: fixed;
  z-index: 10060;
  display: none;
  gap: 8px;
  align-items: center;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);
  font-size: 12px;
}

#imgSizePanel input[type="range"] { width: 120px; }
#imgSizePanel input[type="number"] { width: 70px; }
#imgSizePanel button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.8;
}
#imgSizePanel button:hover { opacity: 1; }
#addNoteToggle {
  position: fixed;
  width: 50px;
  height: 50px;
  font-size: 28px;
  border-radius: 50%;
  background: rgba(208, 160, 163, 0.3);
  color: #333;
  border: 1px solid rgba(255, 255, 255, 0.4);
  cursor: pointer;
  box-shadow: 0 0 12px rgba(208, 160, 163, 0.5);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: box-shadow 0.3s ease;
}

#addNoteToggle:hover {
  box-shadow: 0 0 20px rgba(208, 160, 163, 0.8);
  color: #222;
}

/* =========================
   Minimal Table Style (FIXED)
========================= */

.cellBox {
  display: block;
  width: 100%;
  min-height: 24px;
  padding: 6px 8px;
  box-sizing: border-box;

  outline: none;
  white-space: pre-wrap;
  word-break: break-word;

  overflow: hidden;      /* hide scrollbars normally */
  resize: none;          /* no resize handle by default */
  background: transparent;
  transition: background 0.15s ease;
}

/* Show resize ONLY when hovering */
.editable-table td:hover .cellBox,
.editable-table th:hover .cellBox {
  resize: both;
  overflow: auto;        /* enable scroll only when resizing */
}

.editable-table {
  border-collapse: collapse;
  border: 1px solid rgba(0,0,0,0.15);
}

.editable-table th,
.editable-table td {
  border: 1px solid rgba(0,0,0,0.10);
  padding: 0;
  background: transparent;
  vertical-align: top;   /* fixes middle vs left issue */
  text-align: left;
}

.editable-table th .cellBox {
  font-weight: 600;
}

table.editable-table{
  width: 100%;
  table-layout: auto;   /* allow natural growth */
  border-collapse: collapse;
}

table.editable-table td{
  vertical-align: top;
}

.cellBox{
  display: block;
  min-height: 0;        /* no forced height */
  padding: 6px 8px;
  white-space: pre-wrap;
  word-break: break-word;
  outline: none;
}

.cellBox {
  display: block;
  width: 100%;
  min-height: 24px;
  padding: 6px 8px;
  box-sizing: border-box;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  overflow: hidden;
  resize: none;
  background: transparent;
}

/* Floating table controls */



#notePanel {
  position: relative;
  width: 100%;
  box-sizing: border-box;
  background: none;
  color: #222;
  padding: 4px;
  margin: 0 0 12px;
  display: none;
  flex-direction: column;
  gap: 6px;
  border: none;
  transition: none;
}

#notePanel #noteInput {
  background: none;
  color: #222;
  padding: 4px;
  border: none;
  font-size: 12px;
  font-family: 'Tahoma', sans-serif;
  white-space: pre-wrap;
  outline: none;
  box-shadow: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

#notePanel .new-note-actions {
  text-align: center;
  margin-top: 6px;
}

#addNoteBtn,
#cancelAddNoteBtn,
#newNoteImageBtn,
#newNoteEmojiBtn,
#newNoteArrowBtn {
  background: none;
  color: #666;
  border: none;
  padding: 0;
  font-size: 16px;
  cursor: pointer;
  margin-right: 12px;
}

#addNoteBtn:hover,
#cancelAddNoteBtn:hover,
#newNoteImageBtn:hover,
#newNoteEmojiBtn:hover,
#newNoteArrowBtn:hover {
  transform: scale(1.08);
}

/* =========================
   Concept pills (INLINE-FRIENDLY)
   - still looks like a pill
   - doesn’t “stand off” inside sentences
========================= */
.chatBubble a.conceptLink,
.editableNote a.conceptLink,
a.conceptLink,
a.conceptLink:visited {
  color: #2a2a2a !important;
  text-decoration: none !important;

  display: inline-flex;           /* key: inline + stable */
  align-items: baseline;          /* keeps text aligned */
  gap: 4px;                       /* space before badge */
  vertical-align: baseline;

  padding: 0 6px;                 /* tighter than before */
  border-radius: 10px;            /* less “capsule” */

  /* subtle pill by default */
  background: rgba(208, 160, 163, 0.15);
  border: 1px solid rgba(208, 160, 163, 0.22);

  /* flatter so it doesn’t pop off the line */
  box-shadow: none;

  /* make it readable in sentences */
  line-height: 1.25;
  transform: translateY(0.35px);  /* tiny optical baseline fix */

  cursor: pointer;
  transition:
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease,
    transform 0.12s ease;
}


/* tiny visual cue that this concept has an image */
a.conceptLink.hasKbImage::after{
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-left: 5px;
  border-radius: 999px;
  vertical-align: middle;
  background: rgba(170, 150, 210, 0.9);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.7);
}

/* Add a super subtle “link cue” without blue underline */
.chatBubble a.conceptLink,
.editableNote a.conceptLink,
a.conceptLink {
  text-decoration: none !important;
}

/* Hover: more pill + slight lift (only when you interact) */
.chatBubble a.conceptLink:hover,
.editableNote a.conceptLink:hover,
a.conceptLink:hover {
  background: rgba(208, 160, 163, 0.20);
  border-color: rgba(208, 160, 163, 0.40);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.10);

  transform: translateY(-0.5px);
  text-decoration-style: solid;
}

/* Keyboard focus (soft but visible) */
.chatBubble a.conceptLink:focus-visible,
.editableNote a.conceptLink:focus-visible,
a.conceptLink:focus-visible {
  outline: 2px solid rgba(208, 160, 163, 0.35);
  outline-offset: 2px;
}


/* Keyboard focus: visible but still soft */
.chatBubble a.conceptLink:focus-visible,
.editableNote a.conceptLink:focus-visible {
  outline: 2px solid rgba(208, 160, 163, 0.35);
  outline-offset: 2px;
}

/* Concept count badge */
.conceptCount {
  margin-left: 2px;        /* smaller */
  padding: 0 5px;          /* tighter */
  font-size: 9px;
  font-weight: 700;
  border-radius: 999px;
  line-height: 1.2;

  background: rgba(140, 150, 200, 0.18);
  border: 1px solid rgba(140, 150, 200, 0.28);
  color: #444;

  box-shadow: none;
  transform: translateY(-0.5px); /* sits nicer with text */
}

.conceptCount::before {
  content: attr(data-count);
}

/* Hashtag suggest dropdown */
#tagSuggest {
  position: fixed;
  display: none;
  z-index: 10090;

  min-width: 180px;
  max-width: 70vw;
  max-height: 220px;
  overflow: auto;

  padding: 6px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);

  font-size: 12px;
}

#tagSuggest .item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  padding: 6px 10px;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  color: #333;
}

#tagSuggest .item:hover,
#tagSuggest .item.active {
  background: rgba(208, 160, 163, 0.22);
}

#tagSuggest .count {
  opacity: 0.65;
  font-size: 11px;
}

/* Temporary search matches: quiet enough for dense clinical notes. */
.underlineMatch,
mark.underlineMatch {
  background: rgba(183, 130, 139, 0.16) !important;
  color: inherit !important;
  border-bottom: 1px solid rgba(126, 76, 86, 0.48);
  padding: 0 1px;
  border-radius: 3px;
  box-shadow: none !important;
}



/* Floating emoji button + picker */
#floatingEmojiBtn {
  position: fixed;
  display: none;
  z-index: 10050;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);

  user-select: none;

  justify-content: center;

#floatingEmojiBtn:hover {

}

#floatingEmojiPanel {
  position: fixed;
  display: none;
  z-index: 10051;
  padding: 8px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.40);

#floatingEmojiPanel .pick {

#floatingEmojiPanel .pick:hover {

}

#floatingEmojiPanel.symbolPicker .pick {
  color: #000 !important;
  -webkit-text-fill-color: #000;
  font-family: "Segoe UI Symbol", Arial, sans-serif;
}

/* YouTube links open in a lightweight in-page player. */
#youtubePlayerOverlay {
  position: fixed;
  inset: 0;
  z-index: 12000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-sizing: border-box;
  background: rgba(28, 24, 27, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

#youtubePlayerOverlay.is-open { display: flex; }

.youtube-player-dialog {
  width: min(900px, 94vw);
  padding: 12px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 16px;
  background: rgba(250, 244, 245, .92);
  box-shadow: 0 18px 60px rgba(0,0,0,.35), 0 0 22px rgba(208,160,163,.3);
}

.youtube-player-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 11px;
  background: #000;
}

.youtube-player-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

.youtube-player-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
  margin-top: 9px;
  font: 12px Tahoma, sans-serif;
}

.youtube-player-actions a { color: #604853; }

#youtubePlayerClose {
  border: 0;
  background: none;
  color: #604853;
  font-size: 18px;
  cursor: pointer;
}

/* =========================
   Concept Definition Panel
========================= */
#defPanel {
  position: fixed;
  z-index: 10110;
  display: none;
  flex-direction: column;
  width: min(360px, 86vw);
  height: 60vh;
  height: min(520px, 60dvh);
  overflow: hidden;

  padding: 10px 12px;
  border-radius: 14px;

  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.18);

  color: #222;
  font-family: 'Tahoma', sans-serif;
}

#defTip {

function cleanPastedBackgroundFormatting(html) {
  const container = document.createElement('div');
  container.innerHTML = html;
  let changed = false;

  container.querySelectorAll('*').forEach(element => {
    if (element.tagName === 'MARK') {
      element.replaceWith(...element.childNodes);
      changed = true;
      return;
    }

    ['background', 'background-color', 'background-image'].forEach(property => {
      if (element.style.getPropertyValue(property)) {
        element.style.removeProperty(property);
        changed = true;
      }
    });
    if (element.hasAttribute('bgcolor')) {
      element.removeAttribute('bgcolor');
      changed = true;
    }
    if (element.classList.contains('gradient-highlight')) {
      element.classList.remove('gradient-highlight');
      changed = true;
    }
    if (!element.getAttribute('style')?.trim()) element.removeAttribute('style');
    if (!element.getAttribute('class')?.trim()) element.removeAttribute('class');
  });

  if (!changed) return null;
  return window.CEPSecurity?.sanitizeHTML
    ? window.CEPSecurity.sanitizeHTML(container.innerHTML)
    : '';
}

/* =========================
   Indent UX fix:
   - Backspace at start of an indented block => outdent
   - Enter on an empty indented line => outdent
========================= */

function getClosestBlockEl(node, editor) {
  let el = node?.nodeType === 1 ? node : node?.parentElement;
  while (el && el !== editor) {
    const tag = (el.tagName || '').toLowerCase();
    if (tag === 'blockquote' || tag === 'li' || tag === 'p' || tag === 'div') return el;
    el = el.parentElement;
  }
  return null;
}

function isBlockEmpty(block) {
  if (!block) return true;
  // treat <br> or whitespace as empty
  const text = (block.textContent || '').replace(/\u200B/g, '').trim();
  if (text) return false;

  // if it only contains <br> or empty spans etc, count as empty
  const html = (block.innerHTML || '').replace(/\u200B/g, '').trim().toLowerCase();
  return html === '' || html === '<br>' || html === '<br/>' || html === '<br />' || html === '&nbsp;';
}

function isCaretAtStartOfBlock(range, block) {
  if (!range || !block) return false;

  // If caret is directly in the block and at offset 0
  if (range.startContainer === block && range.startOffset === 0) return true;

  // Otherwise: check if there's any text/content before caret inside this block
  const testRange = document.createRange();
  testRange.setStart(block, 0);
  testRange.setEnd(range.startContainer, range.startOffset);

  const fragText = (testRange.toString() || '').replace(/\u200B/g, '').trim();
  return fragText.length === 0;
}

// Capture key behavior inside editors only
document.addEventListener('keydown', (e) => {
  // ✅ Don't let indent logic touch the definition panel boxes
  if (defPanel && defPanel.contains(e.target)) return;

  const editor = getActiveEditor();
  if (!editor) return;

  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  if (!sel.isCollapsed) return;

  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return;

  const block = getClosestBlockEl(range.startContainer, editor);
  if (!block) return;

  const tag = (block.tagName || '').toLowerCase();

  // Detect indent even when Safari uses margin/padding instead of <blockquote>
  function hasLeftIndent(el){
    let cur = el;
    let steps = 0;

    while (cur && cur !== editor && steps < 4) {
      const cs = getComputedStyle(cur);
      const ml = parseFloat(cs.marginLeft) || 0;
      const pl = parseFloat(cs.paddingLeft) || 0;
      if (ml > 0.5 || pl > 0.5) return true;

      cur = cur.parentElement;
      steps++;
    }
    return false;
  }

  const inIndentContext =
    (tag === 'blockquote') ||
    (tag === 'li') ||
    hasLeftIndent(block);

  // 1) Backspace at start => outdent
  if (e.key === 'Backspace' && inIndentContext && isCaretAtStartOfBlock(range, block)) {
    e.preventDefault();
    document.execCommand('outdent');
    saveCaret();
    return;
  }

  // 2) Enter ALWAYS exits indent
  if (e.key === 'Enter' && inIndentContext && !e.shiftKey) {
    e.preventDefault();

    // create a new line then exit indent for that new line
    document.execCommand('insertParagraph');
    document.execCommand('outdent');

    saveCaret();
    return;
  }
}, true);

/* =========================
   Font size (robust, works on spans + selection)
========================= */
function getSelectionRangeInEditor(editor) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return null;
  return range;
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

function getFontSizePxFromNode(node, fallbackPx = 12) {
  const el = (node?.nodeType === 1) ? node : node?.parentElement;
  if (!el) return fallbackPx;
  const px = parseFloat(getComputedStyle(el).fontSize);
  return Number.isFinite(px) ? px : fallbackPx;
}

function bumpFontSize(deltaPx) {
  const editor = getActiveEditor();
  if (!editor) return;

  editor.focus({ preventScroll: true });
  restoreCaret();

  const range = getSelectionRangeInEditor(editor);
  if (!range) return;

  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;

  if (!editor.contains(range.commonAncestorContainer)) return;

  const selectedText = sel.toString();
  if (!selectedText.trim()) return;

  const startEl = (range.startContainer.nodeType === 1)
    ? range.startContainer
    : range.startContainer.parentElement;

  const sizedSpan = startEl?.closest?.('span[data-fs="1"]') || null;

  if (sizedSpan && editor.contains(sizedSpan)) {
    const spanText = (sizedSpan.innerText || sizedSpan.textContent || '').trim();
    if (spanText && spanText === selectedText.trim()) {
      const cur = parseFloat(sizedSpan.style.fontSize) || getFontSizePxFromNode(sizedSpan, 12);
      const next = clamp(Math.round(cur + deltaPx), 8, 42);
      sizedSpan.style.fontSize = next + 'px';

      const r = document.createRange();
      r.selectNodeContents(sizedSpan);
      sel.removeAllRanges();
      sel.addRange(r);
      saveCaret();
      return;
    }
  }

  const basePx = getFontSizePxFromNode(range.startContainer, parseFloat(getComputedStyle(editor).fontSize) || 12);
  const nextPx = clamp(Math.round(basePx + deltaPx), 8, 42);

  const wrapper = document.createElement('span');
  wrapper.setAttribute('data-fs', '1');
  wrapper.style.fontSize = nextPx + 'px';

  const frag = range.extractContents();
  wrapper.appendChild(frag);
  range.insertNode(wrapper);

  const newRange = document.createRange();
  newRange.selectNodeContents(wrapper);
  sel.removeAllRanges();
  sel.addRange(newRange);

  saveCaret();
}

let lastTableCell = null;

document.addEventListener('focusin', (e) => {

function makeTable(rows = 2, cols = 2) {
  const table = document.createElement('table');
  table.className = 'editable-table';
  table.setAttribute('data-editable-table', '1');

  const tbody = document.createElement('tbody');

  for (let r = 0; r < rows; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const td = document.createElement(r === 0 ? 'th' : 'td');
      const cell = document.createElement('div');
      cell.className = 'cellBox';
      cell.contentEditable = 'true';
      cell.innerHTML = '&nbsp;';
      td.appendChild(cell);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  return table;
}

function getClosestTableContext() {
  const editor = getActiveEditor();
  if (!editor) return null;

  const sel = window.getSelection();
  const node = sel?.anchorNode || null;

  let el = node ? (node.nodeType === 1 ? node : node.parentElement) : null;

  if (!el || !editor.contains(el)) {
    el = lastTableCell ? lastTableCell : null;
  }

  const cell = el?.closest?.('.cellBox') || null;
  const table = el?.closest?.('table.editable-table') || null;

  return { editor, table, cell };
}

function insertNodeAtCaret(node) {
  const editor = getActiveEditor();
  if (!editor) return;

  editor.focus({ preventScroll: true });
  restoreCaret();

  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) {
    editor.appendChild(node);
    placeCaretAtEnd(editor);
    return;
  }

  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) {
    editor.appendChild(node);
    placeCaretAtEnd(editor);
    return;
  }

  range.deleteContents();

  const br1 = document.createElement('br');
  const br2 = document.createElement('br');

  range.insertNode(br2);
  range.insertNode(node);
  range.insertNode(br1);

  range.setStartAfter(br2);
  range.collapse(true);

  sel.removeAllRanges();
  sel.addRange(range);

  saveCaret();
}

document.getElementById('insertTableBtn')?.addEventListener('mousedown', (e) => {
  e.preventDefault(); e.stopPropagation();
  const t = makeTable(2, 2);
  insertNodeAtCaret(t);

const zoomCloseBtn = imgZoomOverlay.querySelector('#zoomCloseBtn');

let zoomOpen = false;
let zScale = 1;
let zX = 0;
let zY = 0;
let isPanning = false;
let panStartX = 0;
let panStartY = 0;

function applyZoomTransform() {
  imgZoomImg.style.transform =
    `translate(-50%, -50%) translate(${zX}px, ${zY}px) scale(${zScale})`;
}

function fitZoomToStage() {
  const stageRect = imgZoomStage.getBoundingClientRect();
  const iw = imgZoomImg.naturalWidth || 1;
  const ih = imgZoomImg.naturalHeight || 1;

  const scaleX = (stageRect.width * 0.98) / iw;
  const scaleY = (stageRect.height * 0.98) / ih;
  zScale = Math.min(scaleX, scaleY);

  zX = 0;
  zY = 0;

  applyZoomTransform();
}

function zoomBy(factor, centerClientX, centerClientY) {
  const newScale = Math.max(0.1, Math.min(8, zScale * factor));
  if (newScale === zScale) return;

  const stageRect = imgZoomStage.getBoundingClientRect();
  const stageCX = stageRect.left + stageRect.width / 2;
  const stageCY = stageRect.top + stageRect.height / 2;

  const mx = (centerClientX ?? stageCX) - stageCX;
  const my = (centerClientY ?? stageCY) - stageCY;

  const px = (mx - zX) / zScale;
  const py = (my - zY) / zScale;

  zScale = newScale;

  zX = mx - px * zScale;
  zY = my - py * zScale;

  applyZoomTransform();
}

function openZoom(src) {
  if (!src) return;

  zoomOpen = true;

  imgZoomOverlay.style.display = 'flex';
  imgZoomControls.style.display = 'flex';

  zScale = 1;
  zX = 0;
  zY = 0;

  imgZoomImg.onload = () => {
    requestAnimationFrame(() => requestAnimationFrame(fitZoomToStage));
  };

  imgZoomImg.onerror = () => {
    console.error('Zoom image failed to load:', src);
  };

  imgZoomImg.src = '';
  imgZoomImg.src = src;

  requestAnimationFrame(applyZoomTransform);
}

function closeZoom() {
  zoomOpen = false;
  imgZoomOverlay.style.display = 'none';
  imgZoomControls.style.display = 'none';
  imgZoomImg.src = '';
}

  zX = (e.clientX - stageCX) - panStartX;

const recallBtn = document.getElementById('recallBtn');

const SEEN_KEY = 'notes_seen_v1';
let seenMap = {};
try { seenMap = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch { seenMap = {}; }
function saveSeenMap(){ try { localStorage.setItem(SEEN_KEY, JSON.stringify(seenMap)); } catch {} }
function getSeenAt(noteId){ return Number(seenMap[noteId] || 0); }
function markSeen(noteId){ seenMap[noteId] = Date.now(); saveSeenMap(); }

function pickWeightedUnique(items, k) {
  const pool = items.slice();
  const picked = [];
  for (let i = 0; i < k && pool.length; i++) {
    const total = pool.reduce((sum, x) => sum + x.weight, 0);
    let r = Math.random() * (total || 1);
    let idx = 0;
    for (; idx < pool.length; idx++) {
      r -= pool[idx].weight;
      if (r <= 0) break;
    }
    idx = Math.min(idx, pool.length - 1);
    picked.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return picked;
}

function runSmartRecall({ count = 3, includePinned = false } = {}) {
  if (!isUnlocked) return alert('Locked.');

  if (!notesCache.length) {
    clearLiveResults();
    renderHeaderLine('📖 Smart Recall: no notes yet.');
    return;
  }

  const now = Date.now();
  const DAY = 86400000;

  const candidates = notesCache
    .filter(n => includePinned ? true : !n.pinned)
    .map(n => {
      const seenAt = getSeenAt(n.id);
      const daysSinceSeen = seenAt ? (now - seenAt) / DAY : 999;

      const weight =
        !seenAt ? 12 :
        daysSinceSeen > 30 ? 10 :
        daysSinceSeen > 14 ? 7 :
        daysSinceSeen > 7  ? 4 :
        daysSinceSeen > 3  ? 2 :
        0.8;

      return {
        id: n.id,
        createdAt: n.createdAt,
        content: n.content || '',
        pinned: !!n.pinned,
        weight
      };
    });

  const chosen = pickWeightedUnique(candidates, count);
  chosen.forEach(n => markSeen(n.id));

  clearLiveResults();
  renderHeaderLine(`📖 Smart Recall (${chosen.length})`);

  const container = document.createElement('div');
  liveResults.appendChild(container);

  displayNotesInto(container, chosen.map(n => ({
    id: n.id,
    createdAt: n.createdAt,
    content: stripLegacyTableControls(n.content),
    pinned: n.pinned,
    score: 0
  })));

  refreshConceptDefBadges(liveResults);
  scrollAfterResultsRender();
}

/* =========================
   Cache derivations (your existing)
========================= */
function buildDerivedCachesFromNotes() {
  notesDerived.clear();
  conceptCountMap = new Map();

  const tagMap = new Map();

  for (const n of notesCache) {
    const cleanedHtml = stripLegacyTableControls(n.content || '');
    const plainText = htmlToText(cleanedHtml);
    const textNorm = normalizeText(plainText);

    const tags = extractTagsFromHtml(cleanedHtml);

    for (const t of tags) tagMap.set(t, (tagMap.get(t) || 0) + 1);

    const conceptsSet = new Set();
    const re = /\[\[([^\]\[]+?)\]\]/g;
    let m;
    while ((m = re.exec(plainText)) !== null) {
      const concept = (m[1] || '').trim();
      if (!concept) continue;
      conceptsSet.add(normalizeText(concept));
    }

    for (const c of conceptsSet) {
      conceptCountMap.set(c, (conceptCountMap.get(c) || 0) + 1);
    }

    notesDerived.set(n.id, { cleanedHtml, plainText, textNorm, tags });
  }

  tagIndexSorted = [...tagMap.entries()]
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
    .map(([tag, count]) => ({ tag, count }));
}

function deLinkifyConceptAnchors(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';

  div.querySelectorAll('a.conceptLink').forEach(a => {
    let concept = (a.getAttribute('data-concept') || '').trim();

    if (!concept) {
      const label = a.querySelector('.conceptLabel');
      if (label) {
        concept = (label.textContent || '').trim();
      } else {
        const fallback = a.cloneNode(true);
        fallback.querySelectorAll(
          '.conceptCount, .conceptDefIndicator, .definitionIndicator, ' +
          '.conceptMediaIndicator, .mediaIndicator, [data-presentation-only], [aria-hidden="true"]'
        ).forEach(el => el.remove());
        concept = (fallback.textContent || '').trim();
      }
    }

    a.replaceWith(document.createTextNode(`[[${concept}]]`));
  });

  div.querySelectorAll('mark.underlineMatch').forEach(mark => mark.replaceWith(...mark.childNodes));
  div.querySelectorAll(
    '.conceptCount, .conceptDefIndicator, .definitionIndicator, ' +
    '.conceptMediaIndicator, .mediaIndicator, [data-presentation-only]'
  ).forEach(el => el.remove());

  return div.innerHTML;
}

function startNotesListener() {
  if (!isUnlocked) return;
  if (unsubscribeNotes) unsubscribeNotes();

  unsubscribeNotes = db.collection('notes')
    .onSnapshot((snap) => {
      notesCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      notesCache.sort((a, b) => {
        const ta = a.createdAt?.toMillis?.() || 0;
        const tb = b.createdAt?.toMillis?.() || 0;
        return tb - ta;
      });

      buildDerivedCachesFromNotes();

      if (isEditingNote) return;

      if (!externalSearchHandled) {
        const externalParams = new URLSearchParams(location.hash.replace(/^#/, ''));
        const requestedId = externalParams.get('cepId');
        const requestedQuery = externalParams.get('cepSearch') || '';
        if (requestedId || requestedQuery) {
          externalSearchHandled = true;
          if (requestedQuery) userInput.value = requestedQuery;
          const requestedNote = requestedId
            ? notesCache.find(note => note.id === requestedId)
            : null;
          if (requestedNote) {
            renderLiveResults([requestedNote], requestedQuery || 'Selected note');
            return;
          }
          if (requestedQuery) {
            runLiveSearch(requestedQuery, true);
            return;
          }
        }
      }

      const q = userInput.value.trim();
      if (q) runLiveSearch(q, true);
      else renderWelcome();

    }, (err) => {
      console.error('Notes listener error:', err);
      showFatal('Firestore: ' + (err?.message || err));

/* =========================
   Caret save/restore (PER-EDITOR)
========================= */
const caretMap = new WeakMap(); // editorEl -> Range

function saveCaret() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !activeEditable) return;

  const r = sel.getRangeAt(0);
  if (activeEditable.contains(r.startContainer)) {
    caretMap.set(activeEditable, r.cloneRange());
  }
}

function restoreCaret() {
  if (!activeEditable) return false;
  const r = caretMap.get(activeEditable);
  if (!r) return false;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);
  return true;
}

document.addEventListener('selectionchange', () => {
  const selection = window.getSelection();
  if (!selection?.rangeCount) return;

  const range = selection.getRangeAt(0);
  const anchorElement = range.commonAncestorContainer.nodeType === Node.ELEMENT_NODE
    ? range.commonAncestorContainer
    : range.commonAncestorContainer.parentElement;
  const editor = anchorElement?.closest?.('#noteInput, .editableNote, #defBox, #whyBox');
  if (!editor?.isContentEditable || !editor.contains(range.commonAncestorContainer)) return;

  activeEditable = editor;
  caretMap.set(editor, range.cloneRange());
});

function placeCaretAtEnd(el) {
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  caretMap.set(el, range.cloneRange());
}

/* =========================
   Linkify
========================= */
function linkify(html) {
  const div = document.createElement('div');
  div.innerHTML = html;

  const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT, null);
  const urlRegex = /\b(?:https?:\/\/|www\.)[^\s<>"']+/gi;

  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  textNodes.forEach(node => {
    if (node.parentElement?.closest('a, button, script, style, code, pre')) return;
    const text = node.nodeValue;
    urlRegex.lastIndex = 0;
    if (!urlRegex.test(text)) return;
    urlRegex.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    text.replace(urlRegex, (match, offset) => {
      let url = match.replace(/[.,!?;:]+$/, '');
      // Keep balanced parentheses in URLs, but exclude sentence punctuation.
      while (url.endsWith(')') && (url.match(/\)/g) || []).length > (url.match(/\(/g) || []).length) {
        url = url.slice(0, -1).replace(/[.,!?;:]+$/, '');
      }
      frag.appendChild(document.createTextNode(text.slice(lastIndex, offset)));
      const a = document.createElement('a');
      a.href = /^www\./i.test(url) ? `https://${url}` : url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = url;
      frag.appendChild(a);
      frag.appendChild(document.createTextNode(match.slice(url.length)));
      lastIndex = offset + match.length;
      return match;
    });
    frag.appendChild(document.createTextNode(text.slice(lastIndex)));

    node.parentNode.replaceChild(frag, node);
  });

  return div.innerHTML;
}

/* =========================
   Search helpers
========================= */
function normalizeText(s) {
  return (s || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

function htmlToText(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';

  div.querySelectorAll('br').forEach(br => br.replaceWith('\n'));

  div.querySelectorAll('div, p, li').forEach(el => {
    if (el.lastChild?.nodeType === Node.TEXT_NODE) {
      el.appendChild(document.createTextNode('\n'));
    } else {
      el.insertAdjacentText('beforeend', '\n');
    }
  });

  return div.textContent || '';
}

function normalizeTag(s) {
  return (s || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim();
}

function extractTagsFromHtml(html) {
  const text = htmlToText(html || '');
  const re = /(?:^|\s)#([a-zA-Z0-9_][a-zA-Z0-9_-]*)/g;
  const tags = [];
  let m;

  while ((m = re.exec(text)) !== null) {
    const tag = normalizeTag(m[1]);
    if (tag && !tags.includes(tag)) tags.push(tag);
  }
  return tags;
}

function parseFindQuery(raw) {
  const s = raw.replace(/^\/find\s+/i, '').trim();

  const terms = [];
  const seen = new Set();

  const quoteRegex = /"([^"]+)"/g;
  let m;

  while ((m = quoteRegex.exec(s)) !== null) {
    const phraseRaw = (m[1] || '').trim();
    const phraseNorm = normalizeText(phraseRaw);
    if (!phraseNorm) continue;

    const key = `phrase:${phraseNorm}`;
    if (seen.has(key)) continue;
    seen.add(key);

    terms.push({
      raw: phraseRaw,
      norm: phraseNorm,
      type: 'phrase'
    });
  }

  const remainder = s.replace(quoteRegex, ' ');
  remainder
    .split(/[\s,]+/)
    .map(t => t.trim())
    .filter(Boolean)
    .forEach(tokenRaw => {
      const type = tokenRaw.startsWith('#') ? 'tag' : 'word';
      const tokenBase = tokenRaw.startsWith('#') ? tokenRaw.slice(1) : tokenRaw;
      const tokenNorm = normalizeText(tokenBase);
      if (!tokenNorm) return;

      const key = `${type}:${tokenNorm}`;
      if (seen.has(key)) return;
      seen.add(key);

      terms.push({
        raw: tokenRaw,
        norm: tokenNorm,
        type
      });
    });

  return { raw: s, terms };
}

function scoreDoc(plainText, textNorm, terms) {
  let score = 0;

  for (const term of terms) {
    if (!term?.norm) continue;

    if (term.type === 'tag') continue;

    if (term.type === 'phrase') {
      const esc = term.raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const phraseRx = new RegExp(esc, 'i');

      if (textNorm.startsWith(term.norm)) score += 14;
      if (phraseRx.test(plainText)) score += 12;
      else if (textNorm.includes(term.norm)) score += 5;

      continue;
    }

    const esc = term.norm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const wholeWord = new RegExp(`\\b${esc}\\b`, 'i');
    const prefixWord = new RegExp(`\\b${esc}[a-zA-Z0-9_-]*`, 'i');

    if (textNorm.startsWith(term.norm)) score += 10;
    if (wholeWord.test(plainText)) score += 8;
    else if (prefixWord.test(plainText)) score += 5;
    else if (textNorm.includes(term.norm)) score += 2;
  }

  return score;
}

function highlightHTML(html, terms) {
  if (!terms?.length) return html;

  const container = document.createElement('div');
  container.innerHTML = html;

  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  const patterns = [];
  const quietSearchWords = new Set(['a', 'an', 'and', 'are', 'as', 'at', 'be', 'but', 'by', 'for', 'from', 'in', 'is', 'it', 'of', 'on', 'or', 'the', 'to', 'was', 'were', 'with']);

  for (const term of terms) {
    if (!term?.norm) continue;
    if (term.type === 'tag') continue;

    if (term.type === 'phrase') {
      patterns.push(term.raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    } else {
      if (quietSearchWords.has(term.norm)) continue;
      patterns.push(`${term.norm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}[a-zA-Z0-9_-]*`);
    }
  }

  if (!patterns.length) return html;

  patterns.sort((a, b) => b.length - a.length);
  const regex = new RegExp(`(${patterns.join('|')})`, 'gi');

  nodes.forEach(node => {
    const parent = node.parentElement;
    if (parent && parent.closest('a.conceptLink')) return;

    const text = node.nodeValue || '';
    if (!regex.test(text)) return;
    regex.lastIndex = 0;

    const span = document.createElement('span');
    span.innerHTML = text.replace(regex, `<mark class="underlineMatch">$1</mark>`);
    node.parentNode.replaceChild(span, node);
  });

  return container.innerHTML;
}

/* =========================
   Cache-based query (SYNC + stable)
========================= */
function queryNotesSync(rawQuery) {
  if (!isUnlocked) return [];

  const { terms } = parseFindQuery(rawQuery);
  if (!terms.length) return notesCache.slice(0, 30);

  const results = [];

  for (const data of notesCache) {
    const derived = notesDerived.get(data.id);
    if (!derived) continue;
    const { cleanedHtml, plainText, textNorm, tags } = derived;

    const ok = terms.every(term => {
      if (!term?.norm) return true;

     if (term.type === 'tag') {
  return tags.some(tag =>
    tag === term.norm ||
    tag.startsWith(term.norm) ||
    term.norm.startsWith(tag)
  );
}

      if (term.type === 'phrase') {
        const esc = term.raw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const phraseRx = new RegExp(esc, 'i');
        return phraseRx.test(plainText);
      }

      const esc = term.norm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const prefixWord = new RegExp(`\\b${esc}[a-zA-Z0-9_-]*`, 'i');
      return prefixWord.test(plainText);
    });

    if (!ok) continue;

    results.push({
      id: data.id,
      createdAt: data.createdAt,
      content: cleanedHtml,
      score: scoreDoc(plainText, textNorm, terms)
    });
  }

  results.sort((a, b) => {
    const s = b.score - a.score;
    if (s !== 0) return s;
    const ta = a.createdAt?.toMillis?.() || 0;
    const tb = b.createdAt?.toMillis?.() || 0;
    return tb - ta;
  });

  return results.slice(0, 30).map(result => ({
    ...result,
    content: highlightHTML(conceptLinkifyHTML(result.content), terms)
  }));
}

async function compressImageFile(file, {
  maxW = 900,
  maxH = 900,
  quality = 0.72,
  mimeType = 'image/jpeg'
} = {}) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });

  const img = await new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => resolve(el);
    el.onerror = reject;
    el.src = dataUrl;
  });

  let { width, height } = img;
  const scale = Math.min(1, maxW / width, maxH / height);
  width = Math.round(width * scale);
  height = Math.round(height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(img, 0, 0, width, height);

  const blob = await new Promise((resolve) => {
    canvas.toBlob(resolve, mimeType, quality);
  });

  if (!blob) throw new Error('Image compression failed');
  return blob;
}

async function uploadConceptMedia(concept, fileOrBlob, caption = '') {
  const key = mediaKeyForConcept(concept);
  if (!key) throw new Error('Missing concept key');

  await ensureSignedIn();

  const safeName = safeStorageName(concept);
  const fileName = `${Date.now()}-${safeName}.jpg`;
  const storagePath = `concept_media/${safeName}/${fileName}`;

  console.log('upload path', storagePath);

  const ref = storage.ref().child(storagePath);
  const task = ref.put(fileOrBlob, { contentType: 'image/jpeg' });

  task.on(
    'state_changed',
    (snap) => {
      const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
      console.log('upload progress', pct + '%');
    },
    (err) => {
      console.error('upload task error', err);
    }
  );

  await task;
  console.log('storage upload complete');

  const imageUrl = await ref.getDownloadURL();
  console.log('download url ready', imageUrl);

  await db.collection('concept_media').doc(key).set({
    concept: (concept || '').trim(),
    imageUrl,
    caption: (caption || '').trim(),
    storagePath,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
  window.invalidateCepSearchCache?.('xgpt:media');

  console.log('firestore media doc saved');

  return { imageUrl, storagePath };
}

}

function getConceptFromLink(link) {
  if (!link) return '';

  const storedConcept = (link.getAttribute('data-concept') || '').trim();
  const labelConcept = (link.querySelector('.conceptLabel')?.textContent || '').trim();
  const concept = storedConcept || labelConcept || (link.textContent || '').trim();

  // Security sanitization removes data-* attributes from freshly rendered
  // search results. Restore the canonical concept name from its label.
  if (concept && storedConcept !== concept) {
    link.setAttribute('data-concept', concept);
  }

  return concept;
}

function refreshConceptDefBadges(root = document) {
  const links = root.querySelectorAll('a.conceptLink');
  links.forEach(a => {
    const concept = getConceptFromLink(a);
    const count = conceptCountMap.get(normalizeText(concept)) || 0;
    let countBadge = a.querySelector('.conceptCount');

    // The HTML sanitizer intentionally removes data-* attributes. Restore the
    // visual-only count after insertion without adding it to link.textContent.
    if (count > 0) {
      if (!countBadge) {
        countBadge = document.createElement('span');
        countBadge.className = 'conceptCount';
        a.appendChild(countBadge);
      }
      countBadge.textContent = '';
      countBadge.dataset.count = String(count);
      countBadge.setAttribute('data-presentation-only', 'true');
      countBadge.setAttribute('aria-hidden', 'true');
    } else {
      countBadge?.remove();
    }
    const def = (getDefinition(concept) || '').trim();
    const why = (getWhy(concept) || '').trim();

    if (def) {
      a.classList.add('hasDef');
      a.setAttribute('data-def', def);
    } else {
      a.classList.remove('hasDef');
      a.removeAttribute('data-def');
    }

    // store why too (even if def exists or not)
    if (why) a.setAttribute('data-why', why);
    else a.removeAttribute('data-why');
  });
  
    refreshConceptMediaBadges(root);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function linkifyText(s) {
  const safe = escapeHtml(s);

  return safe.replace(
    /(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi,
    (url) => {
      let cleanUrl = url;
      let trailing = '';

      // Avoid including punctuation at the end of links
      while (/[.,!?;:)]+$/.test(cleanUrl)) {
        trailing = cleanUrl.slice(-1) + trailing;
        cleanUrl = cleanUrl.slice(0, -1);
      }

      const href = cleanUrl.startsWith('www.')
        ? `https://${cleanUrl}`
        : cleanUrl;

      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="tipUrlLink">${cleanUrl}</a>${trailing}`;
    }
  );
}

  if (richHtml && window.CEPSecurity?.sanitizeHTML) {

  }
  return linkifyText(fallbackText);
}

}

/* =========================
   MERGE: unify [[old]] -> [[new]] across notes + defs
   - Only replaces exact concept pills [[...]] (not plain text)
   - Case-insensitive match of the inner concept text
   - Preserves the NEW concept casing exactly as you type it
========================= */
function escapeRegExp(s) {
  return (s || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function buildConceptPillRegex(oldConcept) {
  // matches [[  oldConcept  ]] with flexible whitespace
  // and case-insensitive on the concept text
  const inner = escapeRegExp((oldConcept || '').trim());
  return new RegExp(`\\[\\[\\s*${inner}\\s*\\]\\]`, 'gi');
}

async function mergeConceptEverywhere(oldConcept, newConcept) {
  const oldTrim = (oldConcept || '').trim();
  const newTrim = (newConcept || '').trim();
  if (!oldTrim || !newTrim) return { changed: 0 };

  const oldKey = defKeyForConcept(oldTrim);
  const newKey = defKeyForConcept(newTrim);
  if (!oldKey || !newKey) return { changed: 0 };

  if (oldKey === newKey) {
    // same normalized key — no need to rewrite defs doc; but we can still unify casing in notes
  }

  await ensureSignedIn();

  // 1) Update notes in batches (500 limit per batch write)
  const rx = buildConceptPillRegex(oldTrim);
  const repl = `[[${newTrim}]]`;

  const changedDocs = [];
  for (const n of notesCache) {
    const html = (n.content || '');
    if (!rx.test(html)) continue;
    const nextHtml = html.replace(rx, repl);
    if (nextHtml !== html) changedDocs.push({ id: n.id, content: nextHtml });
  }

  let changed = 0;
  for (let i = 0; i < changedDocs.length; i += 400) {
    const chunk = changedDocs.slice(i, i + 400);
    const batch = db.batch();
    chunk.forEach(doc => {
      batch.update(db.collection('notes').doc(doc.id), { content: doc.content });
    });
    await batch.commit();
    window.invalidateCepSearchCache?.('xgpt:notes');
    changed += chunk.length;
  }

  // 2) Merge definition docs (prefer keeping existing NEW text if it already exists)
  // pull latest from cache first (listener may lag a moment; we still handle safely)
  const oldDef = defsCache?.[oldKey] || null;
  const newDef = defsCache?.[newKey] || null;

  const oldVal = (oldDef?.value || '').trim();
  const oldWhy = (oldDef?.why || '').trim();
  const oldValHtml = (oldDef?.valueHtml || '').trim();
  const oldWhyHtml = (oldDef?.whyHtml || '').trim();

  const newVal = (newDef?.value || '').trim();
  const newWhy = (newDef?.why || '').trim();
  const newValHtml = (newDef?.valueHtml || '').trim();
  const newWhyHtml = (newDef?.whyHtml || '').trim();

  // If the target has no definition/why, carry over from old.
  // If it already has content, keep it (don’t overwrite).
  if ((oldVal || oldWhy) && (!newVal || !newWhy)) {
    await db.collection('concept_defs').doc(newKey).set({
      concept: newTrim,
      value: newVal || oldVal,
      why: newWhy || oldWhy,
      valueHtml: newValHtml || oldValHtml,
      whyHtml: newWhyHtml || oldWhyHtml,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    window.invalidateCepSearchCache?.('xgpt:definitions');
  } else {
    // still make sure the pretty concept name is stored
    await db.collection('concept_defs').doc(newKey).set({
      concept: newTrim,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    window.invalidateCepSearchCache?.('xgpt:definitions');
  }

  // Delete the old doc if it’s a different key
  if (oldKey !== newKey) {
    try { await db.collection('concept_defs').doc(oldKey).delete(); } catch {}
    window.invalidateCepSearchCache?.('xgpt:definitions');
  }

  return { changed };
}

  if (!to) return;

  const toTrim = to.trim();

  if (normalizeText(from) === normalizeText(toTrim)) {

/* =========================
   Concept linkify
========================= */
function conceptLinkifyHTML(html) {
  if (!html) return html;

  const wrap = document.createElement('div');
  wrap.innerHTML = html;

  const re = /\[\[([^\]\[]+?)\]\]/g;

  const walker = document.createTreeWalker(wrap, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);

  textNodes.forEach(node => {
    const parent = node.parentElement;
    if (!parent) return;

    if (parent.closest('a, button')) return;

    const txt = node.nodeValue || '';
    if (!re.test(txt)) return;
    re.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let last = 0;

    txt.replace(re, (m, inner, offset) => {
      frag.appendChild(document.createTextNode(txt.slice(last, offset)));

      const concept = (inner || '').trim();
      if (!concept) {
        frag.appendChild(document.createTextNode(m));
        last = offset + m.length;
        return m;
      }

      const normalized = normalizeText(concept);
      const count = conceptCountMap.get(normalized) || 0;

      const a = document.createElement('a');
      a.href = '#';
      a.className = 'conceptLink';
      a.dataset.concept = concept;

      const label = document.createElement('span');
      label.className = 'conceptLabel';
      label.textContent = concept;
      a.appendChild(label);

      const def = (getDefinition(concept) || '').trim();
      if (def) {
        a.classList.add('hasDef');
        a.setAttribute('data-def', def);
      }

      const media = getConceptMedia(concept);
      if (media?.imageUrl) {
        a.classList.add('hasKbImage');
        a.setAttribute('data-kb-image', media.imageUrl);
        if (media.caption) a.setAttribute('data-kb-caption', media.caption);
      }

      if (count > 0) {
        const badge = document.createElement('span');
        badge.className = 'conceptCount';
        badge.setAttribute('data-presentation-only', 'true');
        badge.setAttribute('aria-hidden', 'true');
        // Keep the count visual-only so search/title extraction does not
        // concatenate it with the linked concept (for example, "Fever1").
        badge.dataset.count = String(count);
        a.appendChild(badge);
      }

      frag.appendChild(a);

      last = offset + m.length;
      return m;
    });

    frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });

  return wrap.innerHTML;
}

function chooseNotePrintMode() {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    Object.assign(overlay.style, {

      inset: '0',
      zIndex: '1000020',
      display: 'grid',
      placeItems: 'center',
      padding: '20px',
      background: 'rgba(30, 26, 28, 0.28)',
      backdropFilter: 'blur(6px)',
      WebkitBackdropFilter: 'blur(6px)'
    });

    const dialog = document.createElement('div');
    dialog.setAttribute('role', 'dialog');
    dialog.setAttribute('aria-modal', 'true');
    dialog.setAttribute('aria-labelledby', 'notePrintChoiceTitle');
    Object.assign(dialog.style, {
      width: 'min(360px, 100%)',
      padding: '20px',
      borderRadius: '16px',
      border: '1px solid rgba(255,255,255,0.7)',
      background: 'rgba(255,255,255,0.94)',
      boxShadow: '0 18px 50px rgba(0,0,0,0.2)',
      color: '#222',
      textAlign: 'center'
    });

    const title = document.createElement('div');
    title.id = 'notePrintChoiceTitle';
    title.textContent = 'Print this note';
    Object.assign(title.style, { fontWeight: '700', fontSize: '15px', marginBottom: '14px' });

    const actions = document.createElement('div');
    Object.assign(actions.style, { display: 'grid', gap: '9px' });

    const finish = mode => {
      document.removeEventListener('keydown', onKeyDown, true);
      overlay.remove();
      resolve(mode);
    };
    const onKeyDown = event => {
      if (event.key === 'Escape') finish(null);
    };

    const choices = [
      ['note', 'Print note only'],
      ['definitions', 'Include concept definitions'],
      [null, 'Cancel']
    ];
    choices.forEach(([mode, label]) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;
      Object.assign(button.style, {
        padding: '10px 14px',
        borderRadius: '11px',
        border: '1px solid rgba(90,80,85,0.2)',
        background: mode ? 'rgba(238,230,234,0.9)' : 'transparent',
        color: '#222',
        cursor: 'pointer',
        font: 'inherit'
      });
      button.onclick = () => finish(mode);
      actions.appendChild(button);
    });

    overlay.addEventListener('click', event => {
      if (event.target === overlay) finish(null);
    });
    document.addEventListener('keydown', onKeyDown, true);
    dialog.append(title, actions);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    actions.firstElementChild.focus();
  });
}

function appendPrintableConceptDefinitions(printable, sourceBubble) {
  const seen = new Set();
  const definitions = [];

  sourceBubble.querySelectorAll('a.conceptLink').forEach(link => {
    const concept = getConceptFromLink(link);
    const key = defKeyForConcept(concept);
    if (!concept || seen.has(key)) return;
    seen.add(key);

    const definitionHtml = (getDefinitionHtml(concept) || '').trim();
    const definitionText = (getDefinition(concept) || '').trim();
    const media = getConceptMedia(concept);
    if (!definitionHtml && !definitionText && !media?.imageUrl) return;
    definitions.push({ concept, definitionHtml, definitionText, imageUrl: media?.imageUrl || '' });
  });

  if (!definitions.length) return;

  const section = document.createElement('section');
  section.className = 'print-definitions';
  const heading = document.createElement('h2');
  heading.textContent = 'Concept definitions';
  section.appendChild(heading);

  definitions.forEach(({ concept, definitionHtml, definitionText, imageUrl }) => {
    const entry = document.createElement('article');
    const name = document.createElement('h3');
    name.textContent = concept;
    const definition = document.createElement('div');
    definition.className = 'print-definition';
    if (definitionHtml) CEPSecurity.setHTML(definition, definitionHtml);
    else definition.textContent = definitionText;
    entry.append(name);
    if (definitionHtml || definitionText) entry.appendChild(definition);
    if (imageUrl) {
      const image = document.createElement('img');
      image.src = imageUrl;
      image.alt = concept;
      image.className = 'print-concept-image';
      entry.appendChild(image);
    }
    section.appendChild(entry);
  });

  printable.appendChild(section);
}

/* =========================
   Hashtag suggestions (your existing)
========================= */
const tagSuggest = document.getElementById('tagSuggest');
let suggestOpen = false;
let suggestItems = [];
let suggestIndex = -1;

function buildTagIndexFromCache() {
  const map = new Map();
  for (const n of notesCache) {
    const cleaned = stripLegacyTableControls(n.content || '');
    const tags = extractTagsFromHtml(cleaned);
    for (const t of tags) map.set(t, (map.get(t) || 0) + 1);
  }
  return [...map.entries()]
    .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0]))
    .map(([tag, count]) => ({ tag, count }));
}

function getCurrentHashToken(inputValue, caretPos) {
  const left = inputValue.slice(0, caretPos);
  const m = left.match(/(^|\s)#([a-zA-Z0-9_-]*)$/);
  if (!m) return null;
  return {
    prefix: m[1] || '',
    typed: (m[2] || ''),
    start: left.length - m[2].length,
  };
}

function positionSuggestUnderInput() {
  const r = userInput.getBoundingClientRect();
  const pad = 10;

  const w = Math.max(220, Math.min(r.width, window.innerWidth - 20));
  tagSuggest.style.width = w + 'px';

  let left = r.left + (r.width - w) / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - w - 10));
  tagSuggest.style.left = left + 'px';

  const h = tagSuggest.getBoundingClientRect().height || 180;

  let top = r.top - h - pad;
  if (top < 10) top = r.bottom + pad;
  top = Math.max(10, Math.min(top, window.innerHeight - h - 10));
  tagSuggest.style.top = top + 'px';
}

function closeSuggest() {
  suggestOpen = false;
  suggestItems = [];
  suggestIndex = -1;
  tagSuggest.style.display = 'none';
  tagSuggest.setAttribute('aria-hidden', 'true');
  tagSuggest.innerHTML = '';
}

function openSuggest(items) {
  suggestOpen = true;
  suggestItems = items;
  suggestIndex = 0;

  tagSuggest.innerHTML = '';
  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'item' + (idx === suggestIndex ? ' active' : '');
    row.innerHTML = `<span>#${it.tag}</span><span class="count">${it.count}</span>`;

    row.addEventListener('mousedown', (e) => {
      e.preventDefault();
      applySuggestion(it.tag);
    });

    tagSuggest.appendChild(row);
  });

  tagSuggest.style.display = 'block';
  tagSuggest.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(positionSuggestUnderInput);
}

function renderSuggestActive() {
  const rows = tagSuggest.querySelectorAll('.item');
  rows.forEach((r, i) => r.classList.toggle('active', i === suggestIndex));
}

function applySuggestion(tag) {
  const caret = userInput.selectionStart ?? (userInput.value || '').length;
  const token = getCurrentHashToken(userInput.value, caret);
  if (!token) return closeSuggest();

  const before = userInput.value.slice(0, caret).replace(/(^|\s)#([a-zA-Z0-9_-]*)$/, `$1#${tag} `);
  const after = userInput.value.slice(caret);

  userInput.value = before + after;

  const newCaret = before.length;
  userInput.setSelectionRange(newCaret, newCaret);

  closeSuggest();
  runLiveSearch(userInput.value.trim(), true);
}

document.addEventListener('mousedown', (e) => {
  if (!suggestOpen) return;
  if (tagSuggest.contains(e.target)) return;
  if (e.target === userInput) return;
  closeSuggest();
});

userInput.addEventListener('keydown', (e) => {
  if (!suggestOpen) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    suggestIndex = Math.min(suggestItems.length - 1, suggestIndex + 1);
    renderSuggestActive();
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    suggestIndex = Math.max(0, suggestIndex - 1);
    renderSuggestActive();
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    const it = suggestItems[suggestIndex];
    if (it) applySuggestion(it.tag);
    return;
  }
  if (e.key === 'Escape') {
    closeSuggest();
    return;
  }
});

function updateTagSuggestions() {
  if (!isUnlocked) return closeSuggest();

  const val = userInput.value || '';
  const caret = userInput.selectionStart ?? val.length;
  const token = getCurrentHashToken(val, caret);

  if (!token) return closeSuggest();

  const typed = normalizeTag(token.typed);

  const index = tagIndexSorted;
  const filtered = typed
    ? index.filter(x => x.tag.startsWith(typed)).slice(0, 12)
    : index.slice(0, 12);

  if (!filtered.length) return closeSuggest();
  openSuggest(filtered);
}

userInput.addEventListener('input', () => {
  updateTagSuggestions();
});

window.addEventListener('resize', () => {
  if (suggestOpen) positionSuggestUnderInput();
});

/* =========================
   Concept click handling
========================= */
let conceptLongPressTimer = null;
let conceptLongPressLink = null;
let conceptLongPressTriggered = false;
let conceptLongPressStartX = 0;
let conceptLongPressStartY = 0;
let suppressConceptClickUntil = 0;

function cancelConceptLongPress() {
  if (conceptLongPressTimer) clearTimeout(conceptLongPressTimer);
  conceptLongPressTimer = null;
}

document.addEventListener('touchstart', (e) => {
  cancelConceptLongPress();
  const link = e.target.closest?.('a.conceptLink');
  if (!link || e.touches.length !== 1) return;

  const touch = e.touches[0];
  conceptLongPressLink = link;
  conceptLongPressTriggered = false;
  conceptLongPressStartX = touch.clientX;
  conceptLongPressStartY = touch.clientY;
  conceptLongPressTimer = setTimeout(() => {
    let topic = getConceptFromLink(link);
    topic = topic.replace(/^\[\[\s*/, '').replace(/\s*\]\]$/, '').trim();
    if (!topic) return;

    conceptLongPressTriggered = true;
    suppressConceptClickUntil = Date.now() + 900;
    navigator.vibrate?.(25);
    openDefPanel(topic, conceptLongPressStartX, conceptLongPressStartY);
  }, 550);
}, { capture: true, passive: true });

document.addEventListener('touchmove', (e) => {
  if (!conceptLongPressTimer || e.touches.length !== 1) return;
  const touch = e.touches[0];
  if (Math.hypot(touch.clientX - conceptLongPressStartX, touch.clientY - conceptLongPressStartY) > 12) {
    cancelConceptLongPress();
  }
}, { capture: true, passive: true });

document.addEventListener('touchend', (e) => {
  cancelConceptLongPress();
  if (!conceptLongPressTriggered) return;
  e.preventDefault();
  e.stopPropagation();
  conceptLongPressTriggered = false;
}, { capture: true, passive: false });

document.addEventListener('touchcancel', cancelConceptLongPress, { capture: true, passive: true });

document.addEventListener('click', (e) => {
  const a = e.target.closest('a.conceptLink');
  if (!a) return;

  e.preventDefault();
  e.stopPropagation();

  if (a === conceptLongPressLink && Date.now() < suppressConceptClickUntil) return;

  let topic = getConceptFromLink(a);
  topic = topic.replace(/^\[\[\s*/, '').replace(/\s*\]\]$/, '').trim();
  if (!topic) return;

  if (e.shiftKey) {
    openDefPanel(topic, e.clientX, e.clientY);
    return;
  }

  userInput.value = `"${topic}"`;
  userInput.focus();
  runLiveSearch(userInput.value.trim(), true);
}, true);

function setTableCellsEditable(root, editable) {
  if (!root) return;
  root.querySelectorAll('table').forEach(table => {
    table.style.setProperty('background', '#ecebeb', 'important');
    table.querySelectorAll('th,td').forEach(cell => {
      const isHeader = cell.tagName === 'TH' || Boolean(cell.closest('thead'));
      const rowIndex = cell.closest('tr')?.rowIndex || 0;
      const background = isHeader ? '#ecebeb' : rowIndex % 2 ? '#f2edf4' : '#ecebeb';
      cell.style.setProperty('background', background, 'important');
      if (isHeader) cell.style.setProperty('color', '#40363b', 'important');
    });
  });
  root.querySelectorAll('.cellBox').forEach(cell => {
    cell.contentEditable = editable ? 'true' : 'false';
    if (!editable) {
      cell.setAttribute('tabindex', '-1');
      cell.style.caretColor = 'transparent';
    } else {
      cell.removeAttribute('tabindex');
      cell.style.caretColor = '';
    }
  });
}

/* =========================
   Live search runner
========================= */
function runLiveSearch(q, immediate = false) {
  if (!isUnlocked) return;

  const doIt = () => {
    lastLiveQuery = q;

    try {
      const notes = queryNotesSync('/find ' + q);
      renderLiveResults(notes, q);
    } catch (e) {
      console.error(e);
      showFatal('Search/render error: ' + (e?.message || e));
    }
  };

  clearTimeout(liveTimer);
  if (immediate) return doIt();
  liveTimer = setTimeout(doIt, 220);
}

userInput.addEventListener('input', () => {
  const q = userInput.value.trim();

  if (!q) {
    clearTimeout(liveTimer);
    lastLiveQuery = '';
    if (isUnlocked) renderWelcome();
    else clearLiveResults();
    return;
  }

  runLiveSearch(q, false);
});

/* =========================
   Enter key behavior
========================= */
inputArea.addEventListener('submit', async (e) => {
  e.preventDefault();

  const raw = userInput.value.trim();
  if (!raw) return;

  if (/^\/ask\b/i.test(raw)) {
    const q = raw.replace(/^\/ask\s*/i, '').trim();
    if (!q) return;

    clearLiveResults();
    renderHeaderLine('Thinking…');

    try {
      const answer = await askAI(q);
      clearLiveResults();
      renderHeaderLine(answer);
    } catch (err) {
      clearLiveResults();
      renderHeaderLine('⚠️ Error getting response');
      console.error(err);
    }
    return;
  }

  runLiveSearch(raw, true);
});

/* =========================
   Formatting toolbar (your existing execCommand bindings)
========================= */
function runCmd(cmd, value = null) {
  if (!activeEditable) activeEditable = noteInput;

  activeEditable.focus({ preventScroll: true });
  restoreCaret();

  if (value === null) document.execCommand(cmd);
  else document.execCommand(cmd, false, value);

  saveCaret();
}

function bindToolbarBtn(id, cmd, value = null) {
  const btn = document.getElementById(id);
  if (!btn) return;

  btn.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    runCmd(cmd, value);
  });
}

bindToolbarBtn('boldBtn', 'bold');
bindToolbarBtn('italicBtn', 'italic');
bindToolbarBtn('underlineBtn', 'underline');
function applyChosenHighlight(color) {
  const editor = getActiveEditor();
  if (!editor) return;
  activeEditable = editor;
  editor.focus({ preventScroll: true });
  restoreCaret();
  const selection = window.getSelection();
  if (!selection?.rangeCount || selection.isCollapsed) return;
  const range = selection.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return;
  const fragment = range.extractContents();
  fragment.querySelectorAll('mark,span,font').forEach(element => {
    element.style.removeProperty('background');
    element.style.removeProperty('background-color');
    element.style.removeProperty('background-image');
    element.classList.remove('cep-chosen-highlight');
  });
  const highlight = document.createElement('span');
  highlight.className = color === 'transparent' ? 'cep-removed-highlight' : 'cep-chosen-highlight';
  highlight.style.backgroundColor = color;
  highlight.append(fragment);
  range.insertNode(highlight);
  range.selectNodeContents(highlight);
  selection.removeAllRanges();
  selection.addRange(range);
  saveCaret();
  editor.dispatchEvent(new Event('input', { bubbles: true }));
}

const highlightPalette = document.getElementById('highlightPalette');
document.getElementById('highlightBtn').addEventListener('click', () => {
  fontColorPalette.classList.remove('visible');
  const open = highlightPalette.classList.toggle('visible');
  document.getElementById('highlightBtn').setAttribute('aria-expanded', String(open));
});
highlightPalette.addEventListener('mousedown', event => { event.preventDefault(); });
highlightPalette.addEventListener('click', event => {

  if (!choice) return;
  event.preventDefault();
  event.stopPropagation();
  applyChosenHighlight(choice.dataset.color);
  highlightPalette.classList.remove('visible');
  document.getElementById('highlightBtn').setAttribute('aria-expanded', 'false');
});

const fontColorPalette = document.getElementById('fontColorPalette');

document.getElementById('fontColorBtn')?.addEventListener('click', () => {

  document.getElementById('highlightBtn').setAttribute('aria-expanded', 'false');
  fontColorPalette?.classList.toggle('visible');
});

fontColorPalette?.addEventListener('mousedown', event => { event.preventDefault(); });
fontColorPalette?.addEventListener('click', (e) => {
  const choice = e.target.closest('.font-color-choice');
  if (!choice) return;
  e.preventDefault();
  e.stopPropagation();

  const editor = getActiveEditor();
  if (!editor) return;
  editor.focus({ preventScroll: true });
  restoreCaret();
  document.execCommand('styleWithCSS', false, true);
  document.execCommand('foreColor', false, choice.dataset.color);
  document.execCommand('styleWithCSS', false, false);
  saveCaret();
  fontColorPalette.classList.remove('visible');
}, true);

function closeEditorFormat() {
  formatToolbar.classList.remove('visible');
  fontColorPalette.classList.remove('visible');
  highlightPalette.classList.remove('visible');
  formatToggle.setAttribute('aria-expanded', 'false');
  document.getElementById('highlightBtn').setAttribute('aria-expanded', 'false');
}
function attachEditorFormat(editor) {
  if (!editor.matches('#noteInput, .editableNote')) return;
  let shell = editor.parentElement;
  if (!shell.classList.contains('note-format-shell')) {
    shell = document.createElement('div');
    shell.className = 'note-format-shell';
    editor.before(shell);
    shell.append(editor);
  }
  const actions = editor.id === 'noteInput'
    ? notePanel.querySelector('.new-note-actions')
    : shell.nextElementSibling;
  if (!actions?.classList.contains('note-editor-actions')) return;
  if (formatToggle.parentElement !== actions) {
    closeEditorFormat();
    actions.prepend(formatToggle);
    shell.append(formatToolbar);
  }
  formatToggle.style.display = 'block';
}
document.addEventListener('focusin', event => {
  const editor = event.target.closest?.('#noteInput, .editableNote');
  if (editor) attachEditorFormat(editor);
});
formatToggle.onclick = () => {
  const open = !formatToolbar.classList.contains('visible');
  closeEditorFormat();
  if (open) formatToolbar.classList.add('visible');
  formatToggle.setAttribute('aria-expanded', String(open));
};

const mobileNavMedia = window.matchMedia('(max-width: 600px)');

function syncMobileSignOutLight() {
  const signOutLight = document.querySelector('.cep-sign-out-light');

  if (mobileNavMedia.matches) {
    if (signOutLight.parentElement !== mobileBottomNav) mobileBottomNav.appendChild(signOutLight);

    document.body.appendChild(signOutLight);
  }
}

const signOutLightObserver = new MutationObserver(syncMobileSignOutLight);
signOutLightObserver.observe(document.body, { childList: true });

function getActiveEditor() {
  const el = activeEditable;
  if (!el) return null;
  if (el === userInput) return null;
  if (!el.isContentEditable) return null;
  return el;
}

function wrapSelectionWithBrackets(mode = 'wrap') {
  const editor = getActiveEditor();
  if (!editor) return;

  editor.focus({ preventScroll: true });
  restoreCaret();

  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;

  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return;

  if (mode === 'unwrap' &&
      range.startContainer === range.endContainer &&
      range.startContainer.nodeType === Node.TEXT_NODE) {
    const text = range.startContainer.nodeValue || '';
    const open = text.lastIndexOf('[[', range.startOffset);
    const close = text.indexOf(']]', range.endOffset);
    if (open !== -1 && close !== -1 && open <= range.startOffset && close + 2 >= range.endOffset) {
      range.setStart(range.startContainer, open);
      range.setEnd(range.endContainer, close + 2);
    }
  }

  const selectedText = sel.toString();
  if (!selectedText || !selectedText.trim()) return;

  const trimmed = selectedText.trim();
  const hasBrackets = /^\s*\[\[[\s\S]*\]\]\s*$/.test(selectedText);

  let replacement = '';
  if (mode === 'unwrap' || hasBrackets) {
    replacement = trimmed.replace(/^\[\[\s*/, '').replace(/\s*\]\]$/, '');
  } else {
    replacement = `[[${trimmed}]]`;
  }

  range.deleteContents();
  range.insertNode(document.createTextNode(replacement));

  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);

  saveCaret();
  refreshConceptDefBadges(document.getElementById('chat'));
}

// Ctrl/Cmd+L = wrap, Ctrl/Cmd+Shift+L = unwrap.
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t === userInput) return;

  const key = (e.key || '').toLowerCase();
  if (key !== 'l' && e.code !== 'KeyL') return;

  if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
    e.preventDefault();
    e.stopImmediatePropagation();
    wrapSelectionWithBrackets('unwrap');
    return;
  }

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    e.preventDefault();
    wrapSelectionWithBrackets('wrap');
    return;
  }
}, true);

updateUIForLockState();
