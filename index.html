<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secure sign in</title>
  <style>
  
  @font-face {
  font-family: 'hellohon';
  src: url('hellohon.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}

    html,
    body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  box-sizing: border-box;
  font-family: 'Tahoma', sans-serif;
  overflow-x: hidden;
  position: relative;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding:
    calc(20px + env(safe-area-inset-top))
    calc(20px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom))
    calc(20px + env(safe-area-inset-left));
}

/* Background image with full-page blur overlay */
body::before {
  content: "";
  position: fixed;
  inset: -20px;
  background: url('site-background.webp') no-repeat center center fixed;
  background-size: cover;
  filter: blur(10px) brightness(0.9);
  z-index: -1;
  pointer-events: none;
}

/* Date and time box */
#datetime {
  width: 100%;
  max-width: 960px;
  text-align: center;
  color: black;
  margin-bottom: 25px;
  line-height: 1.3;
  user-select: none;
  text-shadow: 0 1px 3px rgba(150, 150, 200, 0.5);
}

#date-part {
  font-family: 'hellohon', sans-serif;
  font-weight: bold;
  font-size: clamp(56px, 7vw, 100px);
  line-height: 1.08;
  overflow-wrap: break-word;
}

#time-part {
  font-size: clamp(22px, 2.3vw, 30px);
  margin-top: 6px;
}

.password-container {
  background: rgba(255, 255, 255, 0.15); /* more transparent */
  border-radius: 16px;
  padding: 30px 25px;
  width: min(320px, calc(100vw - 40px));
  max-width: 100%;
  box-sizing: border-box;
  box-shadow:
    0 8px 32px rgba(100, 100, 180, 0.2),
    inset 0 0 0 1px rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(12px) saturate(180%);
  -webkit-backdrop-filter: blur(12px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.3);
  text-align: center;
  color: #38386f;
  user-select: none;
  position: relative;
  z-index: 2;
}



/* Title in container */
.password-container h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-weight: 500;
  font-size: 26px;
  color: #3e3e7a;
  text-shadow: 0 1px 2px rgba(200, 200, 255, 0.5);
}

/* Inputs */
input[type="password"] {
  width: 90%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid rgba(150, 160, 255, 0.5);
  background: rgba(255, 255, 255, 0.25);
  color: #2f2f6d;
  font-size: 16px;
  box-shadow: inset 0 2px 5px rgba(255 255 255 / 0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color 0.3s ease;
  user-select: text;
}

input[type="password"]:focus {
  outline: none;
  border-color: #7a85ff;
  background: rgba(255, 255, 255, 0.4);
}

/* Button */
button {
  margin-top: 15px;
  padding: 12px 24px;
  background: rgba(130, 140, 255, 0.6);
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  box-shadow:
    0 4px 14px rgba(110, 120, 255, 0.5);
  transition: background-color 0.3s ease;
  user-select: none;
}

button:hover {
  background: rgba(90, 95, 220, 0.8);
}

/* Responsive tweaks */
@media (max-width: 600px) {
  body {
    justify-content: center;
    padding:
      calc(18px + env(safe-area-inset-top))
      calc(20px + env(safe-area-inset-right))
      calc(18px + env(safe-area-inset-bottom))
      calc(20px + env(safe-area-inset-left));
  }

  .password-container {
    width: min(320px, calc(100vw - 40px));
    padding: 20px 15px;
  }

  #datetime {
    width: 100%;
    margin-bottom: clamp(18px, 5vh, 28px);
  }

  #date-part {
    font-size: clamp(32px, 9vw, 58px);
    line-height: 1.08;
  }

  #time-part {
    font-size: clamp(18px, 5vw, 24px);
    margin-top: 8px;
  }
}

  </style>
  <link rel="stylesheet" href="site-background.css">
</head>
<body>

  <!-- Live date and time above the container -->
  <div id="datetime">
  <div id="date-part"></div>
  <div id="time-part"></div>
</div>

  <div class="password-container">
    <h2 style="color: black;">Secure sign in</h2>
    <p id="signInStatus" style="font-size: 14px; color: #2f2f6d;">Use the approved Google account to continue.</p>
    <button id="googleSignIn" type="button">Sign in with Google</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

  <script>
    // Live date & time display
    function updateDateTime() {
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
  const timeStr = now.toLocaleTimeString();

  document.getElementById('date-part').textContent = dateStr;
  document.getElementById('time-part').textContent = timeStr;
}
setInterval(updateDateTime, 1000);
updateDateTime();


    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAgYsVQNEOyQa41NkXXT2VuKClqXAxfG1Q",
      authDomain: "cepx-f9d2a.firebaseapp.com",
      projectId: "cepx-f9d2a",
      storageBucket: "cepx-f9d2a.firebasestorage.com",
      messagingSenderId: "840696526325",
      appId: "1:840696526325:web:b9bcb4669fbfad066a1cbc"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const allowedEmail = "xeve06@gmail.com";
    const params = new URLSearchParams(location.search);
    const requestedPage = params.get("returnTo") || "home.html";
    const safeReturnTo = /^[A-Za-z0-9 _.-]+\.html$/.test(requestedPage)
      ? requestedPage
      : "home.html";
    const status = document.getElementById("signInStatus");
    const signInButton = document.getElementById("googleSignIn");
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isStandalone = window.navigator.standalone === true
      || window.matchMedia?.("(display-mode: standalone)")?.matches === true;
    const isMobile = isIOS
      || /Android|Mobile/i.test(navigator.userAgent)
      || navigator.userAgentData?.mobile === true;
    // iOS Home Screen apps have a separate storage context from Safari.
    // Keep the OAuth result in the installed app by using the popup flow there.
    const useRedirectAuth = isMobile && !isStandalone;
    const persistenceReady = auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    let authCompletionStarted = false;

    function authErrorText(prefix, error) {
      const code = error?.code ? ` (${error.code})` : "";
      const message = error?.message || "Unknown authentication error.";
      return `${prefix}${code}: ${message}`;
    }

    function openSignedInPage() {
      const destination = new URL(safeReturnTo, window.location.href).href;
      status.textContent = "Signed in. Opening XlynEve…";

      // Normal assignment is more reliable than replacing the current entry
      // after an OAuth redirect in an iOS Home Screen web app.
      window.location.assign(destination);

      // If standalone Safari does not unload after the first navigation,
      // retry once using href assignment.
      window.setTimeout(() => {
        window.location.href = destination;
      }, 500);
    }

    async function finishSignIn(user) {
      if (!user || authCompletionStarted) return;
      authCompletionStarted = true;

      if (user.emailVerified && String(user.email || "").toLowerCase() === allowedEmail) {
        openSignedInPage();
        return;
      }

      await auth.signOut();
      status.textContent = `Access is restricted to ${allowedEmail}.`;
      signInButton.disabled = false;
    }

    auth.onAuthStateChanged((user) => {
      if (user) finishSignIn(user).catch((error) => {
        authCompletionStarted = false;
        console.error("Authentication state validation failed.", error);
        status.textContent = authErrorText("Authentication failed", error);
        signInButton.disabled = false;
      });
    });

    async function processRedirectResult() {
      try {
        await persistenceReady;
        const result = await auth.getRedirectResult();
        if (result?.user) await finishSignIn(result.user);
      } catch (error) {
        console.error("Google redirect sign in failed.", error);
        status.textContent = authErrorText("Redirect sign in failed", error);
        signInButton.disabled = false;
      }
    }

    processRedirectResult();

    signInButton.addEventListener("click", async () => {
      signInButton.disabled = true;
      status.textContent = "Opening Google sign in…";

      try {
        await persistenceReady;
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ login_hint: allowedEmail });

        if (useRedirectAuth) {
          status.textContent = "Redirecting to Google sign in…";
          await auth.signInWithRedirect(provider);
          return;
        }

        const result = await auth.signInWithPopup(provider);
        await finishSignIn(result.user);
      } catch (error) {
        console.error("Google sign in failed.", error);
        status.textContent = authErrorText("Sign in failed", error);
        signInButton.disabled = false;
      }
    });
  </script>
</body>
</html>
