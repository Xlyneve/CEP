<body>

<!-- Top Buttons -->
<div class="search-add-row">

</div>

<h1>Informations</h1>


<div id="addForm" class="add-form-panel" style="display:none;">
  <div class="form-group">
    <input type="text" id="urlInput" placeholder="Enter URL (https://...)">
  </div>

  <div class="form-group">
    <input type="text" id="urlTitle" placeholder="Enter title">
  </div>

  <div class="form-group">
    <textarea id="urlNote" rows="3" placeholder="Add a note..."></textarea>
  </div>

  <div class="form-group">
    <button type="button" id="saveUrlBtn">Save URL</button>
    <button onclick="toggleAddForm()">Cancel</button>
  </div>
</div>

<main class="forms-workspace">
  <aside class="forms-sidebar" aria-label="Saved forms">
    <input type="text" id="searchInput" placeholder="Search saved forms" aria-label="Search saved forms">
    <div class="file-grid" id="fileList"></div>
  </aside>

  <div
    class="forms-resizer"
    id="formsResizer"
    role="separator"
    tabindex="0"
    aria-label="Resize saved forms and preview panels"
    aria-orientation="vertical"
    aria-valuemin="190"
    aria-valuenow="240"
    title="Drag to resize panels">
  </div>

  <section class="form-preview" aria-label="Form preview">
    <div class="preview-empty" id="previewEmpty">Select a form on the left to preview it here.</div>
    <div class="preview-toolbar" id="previewToolbar">
      <strong id="previewTitle">Preview</strong>
      <a id="previewOpenLink" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
    </div>
    <iframe
      class="preview-frame"
      id="previewFrame"
      title="Selected form preview"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </section>
</main>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  // Firebase config
  const firebaseConfig = {
     apiKey: "AIzaSyAgYsVQNEOyQa41NkXXT2VuKClqXAxfG1Q",
      authDomain: "cepx-f9d2a.firebaseapp.com",
      projectId: "cepx-f9d2a",
      storageBucket: "cepx-f9d2a.firebasestorage.com",
      messagingSenderId: "840696526325",
      appId: "1:840696526325:web:b9bcb4669fbfad066a1cbc"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  firebase.auth();
  const db = firebase.firestore();
  const externalOnlyHosts = [
    'akohiringa.co.nz',
    'healthify.nz'
  ];
  let modularFirestorePromise;

  function getModularFirestore() {
    if (!modularFirestorePromise) {
      modularFirestorePromise = Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
        window.CEP_AUTH_READY
      ]).then(([firestoreSdk, authorized]) => {
        if (!authorized || !window.CEP_FIREBASE_APP) {
          throw new Error('Your signed-in session is not ready.');
        }
        return {
          firestoreSdk,
          firestore: firestoreSdk.getFirestore(window.CEP_FIREBASE_APP)
        };
      });
    }
    return modularFirestorePromise;
  }

  async function addURL() {
    const saveButton = document.getElementById('saveUrlBtn');
    const url = document.getElementById('urlInput').value.trim();
    const title = document.getElementById('urlTitle').value.trim() || 'Untitled';
    const note = document.getElementById('urlNote').value.trim();

    if (!url.startsWith('http')) {
      alert('Please enter a valid URL (https://...)');
      return;
    }

    saveButton.disabled = true;
    saveButton.textContent = 'Saving…';
    try {
      const { firestoreSdk, firestore } = await getModularFirestore();
      await firestoreSdk.addDoc(firestoreSdk.collection(firestore, 'urlForms'), {
        url, title, note,
        openCount: 0,
        createdAt: firestoreSdk.serverTimestamp()
      });
      window.invalidateCepSearchCache?.('main:urlForms');

      document.getElementById('urlInput').value = '';
      document.getElementById('urlTitle').value = '';
      document.getElementById('urlNote').value = '';
      document.getElementById('addForm').style.display = 'none';
      document.getElementById('addToggleBtn').textContent = '+';
      saveButton.textContent = 'Saved';
      void fetchURLs(document.getElementById('searchInput').value, true)
        .catch(error => console.error('Saved URL list could not be refreshed.', error));
    } catch (error) {
      console.error('URL could not be saved.', error);
      alert(`URL could not be saved: ${error.message || 'Please try again.'}`);
    } finally {
      saveButton.disabled = false;
      saveButton.textContent = 'Save URL';
    }
  }

  const URL_CACHE_TTL_MS = 30000;
  let cachedUrlDocs = null;
  let urlCacheExpiresAt = 0;
  let urlLoadPromise = null;

  async function loadUrlDocs(forceRefresh = false) {
    if (!forceRefresh && cachedUrlDocs && Date.now() < urlCacheExpiresAt) return cachedUrlDocs;
    if (!forceRefresh && urlLoadPromise) return urlLoadPromise;
    urlLoadPromise = db.collection('urlForms').orderBy('createdAt', 'desc').get()
      .then(snapshot => {
        cachedUrlDocs = snapshot.docs;
        urlCacheExpiresAt = Date.now() + URL_CACHE_TTL_MS;
        return cachedUrlDocs;
      })
      .finally(() => { urlLoadPromise = null; });
    return urlLoadPromise;
  }

  async function fetchURLs(filter = '', forceRefresh = false) {
  if (!forceRefresh && cachedUrlDocs) {
    renderURLDocs(cachedUrlDocs, filter);
    if (Date.now() < urlCacheExpiresAt) return;
  }
  const urlDocs = await loadUrlDocs(forceRefresh);
  // Network responses always use the current query, never a stale keystroke.
  renderURLDocs(urlDocs, document.getElementById('searchInput').value);
}

function renderURLDocs(urlDocs, filter) {
  const container = document.getElementById('fileList');
  container.innerHTML = '';

  const rankedDocs = [...urlDocs].sort((leftDoc, rightDoc) => {
    const left = leftDoc.data();
    const right = rightDoc.data();
    const countDifference = (Number(right.openCount) || 0) - (Number(left.openCount) || 0);
    if (countDifference) return countDifference;

    const leftOpened = left.lastOpenedAt?.toMillis?.() || 0;
    const rightOpened = right.lastOpenedAt?.toMillis?.() || 0;
    return rightOpened - leftOpened;
  });

  rankedDocs.forEach(doc => {
    const data = doc.data();

    const search = filter.toLowerCase().trim();
    const titleMatch = (data.title || '').toLowerCase().includes(search);
    const noteMatch = (data.note || '').toLowerCase().includes(search);

    if (!search || titleMatch || noteMatch) {
      const safeTitle = (data.title || '').replace(/'/g, "\\'");
      const safeNote = (data.note || '').replace(/'/g, "\\'");
      const safeUrl = data.url || '';

      const div = document.createElement('div');
      div.className = 'file-item';
	  
      div.innerHTML = `
        <div class="view-mode" id="view-${doc.id}">
  <strong>${data.title || 'Untitled'}</strong>
  ${data.note ? `<em>${data.note}</em>` : ''}
</div>

        <div class="edit-mode" id="edit-${doc.id}" style="display:none; margin-top:10px;">
  <input 
    type="text" 
    id="edit-title-${doc.id}" 
    value="${escapeHtmlAttr(data.title || '')}" 
    placeholder="Edit title" 
    style="width:100%; margin-bottom:8px;"
  >

  <input 
    type="text" 
    id="edit-url-${doc.id}" 
    value="${escapeHtmlAttr(data.url || '')}" 
    placeholder="Edit URL" 
    style="width:100%; margin-bottom:8px;"
  >

  <textarea 
    id="edit-note-${doc.id}" 
    rows="4" 
    placeholder="Edit note" 
    style="width:100%; margin-bottom:8px;"
  >${escapeHtmlText(data.note || '')}</textarea>

  <div style="display:flex; gap:8px; flex-wrap:wrap;">
    <button onclick="saveInlineEdit('${doc.id}')">Save</button>
    <button onclick="cancelInlineEdit('${doc.id}')">Cancel</button>
  </div>
</div>

        <div class="card-controls">

  <div class="file-buttons">
    <button onclick="startInlineEdit('${doc.id}')" title="Edit">Edit</button>
    <button onclick="deleteURL('${doc.id}')" title="Delete">Delete</button>
  </div>

  <button
    type="button"
    class="card-light"
    title="Options"
    aria-label="Show options">
  </button>

</div>
      `;
	  
const controls = div.querySelector('.card-controls');
const light = div.querySelector('.card-light');

light.addEventListener('click', (e) => {
  e.stopPropagation();

  document.querySelectorAll('.card-controls.open').forEach(other => {
    if (other !== controls) other.classList.remove('open');
  });

  controls.classList.toggle('open');
});

div.addEventListener('click', (e) => {
  if (
    e.target.closest('button') ||
    e.target.closest('input') ||
    e.target.closest('textarea') ||
    e.target.closest('.edit-mode')
  ) {
    return;
  }

  if (safeUrl) {
    void recordFormOpen(doc.id);
    showFormPreview(safeUrl, data.title || 'Untitled', div);
  }
});
container.appendChild(div);
    }
  });
}

async function recordFormOpen(id) {
  try {
    await db.collection('urlForms').doc(id).update({
      openCount: firebase.firestore.FieldValue.increment(1),
      lastOpenedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    urlCacheExpiresAt = 0;
  } catch (error) {
    console.error('Form open count could not be updated.', error);
  }
}

function showFormPreview(url, title, selectedCard) {
  let parsedUrl;
  try {
    parsedUrl = new URL(url);
  } catch (error) {
    alert('This form does not have a valid preview URL.');
    return;
  }

  if (!['http:', 'https:'].includes(parsedUrl.protocol)) {
    alert('This form does not have a valid preview URL.');
    return;
  }

  const hostname = parsedUrl.hostname.toLowerCase();
  const opensExternally = externalOnlyHosts.some(host => (
    hostname === host || hostname.endsWith(`.${host}`)
  ));

  document.querySelectorAll('.file-item.is-selected').forEach(card => {
    card.classList.remove('is-selected');
  });
  selectedCard.classList.add('is-selected');

  const previewEmpty = document.getElementById('previewEmpty');
  const previewToolbar = document.getElementById('previewToolbar');
  const previewTitle = document.getElementById('previewTitle');
  const previewOpenLink = document.getElementById('previewOpenLink');
  const previewFrame = document.getElementById('previewFrame');
  const formPreview = document.querySelector('.form-preview');

  previewToolbar.style.display = 'flex';
  previewTitle.textContent = title;
  previewOpenLink.href = parsedUrl.href;

  if (opensExternally) {
    previewEmpty.style.display = 'grid';
    previewEmpty.textContent = 'This website prevents an embedded preview. Click here to open it in a new tab.';
    previewFrame.style.display = 'none';
    previewFrame.removeAttribute('src');
    formPreview.classList.add('is-external-fallback');
    formPreview.dataset.externalUrl = parsedUrl.href;
    formPreview.tabIndex = 0;
    formPreview.setAttribute('aria-label', `${title}. Preview unavailable; open in a new tab.`);
    return;
  }

  previewEmpty.style.display = 'none';
  formPreview.classList.remove('is-external-fallback');
  delete formPreview.dataset.externalUrl;
  formPreview.removeAttribute('tabindex');
  formPreview.setAttribute('aria-label', 'Form preview');
  previewFrame.style.display = 'block';
  previewFrame.src = parsedUrl.href;
}

function escapeHtmlAttr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function escapeHtmlText(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

  function startInlineEdit(id) {
  const view = document.getElementById(`view-${id}`);
  const edit = document.getElementById(`edit-${id}`);
  const card = view?.closest('.file-item');
  if (card) card.classList.add('is-editing');
  if (view) view.style.display = 'none';
  if (edit) edit.style.display = 'block';
}

function cancelInlineEdit(id) {
  const view = document.getElementById(`view-${id}`);
  const edit = document.getElementById(`edit-${id}`);
  const card = edit?.closest('.file-item');
  if (card) card.classList.remove('is-editing');
  if (view) view.style.display = 'flex';
  if (edit) edit.style.display = 'none';
}

async function saveInlineEdit(id) {
  const newTitle = document.getElementById(`edit-title-${id}`).value.trim() || 'Untitled';
  const newUrl = document.getElementById(`edit-url-${id}`).value.trim();
  const newNote = document.getElementById(`edit-note-${id}`).value.trim();

  if (!newUrl.startsWith('http')) {
    alert('Please enter a valid URL starting with https:// or http://');
    return;
  }

  await db.collection('urlForms').doc(id).update({
    title: newTitle,
    url: newUrl,
    note: newNote
  });
  window.invalidateCepSearchCache?.('main:urlForms');

  fetchURLs(document.getElementById('searchInput').value, true);
}

  async function deleteURL(id) {
    if (confirm('Delete this URL entry?')) {
      await db.collection('urlForms').doc(id).delete();
      window.invalidateCepSearchCache?.('main:urlForms');
      fetchURLs(document.getElementById('searchInput').value, true);
    }
  }

  // Filter files based on search input
  let urlSearchTimer;
  function filterFiles() {
    clearTimeout(urlSearchTimer);
    urlSearchTimer = setTimeout(() => {
      const term = document.getElementById('searchInput').value;
      void fetchURLs(term).catch(error => console.error('URL search could not refresh.', error));
    }, 120);
  }

  // Always show search input
  const searchInput = document.getElementById('searchInput');
  searchInput.style.display = 'block';
  searchInput.addEventListener('input', filterFiles);

  const formsWorkspace = document.querySelector('.forms-workspace');
  const formsSidebar = document.querySelector('.forms-sidebar');
  const formsResizer = document.getElementById('formsResizer');
  const desktopFormsLayout = window.matchMedia('(min-width: 761px)');
  const minimumSidebarWidth = 190;
  const minimumPreviewWidth = 300;

  function getMaximumSidebarWidth() {
    return Math.max(
      minimumSidebarWidth,
      formsWorkspace.clientWidth - minimumPreviewWidth - 32
    );
  }

  function setSidebarWidth(width, save = false) {
    if (!desktopFormsLayout.matches) return;

    const nextWidth = Math.round(Math.min(
      Math.max(width, minimumSidebarWidth),
      getMaximumSidebarWidth()
    ));

    formsWorkspace.style.setProperty('--forms-sidebar-width', `${nextWidth}px`);
    formsSidebar.classList.toggle('is-wide', nextWidth >= 400);
    formsSidebar.classList.toggle('is-extra-wide', nextWidth >= 610);
    formsResizer.setAttribute('aria-valuenow', String(nextWidth));
    formsResizer.setAttribute('aria-valuemax', String(Math.round(getMaximumSidebarWidth())));

    if (save) localStorage.setItem('formsSidebarWidth', String(nextWidth));
  }

  const savedSidebarWidth = Number(localStorage.getItem('formsSidebarWidth'));
  setSidebarWidth(Number.isFinite(savedSidebarWidth) && savedSidebarWidth > 0
    ? savedSidebarWidth
    : 240);

  formsResizer.addEventListener('pointerdown', event => {
    if (!desktopFormsLayout.matches) return;

    event.preventDefault();
    formsResizer.setPointerCapture(event.pointerId);
    formsResizer.classList.add('is-dragging');

    const startX = event.clientX;
    const startWidth = formsSidebar.getBoundingClientRect().width;

    const handlePointerMove = moveEvent => {
      setSidebarWidth(startWidth + moveEvent.clientX - startX);
    };

    const finishResize = () => {
      formsResizer.classList.remove('is-dragging');
      formsResizer.removeEventListener('pointermove', handlePointerMove);
      formsResizer.removeEventListener('pointerup', finishResize);
      formsResizer.removeEventListener('pointercancel', finishResize);
      localStorage.setItem('formsSidebarWidth', String(Math.round(
        formsSidebar.getBoundingClientRect().width
      )));
    };

    formsResizer.addEventListener('pointermove', handlePointerMove);
    formsResizer.addEventListener('pointerup', finishResize);
    formsResizer.addEventListener('pointercancel', finishResize);
  });

  formsResizer.addEventListener('keydown', event => {
    if (!desktopFormsLayout.matches || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) {
      return;
    }

    event.preventDefault();
    const currentWidth = formsSidebar.getBoundingClientRect().width;
    if (event.key === 'Home') setSidebarWidth(minimumSidebarWidth, true);
    if (event.key === 'End') setSidebarWidth(getMaximumSidebarWidth(), true);
    if (event.key === 'ArrowLeft') setSidebarWidth(currentWidth - 24, true);
    if (event.key === 'ArrowRight') setSidebarWidth(currentWidth + 24, true);
  });

  window.addEventListener('resize', () => {
    if (desktopFormsLayout.matches) {
      setSidebarWidth(formsSidebar.getBoundingClientRect().width);
    }
  });

function toggleAddForm() {
  const form = document.getElementById('addForm');
  const btn = document.getElementById('addToggleBtn');

  const isHidden = form.style.display === 'none' || form.style.display === '';

  if (isHidden) {
    form.style.display = 'block';
    btn.textContent = '×';
  } else {
    form.style.display = 'none';
    btn.textContent = '+';
  }
}


document.addEventListener('click', (e) => {
  if (!e.target.closest('.card-controls')) {
    document.querySelectorAll('.card-controls.open').forEach(control => {
      control.classList.remove('open');
    });
  }
});

  const formPreviewPanel = document.querySelector('.form-preview');

  function openPreviewFallback() {
    const externalUrl = formPreviewPanel.dataset.externalUrl;
    if (!externalUrl) return;

    const externalWindow = window.open(externalUrl, '_blank', 'noopener,noreferrer');
    if (!externalWindow) {
      alert('Please allow pop-ups to open this website in a new tab.');
    }
  }

  formPreviewPanel.addEventListener('click', event => {
    if (!formPreviewPanel.dataset.externalUrl || event.target.closest('a')) return;
    openPreviewFallback();
  });

  formPreviewPanel.addEventListener('keydown', event => {
    if (!formPreviewPanel.dataset.externalUrl || !['Enter', ' '].includes(event.key)) return;
    event.preventDefault();
    openPreviewFallback();
  });

  document.getElementById('saveUrlBtn').addEventListener('click', addURL);
  void getModularFirestore().catch(error => console.error('Save connection could not be prepared.', error));
  Promise.resolve(window.CEP_AUTH_READY)
    .then(authorized => authorized && fetchURLs())
    .catch(error => console.error('URLs could not be loaded.', error));
</script>
