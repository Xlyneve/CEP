<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <script src="auth-guard.js?v=20260823-8"></script>
  <script src="security.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="header-rays.css?v=27">
  <title>Vaccine Spacing Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Arial&display=swap" rel="stylesheet" />
  <style>
    
	body {
  position: relative;
  margin: 0;
  padding: 90px 40px 40px;
  font-family: fors, sans-serif;
  font-size: 16px;
  color: #111;
  background: none;
  z-index: 0;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  background: url('site-background.webp') no-repeat center center fixed;
  background-size: cover;
  filter: blur(15px);
  z-index: -1;
}

	@font-face {
  font-family: 'fors';
  src: url('fors.ttf') format('truetype'); /* Adjust the path to where the font is stored */
  }

  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    min-height: 70px;
    background: linear-gradient(135deg, rgba(192, 183, 187, 0.7), rgba(235, 232, 233, 0.58));
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 0;
    box-shadow: 0 10px 28px rgba(92, 72, 82, 0.15);
    z-index: 50;
  }

  .header-title {
    position: absolute;
    top: 50%;
    left: 68px;
    margin: 0;
    transform: translateY(-50%) !important;
    font-family: Tahoma, sans-serif;
    font-size: 22px;
    line-height: 1;
    letter-spacing: normal;
    font-weight: bold;
    color: #000;
    text-align: left;
    z-index: 60;
    pointer-events: auto;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
  }

  .header-left {
    display: contents;
  }

  .header .center-toggle {
    position: absolute;
    top: 50%;
    left: 50%;
    right: auto;
    bottom: auto;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 26px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  

    .tile-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .vaccine-section {
  padding: 18px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.2);
  box-shadow:
    0 8px 32px rgba(31, 38, 135, 0.1),
    0 0 0 1px rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  color: #111;
  margin-bottom: 20px;
}

.vaccine-section:hover {
  transform: translateY(-4px);
  box-shadow:
    0 12px 48px rgba(31, 38, 135, 0.2),
    0 0 12px rgba(255, 255, 255, 0.3);
}


    label {
      font-size: 18px;
      margin-bottom: 5px;
      color: #4a4a4a;
    }

    input[type="date"] {
      padding: 8px;
      width: 200px;
      font-size: 14px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background-color: #f3f3f3;
    }

    body .result {
      font-size: 16px;
      font-weight: bold;
	  font-family: fors, sans-serif;
      color: #0b0b0b !important;
      margin-top: 10px;
      padding: 3px 0;
      width: fit-content;
      max-width: 100%;
      position: relative;
      isolation: isolate;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      text-shadow: none;
    }

    body .result::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -0.25em -0.8em;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow:
        0 0 10px 5px rgba(255, 255, 255, 0.72),
        0 0 24px 10px rgba(255, 255, 255, 0.44),
        0 0 42px 16px rgba(255, 255, 255, 0.20);
      filter: blur(5px);
      pointer-events: none;
    }

    body .result:empty::before {
      opacity: 0.22;
    }

    body .result.highlight {
      background: transparent !important;
      padding: 3px 0;
      border: 0 !important;
      border-radius: 0;
      box-shadow: none !important;
      font-weight: bold;
      text-shadow: none;
    }

    .vaccine-section {
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    /* no border-left */
  }
  .rabies { background-color: rgba(233, 203, 203, 0.10); }
.engerix { background-color: rgba(172, 163, 126, 0.10); }
.hpv { background-color: rgba(221, 198, 178, 0.10); }
.shingrix { background-color: rgba(115, 121, 88, 0.10); }
.twinrix { background-color: rgba(233, 203, 203, 0.10); }
.bexsero { background-color: rgba(221, 198, 178, 0.10); }
.pneumococcal { background-color: rgba(172, 163, 126, 0.10); }

  </style>
  <link rel="stylesheet" href="site-background.css">
  <script src="page-theme.js?v=1"></script>
  <style>
    .tile-container > .vaccine-section {
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.78) !important;
      box-shadow:
        0 12px 30px rgba(92, 72, 82, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.86),
        inset 0 -1px 0 rgba(158, 137, 147, 0.14) !important;
      backdrop-filter: blur(16px) saturate(118%);
      -webkit-backdrop-filter: blur(16px) saturate(118%);
    }
    .tile-container > .vaccine-section:nth-child(5n + 1) {
      background: linear-gradient(135deg, rgba(158, 137, 147, 0.36), rgba(235, 232, 233, 0.7)) !important;
    }
    .tile-container > .vaccine-section:nth-child(5n + 2) {
      background: linear-gradient(135deg, rgba(173, 159, 166, 0.4), rgba(235, 232, 233, 0.72)) !important;
    }
    .tile-container > .vaccine-section:nth-child(5n + 3) {
      background: linear-gradient(135deg, rgba(192, 183, 187, 0.44), rgba(235, 232, 233, 0.74)) !important;
    }
    .tile-container > .vaccine-section:nth-child(5n + 4) {
      background: linear-gradient(135deg, rgba(213, 208, 211, 0.52), rgba(235, 232, 233, 0.76)) !important;
    }
    .tile-container > .vaccine-section:nth-child(5n + 5) {
      background: linear-gradient(135deg, rgba(235, 232, 233, 0.84), rgba(213, 208, 211, 0.46)) !important;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-bg"></div>

    <div class="header-left">
      <!-- Shared header menu -->
      <div class="center-toggle">
        <div class="toggle-icon" id="menuToggle">☐</div>
        <div class="rays">
          <!-- Rays will be generated dynamically by JS -->
        </div>
      </div>
    </div>

    <h1 class="header-title">Vaccine Spacing Calculator</h1>
  </div>

  <div class="tile-container">

    <!-- Rabies -->
<div class="vaccine-section rabies">
  <h2>Rabies Schedule</h2>
  <label for="rabies1">First Dose:</label>
  <input type="date" id="rabies1">
  <div class="result" id="rabies2"></div>
  <div class="result" id="rabies3"></div>
</div>

<div class="vaccine-section engerix">
  <h2>Engerix-B (Hep B) Accelerated</h2>
  <label for="engerix1">First Dose:</label>
  <input type="date" id="engerix1">
  <div class="result" id="engerix2"></div>
  <div class="result" id="engerix3"></div>
</div>

<div class="vaccine-section hpv">
  <h2>HPV (Gardasil)</h2>
  <label for="hpv1">First Dose:</label>
  <input type="date" id="hpv1">
  <div class="result" id="hpv2"></div>
  <div class="result" id="hpv3"></div>
</div>

<div class="vaccine-section shingrix">
  <h2>Shingrix</h2>
  <label for="shingrix1">First Dose:</label>
  <input type="date" id="shingrix1">
  <div class="result" id="shingrix2"></div>
</div>

<div class="vaccine-section twinrix">
  <h2>Twinrix (Accelerated)</h2>
  <label for="twinrix1">First Dose:</label>
  <input type="date" id="twinrix1">
  <div class="result" id="twinrix2"></div>
  <div class="result" id="twinrix3"></div>
  <div class="result" id="twinrix4"></div>
</div>

<div class="vaccine-section bexsero">
  <h2>Bexsero Vaccine</h2>
  <label for="bexsero1">First Dose:</label>
  <input type="date" id="bexsero1">
  <div class="result" id="bexsero2"></div>
  <div class="result highlight" id="bexsero3"></div>
  <div class="result highlight" id="bexsero4"></div>
  <div class="result" id="bexsero5"></div>
  <div class="result highlight" id="bexsero6"></div>
</div>

<div class="vaccine-section pneumococcal">
  <h2>Pneumococcal Vaccine</h2>
  <label for="pneumo1">First Dose:</label>
  <input type="date" id="pneumo1">
  <div class="result" id="pneumoOption1"></div>
  <div class="result" id="pneumoOption2"></div>
  <div class="result highlight" id="pneumoOver65"></div>
</div>


  </div>

  <script>
    function boldDose(text) {
      return text.replace(/(Dose \d+|Previnar|Pneumovax)/gi, '<strong>$1</strong>');
    }

    function formatDate(date) {
      return date.toLocaleDateString('en-GB', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function addMonths(date, months) {
      const result = new Date(date);
      result.setMonth(result.getMonth() + months);
      return result;
    }

    function addWeeks(date, weeks) {
      return addDays(date, weeks * 7);
    }

    // Existing vaccine scripts...
    document.getElementById('rabies1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('rabies2').innerHTML = boldDose(`Dose 2 (Day 7): ${formatDate(addDays(d, 7))}`);
      document.getElementById('rabies3').innerHTML = boldDose(`Dose 3 (Day 21 or 28): ${formatDate(addDays(d, 21))} or ${formatDate(addDays(d, 28))}`);
    });

    document.getElementById('engerix1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('engerix2').innerHTML = boldDose(`Dose 2 (1 month): ${formatDate(addMonths(d, 1))}`);
      document.getElementById('engerix3').innerHTML = boldDose(`Dose 3 (6 months): ${formatDate(addMonths(d, 6))}`);
    });

    document.getElementById('hpv1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('hpv2').innerHTML = boldDose(`Dose 2 (2 months): ${formatDate(addMonths(d, 2))}`);
      document.getElementById('hpv3').innerHTML = boldDose(`Dose 3 (6 months): ${formatDate(addMonths(d, 6))}`);
    });

    document.getElementById('shingrix1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('shingrix2').innerHTML = boldDose(`Dose 2 (2–6 months): Between ${formatDate(addMonths(d, 2))} and ${formatDate(addMonths(d, 6))}`);
    });

    document.getElementById('twinrix1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('twinrix2').innerHTML = boldDose(`Dose 2 (7 days): ${formatDate(addDays(d, 7))}`);
      document.getElementById('twinrix3').innerHTML = boldDose(`Dose 3 (21 days): ${formatDate(addDays(d, 21))}`);
      document.getElementById('twinrix4').innerHTML = boldDose(`Dose 4 (12 months): ${formatDate(addMonths(d, 12))}`);
    });

    document.getElementById('bexsero1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('bexsero2').innerHTML = boldDose(`Dose 2 (Infants 2–11 months, 8 weeks apart): ${formatDate(addWeeks(d, 8))}`);
      document.getElementById('bexsero3').innerHTML = boldDose(`Booster (Infants): ${formatDate(addMonths(d, 6))} or ${formatDate(addMonths(d, 12))}`);
      document.getElementById('bexsero4').innerHTML = boldDose(`Dose 2 (Toddlers 12–23 months, 8 weeks apart): ${formatDate(addWeeks(d, 8))}`);
      document.getElementById('bexsero5').innerHTML = boldDose(`Booster (12–23 months): ${formatDate(addMonths(d, 12))}`);
      document.getElementById('bexsero6').innerHTML = boldDose(`Dose 2 (13+ years, 8 weeks apart): ${formatDate(addWeeks(d, 8))}`);
    });

    document.getElementById('pneumo1').addEventListener('change', e => {
      const d = new Date(e.target.value);
      document.getElementById('pneumoOption1').innerHTML = boldDose(`Not for Immuno: Pneumovax 23 then repeat in 5 years → ${formatDate(addYears(d, 5))}`);
      document.getElementById('pneumoOption2').innerHTML = boldDose(`Immunocompromised: Previnar 13 → ${formatDate(d)} → then Pneumovax 23 in 8 weeks → ${formatDate(addWeeks(d, 8))} → then repeat 23 in 5 years → ${formatDate(addYears(addWeeks(d, 8), 5))}`);
      document.getElementById('pneumoOver65').innerHTML = `For persons ≥ 65 years old, if last dose was ≥5 years ago and given <65, give another dose.`;
    });

    function addYears(date, years) {
      const result = new Date(date);
      result.setFullYear(result.getFullYear() + years);
      return result;
    }

  </script>
  <script src="header-rays.js?v=20"></script>
</body>
</html>
