<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <script src="security.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Recall Tracker</title>

<style>

@font-face {
  font-family: 'hellohon';
  src: url('./hellohon.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root{
  --bg:#fbfcff;
  --glass:rgba(255,255,255,.66);
  --glass2:rgba(255,255,255,.84);
  --glass-hue:rgba(222,232,255,.42);
  --glass-lilac:rgba(244,229,255,.34);
  --line:rgba(132,148,190,.18);
  --ink:#202636;
  --muted:#7d8798;
  --soft:#f7f9ff;
  --blue:#93a8ff;
  --mint:#8ff5d2;
  --pink:#ff9ed8;
  --lilac:#d7a8ff;
  --yellow:#fff09a;
  --red:#d96b6b;
  --shadow:0 18px 52px rgba(120,135,180,.16);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma, Arial, sans-serif;
  color:var(--ink);
  padding:14px;

  background:
    radial-gradient(circle at 18% 14%, rgba(255,255,255,.85), transparent 28%),
    radial-gradient(circle at 82% 10%, rgba(225,233,241,.85), transparent 30%),
    radial-gradient(circle at 45% 96%, rgba(214,224,232,.70), transparent 36%),
    linear-gradient(180deg, #edf3f7 0%, #e4ecf2 48%, #eef3f6 100%);
}

.app{
  width:min(100%, 895px);
  max-width:100%;
  margin:0 auto;
}

[hidden]{ display:none !important; }

.recall-loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  color:var(--muted);
  font-weight:700;
}

.sync-status{
  margin:4px 0 0;
  color:var(--muted);
  font-size:.76rem;
  font-weight:700;
}

.topbar{
  position:sticky;
  top:10px;
  z-index:20;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:14px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:26px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.74), var(--glass-hue) 52%, rgba(255,255,255,.62)),
    var(--glass);
  backdrop-filter:blur(34px) saturate(210%);
  -webkit-backdrop-filter:blur(34px) saturate(210%);
  box-shadow:var(--shadow);
  width:100%;
}

.left-top{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  width:100%;
  text-align:center;
}

#title{
  margin:0;
  font-family:'hellohon', Tahoma, Arial, sans-serif !important;
  font-size:clamp(2.4rem,5.5vw,3.8rem);
  font-weight:400;
  letter-spacing:.01em;
  line-height:1;
  color:rgba(52,67,88,.86);
  text-shadow:
    0 1px 1px rgba(255,255,255,.8),
    0 8px 22px rgba(80,95,120,.18),
    .45px 0 currentColor,
    0 .45px currentColor;
}

.month-check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.8rem;
  color:var(--muted);
  line-height:1.1;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
}

button, select, input{
  font:inherit;
}

button, select{
  border:1px solid rgba(255,255,255,.82);
  background:rgba(255,255,255,.72);
  color:var(--ink);
  border-radius:999px;
  padding:9px 12px;
  box-shadow:0 8px 18px rgba(70,80,100,.08);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

button{
  cursor:pointer;
  transition:.16s ease;
}

button:active{
  transform:scale(.96);
}

.primary{
  background:rgba(142,167,255,.24);
  border-color:rgba(142,167,255,.32);
}

.edit-on{
  background:rgba(255,230,230,.75);
  border-color:rgba(217,107,107,.28);
  color:#8d3d3d;
}


input[type="checkbox"]{
  width:21px;
  height:21px;
  accent-color:#fff09a;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  border:2px solid rgba(95,110,155,.55);
  border-radius:8px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.96), rgba(236,241,255,.86));
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.9),
    0 4px 12px rgba(80,95,140,.16);
  position:relative;
}

input[type="checkbox"]:checked{
  border-color:rgba(255,224,105,.82);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff8b8, #ffe36d 58%, #ffc7ec);
  box-shadow:
    0 0 0 3px rgba(255,224,105,.22),
    0 0 18px rgba(255,224,105,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* First column weekly task ticks */
.weekly-task input[type="checkbox"]:checked{
  border-color:rgba(178,151,255,.78);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #e9d7ff, #bfa7ff 58%, #9fb8ff);
  box-shadow:
    0 0 0 3px rgba(191,167,255,.2),
    0 0 18px rgba(159,184,255,.35),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* Added weekly custom ticks */
.week-tick input[type="checkbox"]:checked{
  border-color:rgba(255,150,60,.85);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff0d6, #ffb36b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,150,60,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* Added day-only custom ticks */
.day-tick input[type="checkbox"]:checked{
  border-color:rgba(255,150,60,.85);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff0d6, #ffb36b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,150,60,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* Added weekly custom ticks - orange */
.week-tick input[type="checkbox"]:checked{
  border-color:rgba(255,145,55,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff1dc, #ffb56b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,145,55,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* Added daily custom ticks - orange */
.day-tick input[type="checkbox"]:checked{
  border-color:rgba(255,145,55,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff1dc, #ffb56b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,145,55,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

/* Added monthly custom ticks - orange */
.added-month-tick input[type="checkbox"]:checked{
  border-color:rgba(255,145,55,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff1dc, #ffb56b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,145,55,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

.board{
  width:100%;
  max-width:100%;
  margin:14px auto 0;
  padding:14px;

  border:1px solid rgba(255,255,255,.72);
  border-radius:32px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.48),
      rgba(235,242,255,.24),
      rgba(247,235,255,.22)
    );

  backdrop-filter:blur(30px) saturate(165%);
  -webkit-backdrop-filter:blur(30px) saturate(165%);

  box-shadow:
    0 18px 50px rgba(95,112,135,.16),
    inset 0 1px 0 rgba(255,255,255,.80),
    inset 0 -1px 0 rgba(255,255,255,.22);

  overflow:auto;
}

.calendar{
  position:relative;
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:130px repeat(7, minmax(105px, 1fr));
  border-radius:28px;
  overflow:hidden;
  margin-top:0;
 }

.calendar::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:1;

  background:
    radial-gradient(
      circle at 22% 10%,
      rgba(255,255,255,.34),
      transparent 30%
    );
}

.calendar > *{
  position:relative;
  z-index:2;
}

.cell{
  min-height:110px;
  padding:9px;

  border-right:1px solid rgba(255,255,255,.36);
  border-bottom:1px solid rgba(255,255,255,.34);

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.22),
      rgba(255,255,255,.08)
    );

  backdrop-filter:blur(12px) saturate(130%);
  -webkit-backdrop-filter:blur(12px) saturate(130%);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45);
}

.cell:nth-child(8n){
  border-right:none;
}

.head{
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.78rem;
  font-weight:700;
  text-transform:uppercase;
  color:rgba(48,60,78,.82);
  letter-spacing:.08em;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.36),
      rgba(255,255,255,.16)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65);
}

.weekly-head{
  justify-content:flex-start;
}

.weekly{
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.28),
      rgba(255,255,255,.12)
    );
}

.task, .tick-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:29px;
  font-size:.82rem;
}

.icon-btn{
  width:28px;
  height:28px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:.82rem;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.82);
  box-shadow:
    0 8px 18px rgba(70,80,100,.08),
    inset 0 1px 0 rgba(255,255,255,.8);
}

.tick-color-orange input[type="checkbox"]:checked{
  border-color:rgba(255,145,55,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #fff1dc, #ffb56b 55%, #ff8a3d);
  box-shadow:
    0 0 0 3px rgba(255,145,55,.22),
    0 0 18px rgba(255,138,61,.38),
    inset 0 1px 1px rgba(255,255,255,.75);
}

.tick-color-green input[type="checkbox"]:checked{
  border-color:rgba(60,184,88,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #e8ffe1, #8ee47d 55%, #39b957);
  box-shadow:
    0 0 0 3px rgba(72,190,96,.2),
    0 0 18px rgba(57,185,87,.34),
    inset 0 1px 1px rgba(255,255,255,.75);
}

.tick-color-red input[type="checkbox"]:checked{
  border-color:rgba(224,72,72,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #ffe5e5, #ff9696 55%, #e34b4b);
  box-shadow:
    0 0 0 3px rgba(224,72,72,.2),
    0 0 18px rgba(227,75,75,.34),
    inset 0 1px 1px rgba(255,255,255,.75);
}

.tick-color-blue input[type="checkbox"]:checked{
  border-color:rgba(64,125,224,.9);
  background:
    radial-gradient(circle at 28% 25%, rgba(255,255,255,.96), transparent 28%),
    linear-gradient(135deg, #e5efff, #91bdff 55%, #3f7fe4);
  box-shadow:
    0 0 0 3px rgba(64,125,224,.2),
    0 0 18px rgba(63,127,228,.34),
    inset 0 1px 1px rgba(255,255,255,.75);
}

#prevBtn,
#nextBtn{
  width:28px;
  height:28px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.9rem;
  line-height:1;
}

.icon-btn:hover{
  background:rgba(228,238,255,.78);
}

.task span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.tick-row{
  align-items:flex-start;
}

.tick-row > input[type="checkbox"]{
  flex:0 0 21px;
  margin-top:1px;
}

.tick-row > span{
  min-width:0;
  flex:1 1 auto;
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.35;
}

.delete-mini{
  display:none;
  position:absolute;
  right:2px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  min-width:18px;
  padding:0;
  border-radius:50%;
  color:#9a4747;
  background:rgba(255,230,230,.88);
  border:1px solid rgba(217,107,107,.24);
  box-shadow:none;
  font-size:12px;
  line-height:1;
  place-items:center;
  z-index:2;
}

body.edit-mode .delete-mini{
  display:inline-grid;
}

body.edit-mode .tick-row{
  position:relative;
  background:rgba(255,245,245,.32);
  border-radius:10px;
  padding-right:22px;
}



.task input{
  margin-left:auto;
  width:18px;
  height:18px;
}

.day.empty{
  background:rgba(255,255,255,.24);
}

.day-num{
  font-weight:700;
  font-size:.95rem;
  margin-bottom:10px;
}
.today-cell{
  background:
    radial-gradient(circle at 28% 18%, rgba(255,255,255,.95), transparent 36%),
    linear-gradient(
      145deg,
      rgba(255,255,255,.58),
      rgba(255,255,255,.28),
      rgba(235,240,255,.18)
    ) !important;

  border:1px solid rgba(255,255,255,.86);

  box-shadow:
  0 0 0 4px rgba(255,255,255,.62),
  0 0 36px rgba(255,255,255,1),
  0 0 72px rgba(255,255,255,.86),
  0 0 115px rgba(255,255,255,.58),
  0 0 150px rgba(220,230,255,.42),
  inset 0 1px 0 rgba(255,255,255,.96),
  inset 0 0 36px rgba(255,255,255,.62);
}

.today-cell .day-num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:26px;
  height:26px;
  padding:0 8px;
  border-radius:999px;

  background:rgba(255,255,255,.86);
  color:#3d4350;

  box-shadow:
  0 0 24px rgba(255,255,255,1),
  0 0 44px rgba(255,255,255,.95),
  0 0 68px rgba(255,255,255,.72),
  0 0 90px rgba(220,230,255,.50),
  inset 0 1px 0 rgba(255,255,255,1);
}

.ticks, .weekly-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.daily-manual-text{
  min-height:1.2em;
  margin-top:5px;
  padding:0;
  border:0;
  outline:none;
  background:transparent;
  box-shadow:none;
  color:var(--ink);
  font:inherit;
  font-size:.82rem;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  cursor:text;
}

.daily-manual-text:empty::before{
  content:"";
  color:rgba(75,86,104,.38);
  pointer-events:none;
}

.daily-manual-text:focus:empty::before{
  content:attr(data-placeholder);
}


.soft-line{
  border:0;
  border-top:1px solid var(--line);
  margin:14px 0;
}

.settings-note{
  margin:10px 4px 0;
  font-size:.78rem;
  color:var(--muted);
}

.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  background:rgba(30,35,45,.14);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.sheet-backdrop.show{
  display:block;
}

.sheet{
  position:fixed;
  left:50%;
  bottom:16px;
  transform:translateX(-50%);
  width:min(520px, calc(100vw - 24px));
  padding:16px;
  border:1px solid rgba(255,255,255,.78);
  border-radius:28px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.82), rgba(228,238,255,.58), rgba(249,236,255,.52)),
    rgba(255,255,255,.72);
  backdrop-filter:blur(42px) saturate(220%);
  -webkit-backdrop-filter:blur(42px) saturate(220%);
  box-shadow:0 24px 80px rgba(60,70,100,.22);
  max-height:calc(100vh - 32px);
  overflow:auto;
}

.sheet h2{
  margin:0 0 4px;
  font-size:1.05rem;
  letter-spacing:-.02em;
}

.sheet p{
  margin:0 0 14px;
  color:var(--muted);
  font-size:.84rem;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:.78rem;
  color:var(--muted);
  margin-bottom:6px;
}

.field input, .field select{
  width:100%;
  border:1px solid var(--line);
  background:rgba(255,255,255,.72);
  color:var(--ink);
  border-radius:16px;
  padding:11px 12px;
}

.tick-form{
  padding:12px;
  margin-bottom:12px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:20px;
  background:rgba(255,255,255,.3);
}

.repeat-options{
  display:grid;
  gap:7px;
  margin-bottom:12px;
}

.repeat-option{
  display:flex !important;
  align-items:center;
  gap:8px;
  margin:0 !important;
  color:var(--ink) !important;
  cursor:pointer;
}

.repeat-option input{
  width:17px;
  height:17px;
  margin:0;
}

.weekday-selectors{
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  gap:5px;
}

.week-position-selectors{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:5px;
}

.week-position-choice{
  display:grid !important;
  place-items:center;
  min-width:0;
  margin:0 !important;
  padding:7px 2px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.46);
  color:var(--ink) !important;
  cursor:pointer;
}

.week-position-choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.week-position-choice:has(input:checked){
  background:rgba(142,167,255,.3);
  border-color:rgba(142,167,255,.48);
}

.specific-date-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.specific-date-row input{
  min-width:0;
  flex:1;
}

.specific-date-row button{
  flex:0 0 auto;
}

.specific-date-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}

.specific-date-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 7px;
  border:1px solid rgba(255,255,255,.72);
  border-radius:999px;
  background:rgba(255,255,255,.44);
  color:var(--ink);
  font-size:.72rem;
}

.specific-date-chip button{
  width:16px;
  height:16px;
  padding:0;
  display:grid;
  place-items:center;
  border:0;
  background:transparent;
  box-shadow:none;
  color:#9a4747;
  font-size:.75rem;
}

.weekday-choice{
  display:grid !important;
  place-items:center;
  min-width:0;
  margin:0 !important;
  padding:7px 2px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.46);
  color:var(--ink) !important;
  cursor:pointer;
}

.weekday-choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.weekday-choice:has(input:checked){
  background:rgba(142,167,255,.3);
  border-color:rgba(142,167,255,.48);
}

.tick-colour-options{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:6px;
}

.tick-colour-choice{
  display:grid !important;
  justify-items:center;
  gap:5px;
  margin:0 !important;
  padding:7px 3px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.42);
  color:var(--ink) !important;
  font-size:.7rem !important;
  cursor:pointer;
}

.tick-colour-choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.tick-colour-choice:has(input:checked){
  border-color:rgba(88,105,150,.52);

<script>

const recallTrackerApp = firebase.apps.find(app => app.name === "recall-tracker") ||

let pendingAuthMessage = "";

function withTimeout(promise, timeoutMs, message){
  let timeoutId;
  const timeout = new Promise((_, reject) => {
    timeoutId = window.setTimeout(() => reject(new Error(message)), timeoutMs);
  });
  return Promise.race([promise, timeout]).finally(() => window.clearTimeout(timeoutId));
}

function key(){
  return `${currentYear}-${String(currentMonth+1).padStart(2,"0")}`;
}

function setSyncStatus(message){
  syncStatus.textContent = message;
}

function readLocalBackup(){
  try{
    const saved = localStorage.getItem(LOCAL_BACKUP_KEY);
    return saved ? JSON.parse(saved) : null;
  }catch(error){
    console.warn("Recall Tracker local backup could not be read:", error);
    return null;
  }
}

function persistLocalBackup(){
  try{
    localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(state));
  }catch(error){
    console.warn("Recall Tracker local backup could not be saved:", error);
  }
}

function makeTickId(){
  return `tick-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

const tickColours = ["yellow", "orange", "green", "red", "blue"];

function definitionColour(definition){
  if(tickColours.includes(definition.color)) return definition.color;
  return definition.repeat === "weekdays" ? "orange" : "yellow";
}

function cloneTickDefinitions(definitions){
  return JSON.parse(JSON.stringify(definitions || []));
}

function cloneTickDefinitionsForMonth(definitions, monthKey){
  return cloneTickDefinitions(definitions).flatMap(definition => {
    if(definition.repeat !== "dates") return [definition];
    definition.dates = (definition.dates || []).filter(date => date.startsWith(`${monthKey}-`));
    return definition.dates.length ? [definition] : [];
  });
}

function ensureTickDefinitions(){
  let changed = false;
  const existing = Array.isArray(state.tickDefinitions) ? state.tickDefinitions : [];

  if(state.tickDefinitionsVersion < 2){
    const migratedNames = new Set(state.monthlyRows || ["CEP"]);
    Object.values(state.months || {}).forEach(month => {
      (month.monthlyRows || []).forEach(name => migratedNames.add(name === "Me" ? "CEP" : name));
    });
    migratedNames.forEach(name => {
      const cleanName = String(name || "").trim();
      if(!cleanName || existing.some(item => item.name.toLowerCase() === cleanName.toLowerCase())) return;
      existing.push({ id:makeTickId(), name:cleanName, repeat:"daily", weekdays:[], dayOfMonth:1, color:"yellow" });
    });
    changed = true;
  }

  existing.forEach(definition => {
    if(tickColours.includes(definition.color)) return;
    definition.color = definitionColour(definition);
    changed = true;
  });

  state.tickDefinitions = existing;
  state.months ||= {};
  Object.entries(state.months).forEach(([monthKey, month]) => {
    if(!Array.isArray(month.tickDefinitions)){
      month.tickDefinitions = cloneTickDefinitionsForMonth(existing, monthKey);
      changed = true;
    }
  });

  if(state.tickDefinitionsVersion !== 3){
    state.tickDefinitionsVersion = 3;
    changed = true;
  }
  return changed;
}

function applyTrackerState(nextState){
  state = nextState || {};
  weeklyTasks = state.weeklyTasks || ["QB", "Cx + CxSO", "Mammo"];
  Object.values(state.months || {}).forEach(month => {
    Object.values(month.days || {}).forEach(dayObj => {
      if("Me" in dayObj){
        dayObj["CEP"] = dayObj["Me"];
        delete dayObj["Me"];
      }
    });
  });
  tickDefinitionsNeedSave = ensureTickDefinitions() || tickDefinitionsNeedSave;
  currentMonth = state.currentMonth ?? today.getMonth();
  currentYear = state.currentYear ?? today.getFullYear();
  stateLoaded = true;
}

function startFirestoreSync(){
  if(firestoreUnsubscribe) return;
  console.info("Recall Tracker Firestore listener starting.");
  setSyncStatus("Connecting…");
  firestoreUnsubscribe = db.collection("recallTrackers").doc(SHARED_RECALL_DOC).onSnapshot(
    { includeMetadataChanges:true },
    snapshot => {
      console.info("Recall Tracker snapshot received:", {
        fromCache:snapshot.metadata.fromCache,
        pendingWrites:snapshot.metadata.hasPendingWrites
      });
      if(snapshot.exists && snapshot.data().state){
        const incomingState = snapshot.data().state;
        const localVersion = Number(state.clientUpdatedAt) || 0;
        const incomingVersion = Number(incomingState.clientUpdatedAt) || 0;
        if(localVersion > incomingVersion){
          setSyncStatus("Saving…");
          return;
        }
        applyTrackerState(incomingState);
        persistLocalBackup();
        if(trackerInitialized && !document.activeElement?.classList.contains("daily-manual-text")) render();
      }
      setSyncStatus(snapshot.metadata.fromCache ? "Offline — saved data" : "Synced");
    },
    error => {
      console.error("Recall Tracker Firestore listener failed:", { code:error.code, message:error.message });
      setSyncStatus("Sync error");
    }
  );
}

function stopRecallTracker(){
  if(firestoreUnsubscribe){
    try { firestoreUnsubscribe(); } catch(error) { console.warn("Recall Tracker listener cleanup failed:", error); }
    firestoreUnsubscribe = null;
  }
  console.info("Recall Tracker cleanup complete.");
  trackerInitialized = false;
  stateLoaded = false;
  currentUserEmail = null;
  calendar.replaceChildren();
}

async function save(){
  if(!stateLoaded || !currentUserEmail) return;

  state.currentMonth = currentMonth;
  state.currentYear = currentYear;
  state.weeklyTasks = weeklyTasks;
  state.clientUpdatedAt = Date.now();
  persistLocalBackup();
  const stateToSave = JSON.parse(JSON.stringify(state));
  setSyncStatus("Saving…");

  try{
    await db.collection("recallTrackers").doc(SHARED_RECALL_DOC).set({
      state:stateToSave,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    if(state.clientUpdatedAt === stateToSave.clientUpdatedAt) setSyncStatus("Synced");
  }catch(err){
    console.error("Firestore save failed:", err);
    setSyncStatus("Offline — saved data");
  }
}

async function loadFromFirestore(user){
      currentUserEmail = user.email;
      document.getElementById("signInBtn").textContent = "Sign out";
      const localBackup = readLocalBackup();

      try{
        const sharedDoc = await withTimeout(
          db.collection("recallTrackers").doc(SHARED_RECALL_DOC).get(),
          12000,
          "Recall data took too long to load."
        );

if(sharedDoc.exists && sharedDoc.data().state){
  const remoteState = sharedDoc.data().state;
  const localVersion = Number(localBackup?.clientUpdatedAt) || 0;
  const remoteVersion = Number(remoteState.clientUpdatedAt) || 0;
  state = localVersion > remoteVersion ? localBackup : remoteState;
}else{
  // migration fallback: load old personal tracker once
  const oldDoc = await withTimeout(
    db.collection("recallTrackers").doc(currentUserEmail).get(),
    12000,
    "Recall data took too long to load."
  );

  if(oldDoc.exists && oldDoc.data().state){
    state = oldDoc.data().state;

    await withTimeout(db.collection("recallTrackers").doc(SHARED_RECALL_DOC).set({
      state,
      migratedFrom: currentUserEmail,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true }), 12000, "Recall data took too long to save.");
  }else{
    state = {};
  }
}

        const loadedLocalBackup = localBackup && state === localBackup;
        applyTrackerState(state);
        persistLocalBackup();
        if(loadedLocalBackup) save();

      }catch(err){
        console.error("Firestore load failed:", err);

        state = localBackup || {};

        applyTrackerState(state);
      }
}

function monthData(){
  state.months ||= {};
  state.months[key()] ||= {
    whole:false,
    days:{},
    weekly:{},
    customDayRows:{},
    customWeekRows:{},
    monthlyRows:["CEP"],
    hiddenMonthRows:{ weeks:{}, days:{} },
    hiddenWeekRows:{},
    tickCompletions:{},
    manualText:{},
    tickDefinitions:cloneTickDefinitionsForMonth(state.tickDefinitions, key())
  };

  state.months[key()].monthlyRows ||= ["CEP"];
  state.months[key()].customDayRows ||= {};
  state.months[key()].customWeekRows ||= {};
  state.months[key()].hiddenMonthRows ||= { weeks:{}, days:{} };
  state.months[key()].hiddenWeekRows ||= {};
  state.months[key()].tickCompletions ||= {};
  state.months[key()].manualText ||= {};
  if(!Array.isArray(state.months[key()].tickDefinitions)){
    state.months[key()].tickDefinitions = cloneTickDefinitionsForMonth(state.tickDefinitions, key());
  }

  return state.months[key()];
}

function currentTickDefinitions(){
  return monthData().tickDefinitions;
}

function recurrenceSummary(definition){
  if(definition.repeat === "daily") return "Every day";
  if(definition.repeat === "weekdays"){
    const selected = (definition.weekdays || []).map(index => days[index]).filter(Boolean);
    return selected.join(", ") || "No weekdays selected";
  }
  if(definition.repeat === "weekOfMonth"){
    const positionNames = { "1":"First", "2":"Second", "3":"Third", "4":"Fourth", last:"Last" };
    const positions = (definition.weekPositions || []).map(position => positionNames[position]).filter(Boolean);
    const selectedDays = (definition.weekdays || []).map(index => days[index]).filter(Boolean);
    return `${positions.join(" + ")} · ${selectedDays.join(", ")}`;
  }
  if(definition.repeat === "dates"){
    return (definition.dates || []).map(formatExactDate).join(", ") || "No dates selected";
  }
  const day = Number(definition.dayOfMonth) || 1;
  const suffix = day % 10 === 1 && day !== 11 ? "st" : day % 10 === 2 && day !== 12 ? "nd" : day % 10 === 3 && day !== 13 ? "rd" : "th";
  return `Monthly · ${day}${suffix}`;
}

function formatExactDate(isoDate){
  const [year, month, day] = String(isoDate).split("-").map(Number);
  if(!year || !month || !day) return isoDate;
  return new Intl.DateTimeFormat("en-NZ", { day:"numeric", month:"short", year:"numeric" })
    .format(new Date(year, month - 1, day));
}

function dateKeyForDay(dateNum){
  return `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(dateNum).padStart(2, "0")}`;
}

function definitionAppearsOn(definition, dateNum){
  if(definition.repeat === "daily") return true;
  if(definition.repeat === "weekdays"){
    const weekday = mondayIndex(new Date(currentYear, currentMonth, dateNum));
    return (definition.weekdays || []).includes(weekday);
  }
  if(definition.repeat === "weekOfMonth"){
    const date = new Date(currentYear, currentMonth, dateNum);
    const weekday = mondayIndex(date);
    if(!(definition.weekdays || []).includes(weekday)) return false;
    const ordinal = String(Math.floor((dateNum - 1) / 7) + 1);
    const isLast = dateNum + 7 > new Date(currentYear, currentMonth + 1, 0).getDate();
    return (definition.weekPositions || []).includes(ordinal) || (isLast && (definition.weekPositions || []).includes("last"));
  }
  if(definition.repeat === "dates") return (definition.dates || []).includes(dateKeyForDay(dateNum));
  return definition.repeat === "monthly" && Number(definition.dayOfMonth) === dateNum;
}

function saveTickDefinition(){
  const definitions = currentTickDefinitions();
  const name = document.getElementById("tickNameInput").value.trim();
  const repeat = document.querySelector('input[name="tickRepeat"]:checked')?.value || "daily";
  const weekdays = [...document.querySelectorAll(".weekday-choice input:checked")].map(input => Number(input.value));
  const weekPositions = [...document.querySelectorAll(".week-position-choice input:checked")].map(input => input.value);
  const dayOfMonth = Number(document.getElementById("monthDaySelect").value);
  const color = document.querySelector('input[name="tickColour"]:checked')?.value || "yellow";

  if(!name){
    document.getElementById("tickNameInput").focus();
    return;
  }
  if((repeat === "weekdays" || repeat === "weekOfMonth") && !weekdays.length){
    alert("Select at least one weekday.");
    return;
  }
  if(repeat === "weekOfMonth" && !weekPositions.length){
    alert("Select at least one week position.");
    return;
  }
  if(repeat === "dates" && !selectedSpecificDates.length){
    alert("Add at least one exact date.");
    return;
  }

  const duplicate = definitions.find(item => item.id !== editingTickId && item.name.toLowerCase() === name.toLowerCase());
  if(duplicate){
    alert("A tick with that name already exists.");
    return;
  }

  const definition = {
    id: editingTickId || makeTickId(),
    name,
    repeat,
    weekdays:repeat === "weekdays" || repeat === "weekOfMonth" ? weekdays : [],
    weekPositions:repeat === "weekOfMonth" ? weekPositions : [],
    dayOfMonth:repeat === "monthly" ? dayOfMonth : 1,
    dates:repeat === "dates" ? [...selectedSpecificDates] : [],
    color:tickColours.includes(color) ? color : "yellow"
  };
  const index = definitions.findIndex(item => item.id === editingTickId);
  if(index >= 0){
    const previous = definitions[index];
    if(previous.name !== name){
      const month = monthData();
      month.tickCompletions ||= {};
      Object.entries(month.days || {}).forEach(([day, values]) => {
        if(!(previous.name in values)) return;
        month.tickCompletions[day] ||= {};
        if(!(definition.id in month.tickCompletions[day])){
          month.tickCompletions[day][definition.id] = !!values[previous.name];
        }
      });
    }
    definitions[index] = definition;
  }
  else definitions.push(definition);

  hideTickForm();
  renderTickDefinitions();
  render();
  save();
}

function mondayIndex(date){
  return (date.getDay() + 6) % 7;
}

function weekRowForDate(dateNum){
  const firstOffset = mondayIndex(new Date(currentYear, currentMonth, 1));
  return Math.ceil((dateNum + firstOffset) / 7);
}

function render(){
  const data = monthData();

  title.textContent = `${monthNames[currentMonth]} ${currentYear}`;
  monthSelect.value = currentMonth;
  yearSelect.value = currentYear;
  wholeMonth.checked = !!data.whole;

  calendar.innerHTML = "";
  calendar.appendChild(headerCell("Weekly"));
  days.forEach(d => calendar.appendChild(headerCell(d)));

  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const firstOffset = mondayIndex(new Date(currentYear, currentMonth, 1));
  const totalCells = Math.ceil((firstOffset + daysInMonth) / 7) * 7;

  for(let week = 0; week < totalCells / 7; week++){
    calendar.appendChild(weeklyCell(week + 1));

    for(let dow = 0; dow < 7; dow++){
      const cellIndex = week * 7 + dow;
      const dateNum = cellIndex - firstOffset + 1;

      if(dateNum < 1 || dateNum > daysInMonth){
        const blank = document.createElement("div");
        blank.className = "cell day empty";
        calendar.appendChild(blank);
      }else{
        calendar.appendChild(dayCell(dateNum));
      }
    }
  }
}

function replaceInArray(arr, oldName, newName){
  return (arr || []).map(x => x === oldName ? newName : x);
}

function renameTick(rowName, dateNum, rowType){
  if(!editMode) return;

  const newName = prompt("Rename tick:", rowName);
  if(!newName) return;

  const cleanName = newName.trim();
  if(!cleanName || cleanName === rowName) return;

  const data = monthData();
  data.days ||= {};
  data.monthlyRows ||= ["CEP"];
  data.customDayRows ||= {};
  data.customWeekRows ||= {};
  data.hiddenMonthRows ||= { weeks:{}, days:{} };
  data.hiddenWeekRows ||= {};

  const moveTickValue = (dayNum) => {
    if(!data.days[dayNum]) return;

    if(rowName in data.days[dayNum]){
      data.days[dayNum][cleanName] = data.days[dayNum][cleanName] || data.days[dayNum][rowName];
      delete data.days[dayNum][rowName];
    }
  };

  if(rowType === "monthly" || rowType === "added-month"){
    data.monthlyRows = replaceInArray(data.monthlyRows, rowName, cleanName);

    Object.keys(data.days || {}).forEach(dayNum => {
      moveTickValue(dayNum);
    });

    Object.keys(data.hiddenMonthRows.weeks || {}).forEach(week => {
      data.hiddenMonthRows.weeks[week] = replaceInArray(data.hiddenMonthRows.weeks[week], rowName, cleanName);
    });

    Object.keys(data.hiddenMonthRows.days || {}).forEach(day => {
      data.hiddenMonthRows.days[day] = replaceInArray(data.hiddenMonthRows.days[day], rowName, cleanName);
    });
  }

  if(rowType === "week"){
    const week = weekRowForDate(dateNum);

    data.customWeekRows[week] = replaceInArray(data.customWeekRows[week], rowName, cleanName);

    Object.keys(data.days || {}).forEach(dayNum => {
      if(weekRowForDate(Number(dayNum)) === Number(week)){
        moveTickValue(dayNum);
      }
    });

    Object.keys(data.hiddenWeekRows || {}).forEach(day => {
      data.hiddenWeekRows[day] = replaceInArray(data.hiddenWeekRows[day], rowName, cleanName);
    });
  }

  if(rowType === "day"){
    data.customDayRows[dateNum] = replaceInArray(data.customDayRows[dateNum], rowName, cleanName);
    moveTickValue(dateNum);
  }

  save();
  render();
}

function rowElement(rowName, dateNum, rowType = "monthly"){
  const data = monthData();
  data.days[dateNum] ||= {};

  const row = document.createElement("div");
  row.className = `tick-row ${rowType}-tick`;
  row.innerHTML = `
    <input type="checkbox">
    <span>${rowName}</span>
    <button class="delete-mini" title="Delete">×</button>
  `;

  const cb = row.querySelector("input");
const label = row.querySelector("span");
const del = row.querySelector(".delete-mini");

label.title = "Click to rename in Edit mode";

label.onclick = () => {
  renameTick(rowName, dateNum, rowType);
};

  cb.checked = !!data.days[dateNum][rowName];

  cb.onchange = () => {
    data.days[dateNum][rowName] = cb.checked;
    save();
  };

  del.onclick = (e) => {
    e.stopPropagation();

    if(!confirm(`Remove "${rowName}" from day ${dateNum} only?`)) return;

    const data = monthData();
    data.customDayRows ||= {};
    data.customWeekRows ||= {};
    data.hiddenMonthRows ||= { weeks:{}, days:{} };
    data.hiddenWeekRows ||= {};

    // Monthly tick: hide from this day only
    if(rowType === "monthly" || rowType === "added-month"){
      data.hiddenMonthRows.days[dateNum] ||= [];

      if(!data.hiddenMonthRows.days[dateNum].includes(rowName)){
        data.hiddenMonthRows.days[dateNum].push(rowName);
      }

      if(data.days[dateNum]){
        delete data.days[dateNum][rowName];
      }
    }

    // Weekly tick: hide from this day only
    if(rowType === "week"){
      data.hiddenWeekRows[dateNum] ||= [];

      if(!data.hiddenWeekRows[dateNum].includes(rowName)){
        data.hiddenWeekRows[dateNum].push(rowName);
      }

      if(data.days[dateNum]){
        delete data.days[dateNum][rowName];
      }
    }

    // Daily tick: delete from this day only
    if(rowType === "day"){
      data.customDayRows[dateNum] =
        (data.customDayRows[dateNum] || []).filter(x => x !== rowName);

      if(data.days[dateNum]){
        delete data.days[dateNum][rowName];
      }
    }

    save();
    render();
  };

  return row;
}

function recurringRowElement(definition, dateNum){
  const data = monthData();
  data.tickCompletions[dateNum] ||= {};

  const row = document.createElement("div");
  row.className = `tick-row recurring-tick recurrence-${definition.repeat} tick-color-${definitionColour(definition)}`;
  const cb = document.createElement("input");
  cb.type = "checkbox";
  const label = document.createElement("span");
  label.textContent = definition.name;

  const legacyValue = data.days?.[dateNum]?.[definition.name];
  cb.checked = definition.id in data.tickCompletions[dateNum]
    ? !!data.tickCompletions[dateNum][definition.id]
    : !!legacyValue;

  cb.onchange = () => {
    data.tickCompletions[dateNum][definition.id] = cb.checked;
    save();
  };

  row.append(cb, label);
  return row;
}

function dayCell(dateNum){
  const data = monthData();
  const monthlyRows = data.monthlyRows || ["CEP"];
  const el = document.createElement("div");
  el.className = "cell day";

  const isToday =
    dateNum === today.getDate() &&
    currentMonth === today.getMonth() &&
    currentYear === today.getFullYear();

  if(isToday) el.classList.add("today-cell");

  const num = document.createElement("div");
  num.className = "day-num";
  num.textContent = dateNum;
  el.appendChild(num);

  const ticks = document.createElement("div");
  ticks.className = "ticks";

  const definitions = currentTickDefinitions();
  definitions
    .filter(definition => definitionAppearsOn(definition, dateNum))
    .forEach(definition => ticks.appendChild(recurringRowElement(definition, dateNum)));

  const weekRow = weekRowForDate(dateNum);
  data.hiddenWeekRows ||= {};
  const hiddenWeekRowsForDay = data.hiddenWeekRows?.[dateNum] || [];
  const weekRows = (data.customWeekRows?.[weekRow] || []).filter(name => !hiddenWeekRowsForDay.includes(name));
  const dayRows = data.customDayRows?.[dateNum] || [];

  data.hiddenMonthRows ||= { weeks:{}, days:{} };
  const hiddenForWeek = data.hiddenMonthRows.weeks?.[weekRow] || [];
  const hiddenForDay = data.hiddenMonthRows.days?.[dateNum] || [];
  const recurringNames = new Set(definitions.map(definition => definition.name.toLowerCase()));
  const visibleMonthlyRows = state.tickDefinitionsVersion >= 1 ? [] : monthlyRows.filter(name => {
    return !recurringNames.has(name.toLowerCase()) && !hiddenForWeek.includes(name) && !hiddenForDay.includes(name);
  });
  const allRows = [...visibleMonthlyRows, ...weekRows, ...dayRows];

  [...new Set(allRows)].forEach(rowName => {
    let rowType = "day";

    if(visibleMonthlyRows.includes(rowName)){
      rowType = rowName === "CEP" ? "monthly" : "added-month";
    }else if(weekRows.includes(rowName)){
      rowType = "week";
    }

    ticks.appendChild(rowElement(rowName, dateNum, rowType));
  });

  const manualEditor = manualTextElement(dateNum);
  el.appendChild(ticks);
  el.appendChild(manualEditor);
  el.addEventListener("click", event => {
    if(event.target !== el && event.target !== num && event.target !== ticks) return;
    manualEditor.focus();
    const selection = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(manualEditor);
    range.collapse(false);
    selection.removeAllRanges();
    selection.addRange(range);
  });
  return el;
}

async function startRecallTracker(user){
  if(trackerInitialized){
    console.info("Recall Tracker startup skipped: already started.");
    return;
  }
  console.info("Recall Tracker startup:", { projectId:firebaseConfig.projectId, email:user.email });
  currentUserEmail = user.email;
  document.getElementById("signInBtn").textContent = "Sign out";
  populateControls();
  ensureTickDefinitions();
  trackerInitialized = true;
  render();
  loadingView.hidden = true;
  loginScreen.hidden = true;
  trackerApp.hidden = false;
  startFirestoreSync();
  await loadFromFirestore(user);
  if(tickDefinitionsNeedSave){
    tickDefinitionsNeedSave = false;
    await save();
  }
  if(trackerInitialized) render();
}

function signInErrorMessage(error){
  if(error?.message === "Sign-in took too long."){
    return "Sign-in is taking too long. Please check the connection and try again.";
  }
  if(error?.code === "auth/network-request-failed"){
    return "Unable to connect. Check the internet connection and try again.";
  }
  if(error?.code === "auth/too-many-requests"){
    return "Too many login attempts. Please try again later.";
  }
  return "Invalid username or password.";
}

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  const username = usernameInput.value.trim().toLowerCase();
  const email = ALLOWED_USERS[username];
  const password = passwordInput.value;

  if(!email){
    loginStatus.textContent = "Invalid username or password.";
    return;
  }

  loginSubmit.disabled = true;
  loginSubmit.textContent = "Signing in…";
  loginStatus.textContent = "";
  try{
    await withTimeout(
      auth.signInWithEmailAndPassword(email, password),
      15000,
      "Sign-in took too long."
    );
  }catch(error){
    console.error("Recall Tracker sign-in failed:", error.code || error);
    loginStatus.textContent = signInErrorMessage(error);
  }finally{
    passwordInput.value = "";
    loginSubmit.disabled = false;
    loginSubmit.textContent = "Sign In";
  }
});

auth.onAuthStateChanged(async user => {
  console.info("Recall Tracker authentication state resolved:", {
    signedIn:Boolean(user),
    email:user?.email || null,
    authorised:String(user?.email || "").toLowerCase() === ALLOWED_EMAIL
  });
  if(!user){
    stopRecallTracker();
    usernameInput.value = "";
    passwordInput.value = "";
    showLogin(pendingAuthMessage);
    pendingAuthMessage = "";
    return;
  }

  if(String(user.email || "").toLowerCase() !== ALLOWED_EMAIL){
    pendingAuthMessage = "This account is not authorised to access Recall Tracker.";
    stopRecallTracker();
    await auth.signOut();
    return;
  }

  try{
    await startRecallTracker(user);
  }catch(error){
    console.error("Recall Tracker authentication state failed:", error);
    pendingAuthMessage = "Unable to connect. Check the internet connection and try again.";
    stopRecallTracker();
    await auth.signOut();
  }
});
</script>
