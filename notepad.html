<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeefe">
  <title>·</title>
  <link rel="stylesheet" href="notepad.css?v=20260916-7">
</head>
<body>
  <main>
    <div class="pad-controls" aria-label="Notepad controls">
      <button id="addNote" class="dot dot-add" type="button" aria-label="Add another note" title="Add note"></button>
      <span class="dot dot-yellow" aria-hidden="true"></span>
      <span class="dot dot-purple" aria-hidden="true"></span>
    </div>
    <div class="pad-open-options" aria-label="Open notepad elsewhere">
      <button id="openOptions" class="open-options-icon" type="button" aria-label="Open notepad elsewhere" aria-expanded="false" aria-controls="openOptionsMenu" title="Open in a new tab or window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
      <div id="openOptionsMenu" class="open-options-menu" hidden>
      <button id="openOnHomepage" type="button" aria-label="Open on homepage" title="Open on homepage">Homepage</button>
      <button id="openNewTab" type="button" aria-label="Open in new tab" title="Open in new tab">New tab</button>
      <button id="openNewWindow" type="button" aria-label="Open in new window" title="Open in new window">New window</button>
      </div>
    </div>
    <p id="openStatus" class="open-status" role="alert" hidden></p>
    <div id="notes" class="notes" aria-live="polite"></div>
  </main>
  <script src="notepad.js?v=20260916-9"></script>
</body>
</html>
