<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <script src="auth-guard.js?v=20260823-8"></script>
  <script src="security.js?v=20260805-4"></script>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="header-rays.css?v=23">
  <title>Notes</title>
<style>
@font-face {
  font-family: 'hellohon';
  src: url('hellohon.otf') format('opentype');
}

body {
  font-family: Arial, sans-serif;
  background: #EBE8E9;
  margin: 0;
  padding: 20px;
  font-size: 8pt;
  color: #000;
  text-align: center;
}

h1 {
  font-family: 'hellohon', cursive;
  font-size: 90px;
  font-weight: normal;
  color: black;

  text-shadow:
    0 0 4px rgba(255, 255, 255, 0.6),
    0 0 8px rgba(193, 182, 163, 0.4),
    0 0 12px rgba(255, 255, 255, 0.4);

  display: inline-block;
  margin: 3px auto 15px auto;
}

.header-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: 10px;
}

.header-container h1 {
  margin: 0;
  font-family: 'hellohon', cursive;
  font-size: 95px;
  font-weight: normal;
  color: black;

  text-shadow:
    0 0 4px rgba(255, 255, 255, 0.6),
    0 0 8px rgba(193, 182, 163, 0.4),
    0 0 12px rgba(255, 255, 255, 0.4);

  white-space: nowrap;
  flex-shrink: 0;
}

.header-bar {
  display: flex;
  align-items: center;
  gap: 15px;
}

.header-bar > div:first-child {
  font-size: 12px;
  font-weight: 600;
}

#searchInput {
  padding: 6px;
  font-size: 14px;
  width: 180px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(6px);
  color: black;
  outline: none;
  transition: box-shadow 0.3s ease;
}

#searchInput:focus {
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
}

#addNoteBtn {
  padding: 6px 12px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(6px);
  color: black;
  cursor: pointer;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

#addNoteBtn:hover {
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
}

/* --- Grid/Masonry Fix --- */
.note-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  grid-auto-rows: 30px;   /* was 10px, now taller base row */
  grid-auto-flow: dense;
  gap: 12px;
  margin-top: 5px;
  padding: 5px;
}


.note-tile {
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 10px;
  padding: 12px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);

  display: flex;
  flex-direction: column;

  min-width: 0;
  box-sizing: border-box;

  transition: box-shadow 0.3s ease-in-out;
  cursor: pointer;
  overflow: hidden;
  position: relative;
}


.note-tile textarea {
  display: none;

  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;

  border: none;
  resize: none;

  font-size: 9pt;
  padding: 8px;
  font-family: Arial, sans-serif;

  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(6px);
  border-radius: 6px;

  color: black;

  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: pre-wrap;

  overflow: hidden;
  pointer-events: none;
}

.note-display {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  box-sizing: border-box;

  border: none;
  font-size: 9pt;
  padding: 8px;
  font-family: Arial, sans-serif;

  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(6px);
  border-radius: 6px;

  color: black;

  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;

  text-align: left;
  min-height: 32px;
  overflow: hidden;
}

.search-highlight {
  background: rgba(254, 255, 163, 0.55);
  color: #111;
  border-radius: 4px;
  padding: 0 0.3mm;
  font-weight: normal;

  box-shadow:
    0 0 4px rgba(255, 255, 255, 0.9),
    0 0 8px rgba(254, 255, 163, 0.75),
    0 0 14px rgba(254, 255, 163, 0.55);
}

/* Zoom effect */
.note-tile.zoomed {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
}

/* -------------------------
   CARD CONTROL BUTTON
------------------------- */

.note-tile {
  padding-bottom: 42px;
}

/* Small light button bottom-right */
.note-menu-toggle {
  position: absolute;
  right: 10px;
  bottom: 10px;

  width: 10px;
  height: 10px;

  padding: 0;
  border: none;
  border-radius: 50%;

  background: rgba(255, 255, 255, 0.72);

  box-shadow:
    0 0 4px rgba(255, 255, 255, 0.95),
    0 0 8px rgba(255, 255, 255, 0.55);

  cursor: pointer;
  z-index: 5;

  transition:
    transform 0.2s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}

.note-menu-toggle:hover {
  background: rgba(255, 255, 255, 0.95);

  box-shadow:
    0 0 6px rgba(255, 255, 255, 1),
    0 0 12px rgba(255, 255, 255, 0.8);

  transform: scale(1.08);
}

.note-menu-toggle:active {
  transform: scale(0.95);
}


/* Hidden controls */
.note-controls {
  position: absolute;

  right: 10px;
  bottom: 36px;

  display: none;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;

  padding: 8px;

  background: rgba(255, 255, 255, 0.38);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 10px;

  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);

  z-index: 4;
}

.note-tile.menu-open {
  padding-bottom: 105px;
}

.note-tile.menu-open .note-controls {
  display: flex;
}


/* Edit / Save / Cancel / Delete */
.note-action-row {
  display: flex;
  gap: 5px;
}

.note-action-row button {
  padding: 4px 8px;

  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 6px;

  background: rgba(255, 255, 255, 0.42);

  font-size: 10px;
  color: #111;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.note-action-row button:hover {
  background: rgba(255, 255, 255, 0.7);
  transform: translateY(-1px);
}


/* Card colour choices */
.edit-bar {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin: 0;
}

.color-btn {
  width: 16px;
  height: 16px;

  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 50%;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.color-btn:hover {
  transform: scale(1.15);
  box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
}

.color1 { background: #9E8993; }
.color2 { background: #AD9FA6; }
.color3 { background: #C0B7BB; }
.color4 { background: #D5D0D3; }

.note-date {
  font-size: 10px;
  color: #777 !important;
  opacity: 1 !important;
  text-align: right;
  margin-top: 4px;
}
</style>

  <link rel="stylesheet" href="site-background.css?v=20260730">
  <script src="page-theme.js?v=1"></script>
</head>
<body>
  <div class="header-container">
  <h1>Notes</h1>

  <div class="header-bar">
    <div>
      <input type="text" id="searchInput" placeholder="Search...">
      <button id="addNoteBtn">+ Add</button>
    </div>
  </div>
</div>

<div class="note-grid" id="noteGrid"></div>
<script type="module">
import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, query, orderBy,
  onSnapshot, doc, updateDoc, deleteDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Avoid an unauthenticated Firestore request and retry on page load.
await window.CEP_AUTH_READY;

const firebaseConfig = {
  apiKey: "AIzaSyAgYsVQNEOyQa41NkXXT2VuKClqXAxfG1Q",
  authDomain: "cepx-f9d2a.firebaseapp.com",
  databaseURL: "https://cepx-f9d2a-default-rtdb.firebaseio.com",
  projectId: "cepx-f9d2a",
    storageBucket: "cepx-f9d2a.firebasestorage.app",
  messagingSenderId: "840696526325",
  appId: "1:840696526325:web:b9bcb4669fbfad066a1cbc"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);
const notesRef = collection(db, "notebookNotes");

// Auto-resize textarea
function autoResize(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
}

// Render all notes
let allNotes = []; // global store of notes for search filtering

function renderNotes(filter = "") {
  const grid = document.getElementById("noteGrid");
  const q = query(notesRef, orderBy("date", "desc"));

  onSnapshot(q, snapshot => {
    allNotes = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
    displayNotes(allNotes, filter);
  });
}

function escapeHTML(text) {
  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeRegExp(text) {
  return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function highlightSearchText(text, filter) {
  const safeText = escapeHTML(text || "");

  if (!filter.trim()) return safeText;

  const pattern = new RegExp(`(${escapeRegExp(filter.trim())})`, "gi");

  return safeText.replace(pattern, `<span class="search-highlight">$1</span>`);
}

function displayNotes(notesArray, filter = "") {
  const grid = document.getElementById("noteGrid");
  grid.innerHTML = "";

  const filtered = notesArray.filter(note => (note.text || "").toLowerCase().includes(filter.toLowerCase()));

  filtered.forEach(note => {
    const tile = document.createElement("div");
    tile.className = "note-tile";
    tile.dataset.id = note.id;
    tile.style.background = note.color || "#C0B7BB";

    // DISPLAY TEXT WITH SEARCH HIGHLIGHT
const displayText = document.createElement("div");
displayText.className = "note-display";
displayText.innerHTML = highlightSearchText(note.text || "", filter);

// TEXTAREA FOR EDITING
const textarea = document.createElement("textarea");
textarea.value = note.text || "";
textarea.setAttribute("readonly", true);
textarea.style.pointerEvents = "none";
textarea.style.overflow = "hidden";
textarea.style.resize = "none";
textarea.style.display = "none";
    

    // DATE
    const dateElem = document.createElement("div");
    dateElem.className = "note-date";
    const noteDate = note.date?.toDate ? note.date.toDate() : new Date(note.date);
    dateElem.innerText = noteDate.toLocaleString('en-GB', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false
    });

   // -------------------------
// CARD CONTROLS
// -------------------------

const controls = document.createElement("div");
controls.className = "note-controls";


// ACTION ROW
const actionRow = document.createElement("div");
actionRow.className = "note-action-row";


// EDIT
const editButton = document.createElement("button");
editButton.innerText = "Edit";


// SAVE
const saveButton = document.createElement("button");
saveButton.innerText = "Save";
saveButton.style.display = "none";


// CANCEL
const cancelButton = document.createElement("button");
cancelButton.innerText = "Cancel";
cancelButton.style.display = "none";


// DELETE
const deleteButton = document.createElement("button");
deleteButton.innerText = "Delete";


// EDIT ACTION
editButton.onclick = e => {
  e.stopPropagation();

  tile.classList.add("editing");

  displayText.style.display = "none";
  textarea.style.display = "block";

  textarea.value = note.text || "";

  textarea.removeAttribute("readonly");
  textarea.style.pointerEvents = "auto";

  editButton.style.display = "none";
  deleteButton.style.display = "none";

  saveButton.style.display = "";
  cancelButton.style.display = "";

  textarea.focus();

  autoResize(textarea);
  resizeTiles();
};


// SAVE ACTION
saveButton.onclick = async e => {
  e.stopPropagation();

  try {
    const newText = textarea.value;

    await updateDoc(
      doc(notesRef, note.id),
      { text: newText }
    );

    note.text = newText;

    textarea.setAttribute("readonly", true);
    textarea.style.pointerEvents = "none";
    textarea.style.display = "none";

    displayText.innerHTML = highlightSearchText(
      newText,
      document.getElementById("searchInput").value
    );

    displayText.style.display = "block";

    tile.classList.remove("editing");
    tile.classList.remove("menu-open");

    editButton.style.display = "";
    deleteButton.style.display = "";

    saveButton.style.display = "none";
    cancelButton.style.display = "none";

    autoResize(textarea);
    resizeTiles();

  } catch (err) {
    console.error("Failed to save note:", err);
  }
};


// CANCEL ACTION
cancelButton.onclick = e => {
  e.stopPropagation();

  textarea.value = note.text || "";

  textarea.setAttribute("readonly", true);
  textarea.style.pointerEvents = "none";
  textarea.style.display = "none";

  displayText.style.display = "block";

  tile.classList.remove("editing");
  tile.classList.remove("menu-open");

  editButton.style.display = "";
  deleteButton.style.display = "";

  saveButton.style.display = "none";
  cancelButton.style.display = "none";

  autoResize(textarea);
  resizeTiles();
};


// DELETE ACTION
deleteButton.onclick = async e => {
  e.stopPropagation();

  await deleteDoc(
    doc(notesRef, note.id)
  );
};


// ADD ACTION BUTTONS
actionRow.appendChild(editButton);
actionRow.appendChild(saveButton);
actionRow.appendChild(cancelButton);
actionRow.appendChild(deleteButton);

controls.appendChild(actionRow);


// -------------------------
// COLOUR OPTIONS
// -------------------------

const editBar = document.createElement("div");
editBar.className = "edit-bar";

["color1", "color2", "color3", "color4"].forEach(cls => {

  const btn = document.createElement("button");

  btn.className = `color-btn ${cls}`;

  btn.onclick = async e => {
  e.stopPropagation();

  const bg = window.getComputedStyle(btn).backgroundColor;

  // If currently editing, preserve whatever has been typed
  const currentText = tile.classList.contains("editing")
    ? textarea.value
    : note.text || "";

  tile.style.background = bg;

  try {
    await updateDoc(
      doc(notesRef, note.id),
      {
        color: bg,
        text: currentText
      }
    );

    // Keep local copy in sync
    note.color = bg;
    note.text = currentText;

  } catch (err) {
    console.error("Failed to update note:", err);
  }
};

  editBar.appendChild(btn);
});

controls.appendChild(editBar);


// -------------------------
// LIGHT BUTTON
// -------------------------

const menuToggle =
  document.createElement("button");

menuToggle.className = "note-menu-toggle";

menuToggle.setAttribute(
  "aria-label",
  "Note options"
);

menuToggle.onclick = e => {
  e.stopPropagation();

  const opening =
    !tile.classList.contains("menu-open");

  // Close other cards
  document
    .querySelectorAll(".note-tile.menu-open")
    .forEach(otherTile => {

      if (otherTile !== tile) {
        otherTile.classList.remove("menu-open");
      }

    });

  tile.classList.toggle(
    "menu-open",
    opening
  );

  resizeTiles();
};

    // ASSEMBLE TILE
    tile.appendChild(displayText);
tile.appendChild(textarea);
tile.appendChild(dateElem);

tile.appendChild(controls);
tile.appendChild(menuToggle);

grid.appendChild(tile);

    // Resize after appending
    requestAnimationFrame(() => {
      autoResize(textarea);
      resizeTiles();
    });

    // Auto-resize while typing
    textarea.addEventListener("input", () => {
      autoResize(textarea);
      resizeTiles();
    });
  });

  enableTileClickZoom();
}

// Search listener
document.getElementById("searchInput")?.addEventListener("input", e => {
  const filter = e.target.value;
  displayNotes(allNotes, filter);
});

// Zoom on click
function enableTileClickZoom() {
  document.querySelectorAll('.note-tile').forEach(tile => {
    tile.onclick = e => {

      if (
        e.target.closest("button") ||
        e.target.closest("textarea") ||
        e.target.closest(".note-controls")
      ) {
        return;
      }

      const isZoomed = tile.classList.contains("zoomed");

      document
        .querySelectorAll(".note-tile.zoomed")
        .forEach(t => {
          if (t !== tile) {
            t.classList.remove("zoomed");
          }
        });

      if (!isZoomed) {
        tile.classList.add("zoomed");
      } else {
        tile.classList.remove("zoomed");
      }
    };
  });
}

// Add new note
document.getElementById("addNoteBtn").addEventListener("click", async () => {
  const newNote = {
    text: "",
    color: "#C0B7BB",
    date: serverTimestamp()
  };
  await addDoc(notesRef, newNote);
});

// Masonry grid recalculation
function resizeTiles() {
  const grid = document.getElementById("noteGrid");
  const rowHeight = parseInt(window.getComputedStyle(grid).getPropertyValue('grid-auto-rows'));
  const rowGap = parseInt(window.getComputedStyle(grid).getPropertyValue('gap'));

  grid.querySelectorAll('.note-tile').forEach(tile => {
    const display = tile.querySelector('.note-display');
const textarea = tile.querySelector('textarea');

const mainHeight =
  textarea.style.display === "block"
    ? textarea.scrollHeight
    : display.scrollHeight;

const extraSpace =
  tile.classList.contains("menu-open") ? 110 : 46;

const contentHeight =
  mainHeight +
  tile.querySelector('.note-date').offsetHeight +
  extraSpace;

    const rowSpan = Math.ceil((contentHeight + rowGap) / (rowHeight + rowGap));
    tile.style.gridRowEnd = `span ${rowSpan}`;
  });
}

// Recalculate on window resize
window.addEventListener('resize', () => {
  document.querySelectorAll('.note-tile textarea').forEach(t => autoResize(t));
  resizeTiles();
});

// Initial render
renderNotes();
</script>
  <script src="header-rays.js?v=17"></script>
</body>
</html>
