<!DOCTYPE html>
<html lang="en" class="theme-homecal">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
  <script src="auth-guard.js?v=20260823-8"></script>
  <script src="security.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar and To-Do Page</title>
  
<style>

	:root {
  color-scheme: light only;
}

html,
body {
  color-scheme: light only;
}
	
@font-face {
  font-family: 'hellohon';
  src: url('hellohon.otf') format('opentype');
}

body {
  --todo-width: 350px;
  margin: 0;
  font-family: Tahoma, sans-serif;
  font-size: 10pt;
  height: 100vh;
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  overflow-y: auto;
  background: url('site-background.webp') center center / cover no-repeat fixed;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}


.calendar,
.calendar * {
  font-family: Tahoma, sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Shared glass container styling (BOTH) */
.calendar-container,
.todo-container {
  position: relative;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(12px) saturate(120%);
  -webkit-backdrop-filter: blur(12px) saturate(120%);
  border: 1px solid rgba(255, 255, 255, 0.25);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
  transition: box-shadow 0.3s ease;
  overflow: hidden;
  min-width: 0; /* flex overflow safety */
}

/* Calendar (left) */
.calendar-container {
  flex: 1 1 auto;
  padding: 8px;
  max-height: 100vh;
  border-radius: 12px 0 0 12px;

  display: flex;
  flex-direction: column;

  overflow: hidden;
}

.calendar-scroll-glass {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;

  margin-top: -10px;
  padding: 10px;
  border-radius: 18px;

  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.24);

  backdrop-filter: blur(14px) saturate(135%);
  -webkit-backdrop-filter: blur(14px) saturate(135%);

  box-shadow:
    inset 0 0 18px rgba(255, 255, 255, 0.18),
    0 8px 24px rgba(0, 0, 0, 0.06);
}

/* Background blur layers */
.calendar-container::before,
.todo-container::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('2b1ß.png') no-repeat;
  background-size: cover;
  filter: blur(10px);
  transform: scale(1.05);
  z-index: -1;
  pointer-events: none;
}

.calendar-container::before { background-position: left top; }

/* Todo (right) — IMPORTANT: do NOT combine this with calendar styles */
.todo-container {
  flex: 0 0 var(--todo-width);
  width: var(--todo-width);
  max-width: none;
  min-width: 0;
  padding: 3px;
  border-radius: 0 12px 12px 0;
  white-space: normal;
  max-height: 100vh;

  display: flex;          /* ADD */
  flex-direction: column; /* ADD */
}

.todo-resizer {
  position: relative;
  z-index: 10;
  flex: 0 0 10px;
  width: 10px;
  margin: 0 -5px;
  cursor: col-resize;
  touch-action: none;
  outline: none;
}

.todo-resizer::after {
  content: "";
  position: absolute;
  top: 12px;
  bottom: 12px;
  left: 4px;
  width: 2px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.42);
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.16);
  transition: width .15s ease, left .15s ease, background .15s ease;
}

.todo-resizer:hover::after,
.todo-resizer:focus-visible::after,
body.todo-resizing .todo-resizer::after {
  left: 3px;
  width: 4px;
  background: rgba(255, 255, 255, 0.78);
}

body.todo-resizing {
  cursor: col-resize;
  user-select: none;
}

body.todo-collapsed .todo-container {
  flex-basis: 0;
  width: 0;
  padding-left: 0;
  padding-right: 0;
  border-width: 0;
  overflow: hidden;
}

body.todo-collapsed .todo-container > * {
  visibility: hidden;
}

.todo-container::before { background-position: right top; }

.calendar-container:hover,
.todo-container:hover {
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18),
              0 0 10px rgba(255, 255, 255, 0.35);
}

.todo-title {
  font-size: 60px;
  text-align: center;
  margin-bottom: 10px;
  font-family: 'hellohon', cursive;
  font-weight: 400;
  color: black;
}

/* Scroll area ONLY (no big glass box) */
.todo-list {
  width: 100%;
  box-sizing: border-box;

  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;

  /* remove the big container look */
  background: transparent;
  border: none;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;

  /* spacing for items */
  padding: 12px 6px 6px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.delete-tag {
  all: unset;
  position: absolute;
  top: 50%;
  right: 8px;
  z-index: 3;
  display: none;
  font: 20px/1 "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
  cursor: pointer;
  opacity: 1;
  transform: translateY(-50%) scale(1.05);
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.42));
}

.todo-item.delete-confirming .delete-tag {
  display: block;
}

.todo-item.delete-confirming textarea {
  padding-right: 30px;
}

.todo-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;               /* slightly tighter */
  padding: 6px 8px;       /* less padding = more usable space */

  width: 100%;
  box-sizing: border-box;

  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.30);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  border-radius: 12px;
}

.todo-item.priority {
  border: 3px solid rgba(255, 255, 255, 0.72);
  background: linear-gradient(
    135deg,
    rgba(255, 226, 238, 0.78),
    rgba(225, 240, 255, 0.76),
    rgba(255, 249, 205, 0.72)
  );
  box-shadow: none;
}

.todo-item.priority::before {
  content: "";
  position: absolute;
  inset: -1px;
  border: 3px solid rgba(255, 255, 255, 0.72);
  border-radius: inherit;
  pointer-events: none;
  z-index: 2;
  animation: priorityBorderRun 1.6s steps(1, end) infinite;
}

@keyframes priorityBorderRun {
  0%   { border-color: #ffff00 rgba(255,255,255,.72) rgba(255,255,255,.72) rgba(255,255,255,.72); }
  25%  { border-color: rgba(255,255,255,.72) #ffff00 rgba(255,255,255,.72) rgba(255,255,255,.72); }
  50%  { border-color: rgba(255,255,255,.72) rgba(255,255,255,.72) #ffff00 rgba(255,255,255,.72); }
  75%  { border-color: rgba(255,255,255,.72) rgba(255,255,255,.72) rgba(255,255,255,.72) #ffff00; }
}

@media (prefers-reduced-motion: reduce) {
  .todo-item.priority::before {
    animation: none;
    border-color: #ffff00;
  }
}

.todo-item:hover {
  box-shadow:
    inset 0 0 6px rgba(255,255,255,0.2),
    0 2px 6px rgba(0,0,0,0.05);
}


.todo-item textarea {
  font-family: Tahoma, sans-serif;
  color: #000;
  opacity: 1;
  min-height: 0;
}

/* keep readOnly looking normal */
.todo-item textarea[readonly] {
  cursor: default;
}

/* optional: show subtle focus when editing */
.todo-item textarea:not([readonly]):focus {
  outline: none;
  box-shadow: 0 0 6px rgba(255,255,255,0.6);
}

.todo-item input[type="text"],
.todo-item textarea {
  flex: 1 1 0;
  min-width: 0;

  padding: 2px 4px;   /* tighter */
  margin: 0;

  border: none;
  background: transparent;

  font-family: Tahoma, sans-serif;
  font-size: 10pt;
  line-height: 1.4;

  resize: none;
  overflow-y: hidden;

  box-sizing: border-box;
}

.todo-item { width: 100%; box-sizing: border-box; }

.todo-item > div:last-child {
  flex: 0 0 auto;
}

.todo-item input[type="checkbox"] {
  margin-right: 10px;
  width: 20px;
  height: 20px;
  accent-color: #ffe700;
}


.add-todo {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.add-todo input {
  flex: 1;
  padding: 8px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px 0 0 8px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: black;
}

.add-todo button {
  padding: 8px;
  border: none;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  cursor: pointer;
  border-radius: 0 8px 8px 0;
  color: #333;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

.add-todo button:hover {
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 8px rgba(170, 200, 255, 0.4);
}

button,
.add-todo button,
.home-button,
.emoji-button,
.calendar-header > div > button {
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  color: black;
  cursor: pointer;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  padding: 6px 12px;
  font-size: 10pt;
}


button:hover,
.add-todo button:hover,
.home-button:hover,
.emoji-button:hover,
.calendar-header > div > button:hover {
  background: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
}

.calendar-header {
 position: relative;
  top: auto;
  z-index: 30;

  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;

  margin: 0 auto 2px auto;
  padding: 10px 16px;

  width: calc(100% - 24px);
  box-sizing: border-box;

  border-radius: 999px;

  /* white / transparent liquid glass */
  background:
    radial-gradient(
      circle at 28% 16%,
      rgba(255, 255, 255, 0.52),
      rgba(255, 255, 255, 0.16) 24%,
      rgba(255, 255, 255, 0.055) 58%,
      rgba(255, 255, 255, 0.025) 100%
    );

  /* blur the background underneath */
  backdrop-filter: blur(42px) saturate(230%) contrast(108%) brightness(112%);
  -webkit-backdrop-filter: blur(42px) saturate(230%) contrast(108%) brightness(112%);

  border: 1px solid rgba(255, 255, 255, 0.36);

  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.80),
    inset 0 -1px 1px rgba(255, 255, 255, 0.18),
    inset 0 -16px 24px rgba(255, 255, 255, 0.06),
    0 8px 22px rgba(0, 0, 0, 0.06),
    0 0 18px rgba(255, 255, 255, 0.16);

  overflow: hidden;
  isolation: isolate;
}

/* soft white liquid reflection */
.calendar-header::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 18px;
  right: 18px;
  height: 45%;
  border-radius: 999px;
  pointer-events: none;

  background:
    linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.60),
      rgba(255, 255, 255, 0.14),
      transparent
    );

  filter: blur(1px);
  opacity: 0.65;
}

/* thin shiny rim */
.calendar-header::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  pointer-events: none;

  background:
    linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.60),
      transparent 24%,
      transparent 72%,
      rgba(255, 255, 255, 0.22)
    );

  opacity: 0.72;
  mix-blend-mode: screen;
}

.calendar-header > * {
  position: relative;
  z-index: 1;
}

.calendar-header button:hover,
.calendar-header select:hover {
  background:
    linear-gradient(
      145deg,
      rgba(255, 255, 255, 0.12),
      rgba(255, 255, 255, 0.025)
    ) !important;

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.58),
    0 0 12px rgba(255, 255, 255, 0.18) !important;
}

.calendar-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.calendar-header button,
.calendar-header select {
  background: rgba(255, 255, 255, 0.08) !important;

  backdrop-filter: blur(24px) saturate(210%) brightness(112%) !important;
  -webkit-backdrop-filter: blur(24px) saturate(210%) brightness(112%) !important;

  border: 1px solid rgba(255, 255, 255, 0.26) !important;
  border-radius: 999px !important;

  color: rgba(0, 0, 0, 0.76) !important;

  text-shadow:
    0 1px 0 rgba(255, 255, 255, 0.40);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1px 0 rgba(255, 255, 255, 0.12),
    0 2px 8px rgba(0, 0, 0, 0.035) !important;
}

.calendar-header button:hover,
.calendar-header select:hover {
  background: rgba(255, 255, 255, 0.16) !important;
}


.calendar-header > div:last-child {
  display: flex;
  align-items: center;
  gap: 5px;

  padding: 5px;
  border-radius: 999px;

  background: rgba(255, 255, 255, 0.035);

  backdrop-filter: blur(28px) saturate(220%) contrast(115%);
  -webkit-backdrop-filter: blur(28px) saturate(220%) contrast(115%);

  border: 1px solid rgba(255, 255, 255, 0.18);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -1px 0 rgba(255, 255, 255, 0.08),
    0 8px 20px rgba(0, 0, 0, 0.06);

  overflow: hidden;
}

#monthLabel {
  font-family: 'hellohon', cursive, sans-serif;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.85);
}

.calendar-header select {
  padding: 6px 12px;
  font-size: 10pt;
  border-radius: 8px;
  color: black;
  cursor: pointer;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
  -webkit-appearance: none;
  appearance: none;
}

.calendar-header h2#monthLabel {
  font-size: 50pt;
  margin: 0;

  color: rgba(0, 0, 0, 0.80);
  font-family: 'hellohon', cursive, sans-serif;
  font-weight: 500;

  text-shadow:
    0.2px 0 rgba(0, 0, 0, 0.25),
    0 1px 0 rgba(255, 255, 255, 0.45),
    0 0 8px rgba(255, 255, 255, 0.20);
}

.calendar-header button:hover,
.calendar-header select:hover {
  background: rgba(255, 255, 255, 0.08) !important;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.55),
    0 0 10px rgba(255, 255, 255, 0.22) !important;
}

.home-button {
  padding: 4px 8px;
  background-color: #ddd3d2;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 8pt;
  color: white;
}

.day-headers {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-top: 10px;
  font-weight: bold;
  text-align: center;
  color: black;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  margin-top: 5px;
}
.todo-item.done {
  opacity: 1;
}

.todo-item.done textarea {
  opacity: 0.45;
  text-decoration: line-through;
  pointer-events: none;
  user-select: none;
}

.todo-item.done input[type="checkbox"] {
  opacity: 0.55;
}

.day {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 12px;
  padding: 6px;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  box-shadow:
    inset 0 0 8px rgba(255, 255, 255, 0.2),
    0 3px 6px rgba(0, 0, 0, 0.08);
  position: relative;
  overflow: hidden;
  will-change: transform, box-shadow;
}

.day:hover {
  box-shadow:
    inset 0 0 8px rgba(255, 255, 255, 0.2),
    0 3px 6px rgba(0, 0, 0, 0.08);
  transform: none;
  transition: none;
}

.day.empty {
  background: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: none !important;
  border: none !important;
  padding: 0 !important;
  min-height: 0 !important;
  pointer-events: none;
}

.day textarea {
  width: 100%;
  min-height: 110px;
  max-height: 600px;
  height: auto;
  resize: none;
  overflow-y: hidden;
  border-radius: 8px;
  padding: 4px;
  font-family: 'champ', sans-serif;
  font-size: 9.5pt;
  box-sizing: border-box;
  transition: height 0.2s ease;
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.day .date-number {
  font-weight: bold;
  color: black;
  margin-bottom: 5px;
  font-size: 10pt;
  cursor: pointer;
  user-select: none;
}

.day-note-editor {
  width: 100%;
  min-height: 1.35em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  outline: none;
  color: #000;
  font-family: 'champ', sans-serif;
  font-size: 9.5pt;
  line-height: normal;
}

.day-note-tick {
  display: inline;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: #111;
  font: inherit;
  line-height: inherit;
  cursor: pointer;
}

.day-note-tick.checked {
  color: #9D00FF !important;
  -webkit-text-fill-color: #9D00FF !important;
  -webkit-text-stroke: 1px #000;
  text-shadow:
    -1px 0 0 #000,
    1px 0 0 #000,
    0 -1px 0 #000,
    0 1px 0 #000;
  paint-order: stroke fill;
  font-family: Arial, sans-serif;
  font-weight: bold;
}

.day.today {
  transform: none;
  z-index: 2;

  border: 2px solid rgba(255, 255, 255, 0.95);

  background:
    radial-gradient(
      circle at top left,
      rgba(255, 255, 255, 0.95),
      rgba(255, 246, 215, 0.62) 35%,
      rgba(218, 242, 255, 0.48) 70%,
      rgba(255, 255, 255, 0.38) 100%
    );

  box-shadow:
    inset 0 0 18px rgba(255, 255, 255, 0.65),
    0 0 18px rgba(255, 255, 255, 0.95),
    0 0 32px rgba(255, 240, 190, 0.55),
    0 0 42px rgba(190, 230, 255, 0.55);

  backdrop-filter: blur(10px) saturate(145%);
  -webkit-backdrop-filter: blur(10px) saturate(145%);
}

.day.today .date-number {
  color: #000;
  text-shadow:
    0 0 6px rgba(255, 255, 255, 0.9),
    0 0 12px rgba(255, 245, 200, 0.7);
}

.day textarea:focus {
  outline: none;
  box-shadow: 0 0 6px rgba(180, 220, 255, 0.8);
  background: rgba(255, 255, 255, 0.4);
}

.day.has-note {
  box-shadow:
    inset 0 0 10px rgba(255, 255, 255, 0.28),
    0 0 12px rgba(255, 255, 255, 0.35),
    0 0 20px rgba(220, 230, 255, 0.26);
}

.day.has-note .date-number::after {
  content: " ✦";
  font-size: 8pt;
  opacity: 0.65;
}

@media (max-width: 600px) {
  html,
body {
  width: 100%;
  min-width: 0;
  height: 100dvh;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

 body {
  flex-wrap: nowrap;
  align-items: stretch;
  min-width: max-content;
  height: 100dvh;
}

  .calendar-container {
  flex: 0 0 auto;
  width: 980px;
  max-width: none !important;
  min-width: 980px;
  border-radius: 12px 0 0 12px !important;
  height: 100dvh;
  max-height: 100dvh;
  overflow-y: auto;
}

  .todo-container {
  flex: 0 0 var(--todo-width);
  width: var(--todo-width);
  max-width: none !important;
  min-width: 0;
  border-radius: 0 12px 12px 0 !important;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
}
.todo-list,
.calendar-container {
  -webkit-overflow-scrolling: touch;
}


  .calendar {
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    gap: 8px;
    min-width: 938px;
  }

  .day-headers {
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    gap: 8px;
    min-width: 938px;
    font-size: 9pt;
  }

  .day {
    min-height: 140px;
    padding: 6px;
    font-size: 9pt;
  }

  .day textarea {
    font-size: 9pt;
    min-height: 70px;
  }

  .calendar-header {
    flex-wrap: nowrap;
    gap: 10px;
  }

  .calendar-header h2#monthLabel {
    font-size: 24pt;
    white-space: nowrap;
  }

<script type="module">
import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, collection, getDocs, onSnapshot, deleteDoc,
  query, where, documentId
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config
// Avoid an unauthenticated Firestore request and retry on page load.
await window.CEP_AUTH_READY;

const firebaseConfig = {
  apiKey: "AIzaSy***************",
  authDomain: "cepx-f9d2a.firebaseapp.com",
  projectId: "cepx-f9d2a",
    storageBucket: "cepx-f9d2a.firebasestorage.app",
  messagingSenderId: "840696526325",
  appId: "1:840696526325:web:b9bcb4669fbfad066a1cbc"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentDate = new Date();
const calendarEl = document.getElementById('calendar');
const monthLabel = document.getElementById('monthLabel');
const monthSelect = document.getElementById('monthSelect');
const yearSelect = document.getElementById('yearSelect');
const todoInput = document.getElementById('newTodo');
const todoListEl = document.getElementById('todoList');

window.lastFocusedTextField = null;

document.addEventListener('focusin', (e) => {
  if (
    e.target.matches('textarea') ||
    e.target.matches('input[type="text"]')
  ) {
    window.lastFocusedTextField = e.target;
  }
});

const months = [...Array(12).keys()].map(i =>
  new Date(0, i).toLocaleString('default', { month: 'long' })
);

// Populate month/year selectors
function populateSelectors() {
  months.forEach((m, i) => {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = m;
    monthSelect.appendChild(option);
  });

  const thisYear = new Date().getFullYear();
  for (let y = thisYear - 5; y <= thisYear + 5; y++) {
    const option = document.createElement('option');
    option.value = y;
    option.textContent = y;
    yearSelect.appendChild(option);
  }

  monthSelect.addEventListener('change', () => {
  currentDate.setMonth(parseInt(monthSelect.value));

  const today = new Date();
  const viewingCurrentMonth =
    currentDate.getMonth() === today.getMonth() &&
    currentDate.getFullYear() === today.getFullYear();

  loadCalendar(viewingCurrentMonth);
});

yearSelect.addEventListener('change', () => {
  currentDate.setFullYear(parseInt(yearSelect.value));

  const today = new Date();
  const viewingCurrentMonth =
    currentDate.getMonth() === today.getMonth() &&
    currentDate.getFullYear() === today.getFullYear();

  loadCalendar(viewingCurrentMonth);
});
}

// Go to today
function goToToday() {
  currentDate = new Date();
  loadCalendar();
}

// Change month
function changeMonth(offset) {
  currentDate.setMonth(currentDate.getMonth() + offset);

  const today = new Date();
  const viewingCurrentMonth =
    currentDate.getMonth() === today.getMonth() &&
    currentDate.getFullYear() === today.getFullYear();

  loadCalendar(viewingCurrentMonth);
}
// Days in month
function getDaysInMonth(month, year) {
  return new Date(year, month + 1, 0).getDate();
}

// Day name
function getDayName(year, month, day) {
  return new Date(year, month, day).toLocaleDateString('en-US', { weekday: 'short' });
}

// Load calendar for a month
async function loadCalendar(scrollToday = true) {
  const month = currentDate.getMonth();
  const year = currentDate.getFullYear();
  calendarEl.innerHTML = '';
  monthLabel.textContent = `${months[month]} ${year}`;
  monthSelect.value = month;
  yearSelect.value = year;

  const daysInMonth = getDaysInMonth(month, year);
  const firstDay = new Date(year, month, 1).getDay() || 7;

  const docRef = doc(db, 'calendar', `${year}-${month + 1}`);
  const legacyChecklistsPromise = loadLegacyChecklistsForMonth(year, month + 1);
  let notes = {};
  const snap = await getDoc(docRef);
  if (snap.exists()) notes = snap.data();

  // Blank days before first day
  for (let i = 1; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    calendarEl.appendChild(empty);
  }

  // Days with notes
  for (let i = 1; i <= daysInMonth; i++) {
    const note = notes[i] || "";
	const day = document.createElement('div');
	day.className = 'day';

if (note.trim()) {
  day.classList.add('has-note');
}

    const today = new Date();
    if (i === today.getDate() &&
        month === today.getMonth() &&
        year === today.getFullYear()) {
      day.classList.add('today');
    }

    day.innerHTML = `<div class="date-number" role="button" tabindex="0">${getDayName(year, month, i)} ${i}</div>`;
    const dateNumber = day.querySelector('.date-number');
    const editor = createDayNoteEditor(note, year, month + 1, i, day);
    day.appendChild(editor);

    const insertTick = () => insertTickAtCaret(editor, year, month + 1, i, day);
    dateNumber.addEventListener('click', insertTick);
    dateNumber.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        insertTick();
      }
    });

    void legacyChecklistsPromise.then(legacyChecklists =>
      migrateLegacyChecklist(editor, year, month + 1, i, day, legacyChecklists.get(getChecklistDateKey(year, month + 1, i)))
    );

    calendarEl.appendChild(day);
  }
autoResizeAllDayTextareas();

if (scrollToday) {
  scrollToToday();
} else {
  scrollCalendarToTop();
}

}

// Save note
async function saveCalendar(year, month, day, note) {
  const ref = doc(db, 'calendar', `${year}-${month}`);
  try {
    await updateDoc(ref, { [day]: note });
  } catch {
    await setDoc(ref, { [day]: note }, { merge: true });
  }
}

function getChecklistDateKey(year, month, day) {
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

async function loadLegacyChecklistsForMonth(year, month) {
  const prefix = `${year}-${String(month).padStart(2, '0')}`;
  try {
    const checklistQuery = query(
      collection(db, 'dayChecklists'),
      where(documentId(), '>=', `${prefix}-01`),
      where(documentId(), '<=', `${prefix}-31`)
    );
    const snapshot = await getDocs(checklistQuery);
    return new Map(snapshot.docs.map(snapshotDoc => [snapshotDoc.id, snapshotDoc]));
  } catch (error) {
    console.error('Unable to load legacy day checklists:', error);
    return new Map();
  }
}

function getDayNoteText(editor) {
  return editor.innerText.replace(/\r/g, '');
}

function getNodeTextLength(node) {
  if (node.nodeType === Node.TEXT_NODE) return node.nodeValue.length;
  if (node.nodeName === 'BR') return 1;
  return [...node.childNodes].reduce((total, child) => total + getNodeTextLength(child), 0);
}

function getCaretOffset(editor) {
  const selection = window.getSelection();
  if (!selection.rangeCount || !editor.contains(selection.focusNode)) {
    return editor._lastCaretPosition ?? getDayNoteText(editor).length;
  }

  let offset = 0;
  const targetNode = selection.focusNode;
  const targetOffset = selection.focusOffset;
  let found = false;

  const visit = node => {
    if (found) return;

    if (node === targetNode) {
      if (node.nodeType === Node.TEXT_NODE) {
        offset += Math.min(targetOffset, node.nodeValue.length);
      } else {
        for (let index = 0; index < targetOffset; index++) {
          offset += getNodeTextLength(node.childNodes[index]);
        }
      }
      found = true;
      return;
    }

    if (node.nodeType === Node.TEXT_NODE) {
      offset += node.nodeValue.length;
      return;
    }

    if (node.nodeName === 'BR') {
      offset += 1;
      return;
    }

    [...node.childNodes].forEach(visit);
  };

  visit(editor);
  return found ? offset : getDayNoteText(editor).length;
}

function setCaretOffset(editor, requestedOffset) {
  const selection = window.getSelection();
  const range = document.createRange();
  let remaining = Math.max(0, requestedOffset);
  let placed = false;

  const visit = node => {
    if (placed) return;

    if (node.nodeType === Node.TEXT_NODE) {
      if (remaining <= node.nodeValue.length) {
        range.setStart(node, remaining);
        placed = true;
      } else {
        remaining -= node.nodeValue.length;
      }
      return;
    }

    if (node.nodeName === 'BR') {
      const parent = node.parentNode;
      const index = [...parent.childNodes].indexOf(node);
      if (remaining === 0) {
        range.setStart(parent, index);
        placed = true;
      } else {
        remaining -= 1;
      }
      return;
    }

    [...node.childNodes].forEach(visit);
  };

  visit(editor);
  if (!placed) range.selectNodeContents(editor), range.collapse(false);
  else range.collapse(true);

  selection.removeAllRanges();
  selection.addRange(range);
  editor._lastCaretPosition = requestedOffset;
}

function renderDayNoteText(editor, text, caretOffset = null) {
  const fragment = document.createDocumentFragment();
  const parts = String(text).split(/([☐☑✔]|\n)/);

  parts.forEach(part => {
    if (!part) return;

    if (part === '\n') {
      fragment.appendChild(document.createElement('br'));
      return;
    }

    if (part === '☐' || part === '☑' || part === '✔') {
      const isChecked = part === '☑' || part === '✔';
      const tick = document.createElement('span');
      tick.className = 'day-note-tick';
      tick.classList.toggle('checked', isChecked);
      tick.textContent = isChecked ? '✔' : '☐';
      tick.setAttribute('contenteditable', 'false');
      tick.setAttribute('role', 'checkbox');
      tick.setAttribute('aria-checked', String(isChecked));
      fragment.appendChild(tick);
      return;
    }

    fragment.appendChild(document.createTextNode(part));
  });

  editor.replaceChildren(fragment);
  if (caretOffset !== null) setCaretOffset(editor, caretOffset);
}

function updateDayNoteState(editor, year, month, day, dayElement) {
  const note = getDayNoteText(editor);
  dayElement.classList.toggle('has-note', !!note.trim());
  scheduleCalendarSave(year, month, day, note);
}

const pendingCalendarSaves = new Map();
function calendarSaveKey(year, month, day) {
  return `${year}-${month}-${day}`;
}
function scheduleCalendarSave(year, month, day, note) {
  const key = calendarSaveKey(year, month, day);
  const existing = pendingCalendarSaves.get(key);
  if (existing) window.clearTimeout(existing.timer);
  const pending = { year, month, day, note, timer: 0 };
  pending.timer = window.setTimeout(() => void flushCalendarSave(key), 400);
  pendingCalendarSaves.set(key, pending);
}
async function flushCalendarSave(key) {
  const pending = pendingCalendarSaves.get(key);
  if (!pending) return;
  window.clearTimeout(pending.timer);
  pendingCalendarSaves.delete(key);
  await saveCalendar(pending.year, pending.month, pending.day, pending.note);
}

function createDayNoteEditor(note, year, month, day, dayElement) {
  const editor = document.createElement('div');
  editor.className = 'day-note-editor';
  editor.contentEditable = 'true';
  editor.spellcheck = true;
  editor.setAttribute('role', 'textbox');
  editor.setAttribute('aria-multiline', 'true');
  editor.setAttribute('aria-label', 'Day note');
  editor._lastCaretPosition = String(note).length;
  editor._dirty = false;

  renderDayNoteText(editor, note);

  const rememberCaret = () => {
    editor._lastCaretPosition = getCaretOffset(editor);
  };

  editor.addEventListener('focus', rememberCaret);
  editor.addEventListener('keyup', rememberCaret);
  editor.addEventListener('pointerup', rememberCaret);
  editor.addEventListener('input', event => {
    editor._dirty = true;
    rememberCaret();

    if (event.data && /[☐☑✔]/.test(event.data)) {
      const text = getDayNoteText(editor);
      const caret = editor._lastCaretPosition;
      renderDayNoteText(editor, text, caret);
    }

    updateDayNoteState(editor, year, month, day, dayElement);
  });

  editor.addEventListener('blur', () => {
    const text = getDayNoteText(editor);
    renderDayNoteText(editor, text);
    void flushCalendarSave(calendarSaveKey(year, month, day));
  });

  editor.addEventListener('click', event => {
    const tick = event.target.closest('.day-note-tick');
    if (!tick || !editor.contains(tick)) return;

    event.preventDefault();
    const checked = tick.textContent === '☑' || tick.textContent === '✔';
    tick.textContent = checked ? '☐' : '✔';
    tick.classList.toggle('checked', !checked);
    tick.setAttribute('aria-checked', String(!checked));
    editor._dirty = true;
    updateDayNoteState(editor, year, month, day, dayElement);
  });

  return editor;
}

function insertTickAtCaret(editor, year, month, day, dayElement) {
  const note = getDayNoteText(editor);
  const position = Math.max(0, Math.min(note.length, editor._lastCaretPosition ?? note.length));
  const needsLeadingNewline = position > 0 && note[position - 1] !== '\n';
  const needsTrailingNewline = position < note.length && note[position] !== '\n';
  const insertion = `${needsLeadingNewline ? '\n' : ''}☐ ${needsTrailingNewline ? '\n' : ''}`;
  const updatedNote = note.slice(0, position) + insertion + note.slice(position);
  const newCaretPosition = position + insertion.length;

  editor._dirty = true;
  renderDayNoteText(editor, updatedNote, newCaretPosition);
  editor.focus();
  setCaretOffset(editor, newCaretPosition);
  updateDayNoteState(editor, year, month, day, dayElement);
}

async function migrateLegacyChecklist(editor, year, month, day, dayElement, snap) {
  try {
    const ref = doc(db, 'dayChecklists', getChecklistDateKey(year, month, day));
    if (!snap?.exists()) return;

    const data = snap.data();
    const items = Array.isArray(data.items) ? data.items : [];
    if (data.migratedToNote || items.length === 0 || editor._dirty) return;

    let note = getDayNoteText(editor);
    const positionedItems = items
      .map((item, index) => ({
        ...item,
        index,
        position: Number.isFinite(item.position) ? item.position : note.length
      }))
      .filter(item => String(item.text || '').trim())
      .sort((a, b) => b.position - a.position || b.index - a.index);

    positionedItems.forEach(item => {
      const position = Math.max(0, Math.min(note.length, item.position));
      const line = `${item.checked ? '✔' : '☐'} ${String(item.text).trim()}`;
      const leading = position > 0 && note[position - 1] !== '\n' ? '\n' : '';
      const trailing = position < note.length && note[position] !== '\n' ? '\n' : '';
      note = note.slice(0, position) + leading + line + trailing + note.slice(position);
    });

    if (editor._dirty) return;
    renderDayNoteText(editor, note);
    dayElement.classList.toggle('has-note', !!note.trim());
    void saveCalendar(year, month, day, note);
    await setDoc(ref, { migratedToNote: true, migratedAt: Date.now() }, { merge: true });
  } catch (error) {
    console.error('Unable to migrate legacy day checklist:', error);
  }
}

  textarea.style.height = 'auto';

function autoResizeAllDayTextareas() {

function scrollToToday() {

}

const newTodo = document.getElementById('newTodo');

const todoResizer = document.getElementById('todoResizer');
const todoPanel = document.getElementById('todoPanel');
const TODO_MIN_WIDTH = 180;
const TODO_DEFAULT_WIDTH = 350;
let todoWidth = Number(localStorage.getItem('homecalTodoWidth')) || TODO_DEFAULT_WIDTH;
let todoWidthBeforeCollapse = todoWidth;
let resizeStartX = 0;
let resizeStartWidth = 0;
let draggedTodoDivider = false;

function maximumTodoWidth() {
  if (window.matchMedia('(max-width: 600px)').matches) return 700;
  return Math.max(TODO_MIN_WIDTH, Math.min(700, window.innerWidth - 260));
}

function setTodoWidth(width, save = false) {
  todoWidth = Math.max(TODO_MIN_WIDTH, Math.min(maximumTodoWidth(), width));
  document.body.style.setProperty('--todo-width', `${todoWidth}px`);
  todoResizer.setAttribute('aria-valuemin', String(TODO_MIN_WIDTH));
  todoResizer.setAttribute('aria-valuemax', String(maximumTodoWidth()));
  todoResizer.setAttribute('aria-valuenow', String(Math.round(todoWidth)));
  if (save) localStorage.setItem('homecalTodoWidth', String(Math.round(todoWidth)));
  requestAnimationFrame(() => {
    todoPanel.querySelectorAll('.todo-item textarea').forEach(autoResizeTextarea);
  });
}

function setTodoCollapsed(collapsed) {
  if (collapsed) todoWidthBeforeCollapse = todoWidth;
  document.body.classList.toggle('todo-collapsed', collapsed);
  todoResizer.setAttribute('aria-expanded', String(!collapsed));
  todoResizer.title = collapsed
    ? 'Click to restore the to-do list'
    : 'Drag to resize; click to minimize';
  localStorage.setItem('homecalTodoCollapsed', String(collapsed));
  if (!collapsed) setTodoWidth(todoWidthBeforeCollapse || TODO_DEFAULT_WIDTH);
}

setTodoWidth(todoWidth);
setTodoCollapsed(localStorage.getItem('homecalTodoCollapsed') === 'true');

todoResizer.addEventListener('pointerdown', event => {
  resizeStartX = event.clientX;
  resizeStartWidth = todoWidth;
  draggedTodoDivider = false;
  todoResizer.setPointerCapture(event.pointerId);
  document.body.classList.add('todo-resizing');
});

todoResizer.addEventListener('pointermove', event => {
  if (!todoResizer.hasPointerCapture(event.pointerId)) return;
  const movement = resizeStartX - event.clientX;
  if (Math.abs(movement) > 3) draggedTodoDivider = true;
  if (draggedTodoDivider) {
    if (document.body.classList.contains('todo-collapsed')) setTodoCollapsed(false);
    setTodoWidth(resizeStartWidth + movement);
  }
});

todoResizer.addEventListener('pointerup', event => {
  if (todoResizer.hasPointerCapture(event.pointerId)) {
    todoResizer.releasePointerCapture(event.pointerId);
  }
  document.body.classList.remove('todo-resizing');
  if (draggedTodoDivider) setTodoWidth(todoWidth, true);
  else setTodoCollapsed(!document.body.classList.contains('todo-collapsed'));
});

todoResizer.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    setTodoCollapsed(!document.body.classList.contains('todo-collapsed'));
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    setTodoCollapsed(false);
    setTodoWidth(todoWidth + (event.key === 'ArrowLeft' ? 20 : -20), true);
  }
});

newTodo.addEventListener('input', () => autoResizeTextarea(newTodo));

// ensure fresh reset on load
autoResizeTextarea(newTodo);

const todoRecords = new Map();
const todoElements = new Map();
const pendingTextareaResizes = new Set();
let textareaResizeFrame = 0;

function scheduleTextareaResize(textarea) {
  if (!textarea?.isConnected) return;
  pendingTextareaResizes.add(textarea);
  if (textareaResizeFrame) return;
  textareaResizeFrame = requestAnimationFrame(() => {
    textareaResizeFrame = 0;
    pendingTextareaResizes.forEach(field => {
      if (field.isConnected) autoResizeTextarea(field);
    });
    pendingTextareaResizes.clear();
  });
}

function sortTodos(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (!a.done && a.priority !== b.priority) return a.priority ? -1 : 1;
  if (a.createdAt !== b.createdAt) return b.createdAt - a.createdAt;
  return a.text.localeCompare(b.text);
}

function refreshTodoOrder() {
  const orderedElements = [...todoRecords.values()]
    .sort(sortTodos)
    .map(todo => todoElements.get(todo.id))
    .filter(Boolean);
  orderedElements.forEach((element, index) => {
    const currentElement = todoListEl.children[index] || null;
    if (currentElement !== element) {
      todoListEl.insertBefore(element, currentElement);
    }
  });
}

async function addTodo() {
  const value = todoInput.value.trim();

  if (value) {
    const ref = doc(collection(db, 'todos'));
    const optimisticTodo = {
      id: ref.id,
      text: value,
      done: false,
      priority: false,
      createdAt: Date.now()
    };

    todoInput.value = '';
    autoResizeTextarea(todoInput);

    todoRecords.set(ref.id, optimisticTodo);
    renderTodoItem(ref.id, value, false, false, optimisticTodo.createdAt);
    refreshTodoOrder();

    try {
      await setDoc(ref, {
        text: optimisticTodo.text,
        done: false,
        priority: false,
        createdAt: optimisticTodo.createdAt
      });
    } catch (error) {
      todoRecords.delete(ref.id);
      todoElements.get(ref.id)?.remove();
      todoElements.delete(ref.id);
      todoInput.value = value;
      autoResizeTextarea(todoInput);
      console.error('Unable to add to-do:', error);
    }
  }
}

function enableTodoHoldPriority(item, id) {
  let holdTimer = null;
  let startX = 0;
  let startY = 0;

  const cancelHold = () => {
    clearTimeout(holdTimer);
    holdTimer = null;
  };

  item.addEventListener('pointerdown', event => {
    if (event.button !== 0 || event.target.closest('button, input[type="checkbox"]')) return;
    const currentTodo = todoRecords.get(id);
    const done = !!currentTodo?.done;
    if (done) event.preventDefault();
    startX = event.clientX;
    startY = event.clientY;
    cancelHold();
    holdTimer = setTimeout(async () => {
      holdTimer = null;
      if (done) {
        item.classList.toggle('delete-confirming');
        return;
      }

      const previousPriority = !!currentTodo?.priority;
      const priority = !previousPriority;
      currentTodo.priority = priority;
      item.classList.toggle('priority', priority);
      refreshTodoOrder();
      try {
        await updateDoc(doc(db, 'todos', id), { priority });
      } catch (error) {
        console.error('Unable to update priority:', error);
        currentTodo.priority = previousPriority;
        item.classList.toggle('priority', previousPriority);
        refreshTodoOrder();
      }
    }, 600);
  });

  item.addEventListener('pointermove', event => {
    if (Math.abs(event.clientX - startX) > 8 || Math.abs(event.clientY - startY) > 8) {
      cancelHold();
    }
  });

  item.addEventListener('pointerup', cancelHold);
  item.addEventListener('pointercancel', cancelHold);
  item.addEventListener('contextmenu', event => {
    event.preventDefault();
  });
}

function syncTodoElement(item, todo) {
  const checkbox = item.querySelector('input[type="checkbox"]');
  const input = item.querySelector('textarea');

  item.classList.toggle('done', todo.done);
  item.classList.toggle('priority', todo.priority && !todo.done);
  item.classList.toggle('delete-confirming', false);
  checkbox.checked = todo.done;
  input.readOnly = todo.done;
  if (todo.done) input.tabIndex = -1;
  else input.removeAttribute('tabindex');

  if (document.activeElement !== input && input.value !== todo.text) {
    input.value = todo.text;
  }
  if (document.activeElement !== input || input.value === todo.text) {
    input.dataset.lastSavedText = todo.text;
  }
  scheduleTextareaResize(input);
}

function renderTodoItem(id, text, done, priority = false, createdAt = 0) {
  const todo = todoRecords.get(id) || { id, text, done, priority, createdAt };
  todoRecords.set(id, todo);

  const existingItem = todoElements.get(id);
  if (existingItem) {
    syncTodoElement(existingItem, todo);
    return existingItem;
  }

  const item = document.createElement('div');
  item.className = 'todo-item';
  item.dataset.todoId = id;

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';

  checkbox.onchange = async () => {
    const currentTodo = todoRecords.get(id);
    if (!currentTodo) return;
    const previousDone = currentTodo.done;
    currentTodo.done = checkbox.checked;
    syncTodoElement(item, currentTodo);
    refreshTodoOrder();
    try {
      await updateDoc(doc(db, 'todos', id), { done: currentTodo.done });
    } catch (error) {
      currentTodo.done = previousDone;
      syncTodoElement(item, currentTodo);
      refreshTodoOrder();
      console.error('Unable to update to-do:', error);
    }
  };

  const input = document.createElement('textarea');
  input.rows = 1;
  input.dataset.todoId = id;
  input.value = todo.text;
  input.dataset.lastSavedText = todo.text;
  input.style.flex = '1';
  input.style.border = 'none';
  input.style.background = 'transparent';
  input.style.resize = 'none';
  input.style.overflow = 'hidden';

  let saveTimer = null;

  const saveTodoText = async () => {
    clearTimeout(saveTimer);
    const nextText = input.value;
    const currentTodo = todoRecords.get(id);
    if (!currentTodo || nextText === input.dataset.lastSavedText) return;
    const previousText = currentTodo.text;
    currentTodo.text = nextText;
    input.dataset.lastSavedText = nextText;
    try {
      await updateDoc(doc(db, 'todos', id), { text: nextText });
    } catch (error) {
      currentTodo.text = previousText;
      input.dataset.lastSavedText = previousText;
      console.error('Unable to autosave to-do:', error);
    }
  };

  input.addEventListener('input', () => {
    if (input.readOnly) return;
    scheduleTextareaResize(input);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveTodoText, 600);
  });
  input.addEventListener('blur', saveTodoText);

  const deleteTag = document.createElement('button');
  deleteTag.type = 'button';
  deleteTag.className = 'delete-tag';
  deleteTag.textContent = '🗑️';
  deleteTag.title = 'Delete completed task';
  deleteTag.setAttribute('aria-label', 'Delete completed task');
  deleteTag.onclick = async () => {
    const deletedTodo = todoRecords.get(id);
    if (!deletedTodo) return;
    todoRecords.delete(id);
    todoElements.delete(id);
    item.remove();
    refreshTodoOrder();
    try {
      await deleteDoc(doc(db, 'todos', id));
    } catch (error) {
      todoRecords.set(id, deletedTodo);
      todoElements.set(id, item);
      syncTodoElement(item, deletedTodo);
      refreshTodoOrder();
      console.error('Unable to delete to-do:', error);
    }
  };

  item.append(checkbox, input, deleteTag);
  enableTodoHoldPriority(item, id);
  todoElements.set(id, item);
  syncTodoElement(item, todo);
  scheduleTextareaResize(input);
  return item;
}

// Load todos
function loadTodos() {
  const ref = collection(db, 'todos');

  onSnapshot(ref, snap => {
    const previousScrollTop = todoListEl.scrollTop;

    snap.docChanges().forEach(change => {
      const id = change.doc.id;
      if (change.type === 'removed') {
        todoRecords.delete(id);
        todoElements.get(id)?.remove();
        todoElements.delete(id);
        return;
      }

      const data = change.doc.data();
      const todo = {
        id,
        text: data.text || '',
        done: !!data.done,
        priority: !!data.priority,
        createdAt: data.createdAt || 0
      };
      todoRecords.set(id, todo);
      renderTodoItem(id, todo.text, todo.done, todo.priority, todo.createdAt);
    });

    refreshTodoOrder();
    todoListEl.scrollTop = previousScrollTop;
  });
}

// Escape special regex characters
function escapeRegex(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// Highlight searched text safely
function highlightSearchTerm(text, term) {
  const safeTerm = escapeRegex(term);
  const regex = new RegExp(`(${safeTerm})`, 'gi');

  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(regex, '<span class="search-highlight">$1</span>');
}

// Search notes across all months
async function filterNotes() {
  const term = document.getElementById("noteFilterInput").value.trim();

  if (!term) {
    loadCalendar();
    return;
  }

  const safeTerm = escapeRegex(term);
  const regExp = new RegExp(safeTerm, 'i');

  const calendarRef = collection(db, 'calendar');
  const allDocs = await getDocs(calendarRef);

  calendarEl.innerHTML = '';

  const results = [];

  allDocs.forEach(docSnap => {
    const [year, month] = docSnap.id.split('-').map(Number);
    const notes = docSnap.data();

    Object.keys(notes).forEach(dayNum => {
      const note = notes[dayNum] || '';

      if (regExp.test(note)) {
        results.push({
          year,
          month,
          day: Number(dayNum),
          note
        });
      }
    });
  });

  results.sort((a, b) => {
    const dateA = new Date(a.year, a.month - 1, a.day);
    const dateB = new Date(b.year, b.month - 1, b.day);
    return dateB - dateA;
  });

  if (results.length === 0) {
    calendarEl.innerHTML = `
      <div class="no-search-results">
        No notes found for "${term}"
      </div>
    `;
    return;
  }

  let currentGroup = '';

  results.forEach(result => {
    const groupName = `${months[result.month - 1]} ${result.year}`;

    if (groupName !== currentGroup) {
      currentGroup = groupName;

      const header = document.createElement('div');
      header.className = 'month-header';
      header.textContent = groupName;
      calendarEl.appendChild(header);
    }

    const day = document.createElement('div');
    day.className = 'day match';

    day.innerHTML = `
  <div class="date-number">${getDayName(result.year, result.month - 1, result.day)} ${result.day}</div>
  <div class="search-note">${highlightSearchTerm(result.note.trimStart(), term)}</div>
`;

    calendarEl.appendChild(day);
  });

  scrollCalendarToTop();
}

let filterNotesTimer = 0;
function scheduleFilterNotes() {
  window.clearTimeout(filterNotesTimer);
  if (!document.getElementById('noteFilterInput').value.trim()) {
    void filterNotes();
    return;
  }
  filterNotesTimer = window.setTimeout(() => void filterNotes(), 400);
}
