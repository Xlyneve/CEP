<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xgpt migration</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #27242a; }
    button { margin: 4px 8px 12px 0; padding: 10px 14px; }
    pre { white-space: pre-wrap; background: #f2f0f1; padding: 16px; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Xgpt copy-only migration</h1>
  <p>This copies Xgpt notes and concept media into the main CEP project. It never deletes source data.</p>
  <button id="sourceSignIn">1. Sign in to source</button>
  <button id="targetSignIn">2. Sign in to CEP</button>
  <button id="copy" disabled>3. Copy and verify</button>
  <pre id="status">Waiting for both project sessions.</pre>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
  <script>
    const allowedEmail = 'xeve06@gmail.com';
    const sourceApp = firebase.initializeApp({
      apiKey: 'AIzaSyDtv3x9PAMzZUW6yVuUSLgLzA0ejcDidF4',
      authDomain: 'notes-chat-c5ff3.firebaseapp.com',
      projectId: 'notes-chat-c5ff3',
      storageBucket: 'notes-chat-c5ff3.firebasestorage.app',
      messagingSenderId: '597780727252',
      appId: '1:597780727252:web:8407eb4096dbe301d74241'
    }, 'source');
    const targetApp = firebase.initializeApp({
      apiKey: 'AIzaSyAgYsVQNEOyQa41NkXXT2VuKClqXAxfG1Q',
      authDomain: 'cepx-f9d2a.firebaseapp.com',
      projectId: 'cepx-f9d2a',
      storageBucket: 'cepx-f9d2a.firebasestorage.app',
      messagingSenderId: '840696526325',
      appId: '1:840696526325:web:b9bcb4669fbfad066a1cbc'
    }, 'target');
    const sourceAuth = firebase.auth(sourceApp);
    const targetAuth = firebase.auth(targetApp);
    const sourceDb = firebase.firestore(sourceApp);
    const targetDb = firebase.firestore(targetApp);
    const sourceStorage = firebase.storage(sourceApp);
    const targetStorage = firebase.storage(targetApp);
    const status = document.getElementById('status');
    const copyButton = document.getElementById('copy');
    const collections = ['notes', 'concept_defs', 'concept_media'];

    const log = message => { status.textContent += `\n${message}`; };
    const provider = () => {
      const value = new firebase.auth.GoogleAuthProvider();
      value.setCustomParameters({ login_hint: allowedEmail });
      return value;
    };
    const authorized = user => user?.emailVerified && String(user.email || '').toLowerCase() === allowedEmail;
    const updateReady = () => {
      const sourceReady = authorized(sourceAuth.currentUser);
      const targetReady = authorized(targetAuth.currentUser);
      copyButton.disabled = !(sourceReady && targetReady);
      status.textContent = `Source: ${sourceReady ? 'ready' : 'sign in required'}\nCEP: ${targetReady ? 'ready' : 'sign in required'}`;
    };
    sourceAuth.onAuthStateChanged(updateReady);
    targetAuth.onAuthStateChanged(updateReady);
    document.getElementById('sourceSignIn').onclick = () => sourceAuth.signInWithPopup(provider());
    document.getElementById('targetSignIn').onclick = () => targetAuth.signInWithPopup(provider());

    async function copyCollection(name) {
      const sourceSnapshot = await sourceDb.collection(name).get();
      log(`${name}: copying ${sourceSnapshot.size} documents`);
      let batch = targetDb.batch();
      let batchSize = 0;
      for (const sourceDocument of sourceSnapshot.docs) {
        const data = { ...sourceDocument.data() };
        if (name === 'concept_media' && data.storagePath) {
          const sourceRef = sourceStorage.ref().child(data.storagePath);
          const sourceUrl = await sourceRef.getDownloadURL();
          const response = await fetch(sourceUrl);
          if (!response.ok) throw new Error(`Could not download ${data.storagePath}: ${response.status}`);
          const blob = await response.blob();
          const targetRef = targetStorage.ref().child(data.storagePath);
          await targetRef.put(blob, { contentType: blob.type || 'image/jpeg' });
          data.imageUrl = await targetRef.getDownloadURL();
        }
        batch.set(targetDb.collection(name).doc(sourceDocument.id), data);
        batchSize++;
        if (batchSize === 400) {
          await batch.commit();
          batch = targetDb.batch();
          batchSize = 0;
        }
      }
      if (batchSize) await batch.commit();
      const targetSnapshot = await targetDb.collection(name).get();
      if (targetSnapshot.size !== sourceSnapshot.size) {
        throw new Error(`${name}: verification failed (${sourceSnapshot.size} source, ${targetSnapshot.size} CEP)`);
      }
      log(`${name}: verified ${targetSnapshot.size} documents`);
      return sourceSnapshot.size;
    }

    copyButton.onclick = async () => {
      copyButton.disabled = true;
      status.textContent = 'Starting copy. Source data will not be modified.';
      try {
        const counts = {};
        for (const name of collections) counts[name] = await copyCollection(name);
        log(`COMPLETE: ${JSON.stringify(counts)}`);
      } catch (error) {
        console.error(error);
        log(`FAILED: ${error.code || ''} ${error.message}`);
      } finally {
        copyButton.disabled = false;
      }
    };
  </script>
</body>
</html>
